<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Planilla de Control de Extintores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1400px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Panel de filtros */
        .filtros-panel { background: #ecf0f1; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { flex: 1; min-width: 190px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        
        .btn-search { background: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-print { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }

        #mensajeEstado { margin-top: 15px; font-weight: bold; color: #e67e22; text-align: center; }

        /* Contenedor general */
        .planilla-wrapper { 
            display: none; 
            background: white; 
            width: 100%; 
            overflow-x: auto; 
            padding-bottom: 15px;
        }

        /* Cada página ahora es un contenedor FLEX para alinear tabla y referencias */
        .pagina-hoja { 
            display: flex; 
            flex-direction: row;
            align-items: flex-start;
            gap: 15px;
            width: 100%; 
            margin-bottom: 40px; 
        }
        
        /* TABLA PRINCIPAL */
        .tabla-principal { 
            width: 920px; 
            min-width: 920px; 
            margin: 0; 
            border-collapse: collapse; 
            border: 2px solid #000; 
            font-family: Arial, sans-serif; 
            background-color: #fff; 
            table-layout: fixed; 
        }
        
        /* TABLA DE REFERENCIAS (PANEL DERECHO) */
        .tabla-referencias {
            width: 145px;
            min-width: 145px;
            border-collapse: collapse; 
            border: 2px solid #000; 
            font-family: Arial, sans-serif; 
            background-color: #fff; 
        }

        /* Estilos generales de celdas */
        .th-membrete { border: 1.5px solid #000; padding: 6px; font-size: 12px; vertical-align: middle; background-color: #fff !important; color: #000 !important; }
        .titulo-cliente { font-size: 16px; font-weight: bold; text-align: center; background-color: #f2f2f2 !important; }
        .titulo-control { font-size: 14px; font-weight: bold; text-align: center; }
        .titulo-planilla { font-size: 12px; font-weight: bold; text-align: center; }
        .lbl-campo { font-weight: bold; font-size: 11px; }

        /* Cabeceras normales */
        .th-columna {
            border: 1.5px solid #000;
            padding: 5px 2px;
            text-align: center;
            font-size: 9px;
            background-color: #fff;
            color: #000;
            font-weight: bold;
            vertical-align: middle;
            user-select: none;
            transition: background 0.2s;
            line-height: 1.1;
        }
        .th-columna[onclick] { cursor: pointer; }
        .th-columna[onclick]:hover { background-color: #e2e8f0; }

        /* Contenedor interno para texto vertical a 90 GRADOS */
        .texto-vertical {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            display: inline-block;
            height: 75px; 
            font-size: 8.5px;
            padding: 2px 0;
        }

        /* Texto vertical del panel de referencias */
        .texto-vertical-ref {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            display: inline-block;
            height: 120px; 
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Celdas de datos tabla principal */
        .tabla-principal td { 
            border: 1.5px solid #000; 
            padding: 4px 2px; 
            text-align: center; 
            font-size: 10px; 
            word-wrap: break-word;
            overflow: hidden;
        }

        /* Celdas del panel de referencias */
        .tabla-referencias td {
            border: 1.5px solid #000; 
            padding: 3px 5px; 
            text-align: left; 
            font-size: 8px; 
            font-weight: bold;
            text-transform: uppercase;
        }
        .ref-center { text-align: center !important; }
        .ref-box { height: 18px; } /* Cajas vacías para firma y espaciador */
        
        /* CLASES PARA ELIMINAR BORDES INTERNOS EN EL BLOQUE DE FIRMA */
        .no-b-bottom { border-bottom: none !important; padding-bottom: 2px !important; }
        .no-b-mid { border-top: none !important; border-bottom: none !important; padding-top: 2px !important; padding-bottom: 2px !important; }
        .no-b-top { border-top: none !important; padding-top: 2px !important; padding-bottom: 20px !important; }

        .texto-izq { text-align: left !important; padding-left: 4px !important; }
        .badge-nuevo { background: #2ecc71; color: white; padding: 2px 4px; border-radius: 3px; font-weight: bold; font-size: 9px;}

        /* CONFIGURACIÓN DE IMPRESIÓN */
        @media print {
            @page { size: A4 landscape; margin: 1cm; }
            body * { visibility: hidden; }
            .container, .container * { visibility: visible; }
            .container { position: absolute; left: 0; top: 0; width: 100% !important; box-shadow: none; padding: 0; }
            .filtros-panel, .btn-print, .btn-search, h2, #mensajeEstado { display: none !important; }
            .planilla-wrapper { display: block !important; overflow: visible; }
            
            /* CONGELA LOS TAMAÑOS AL IMPRIMIR */
            .pagina-hoja { page-break-after: always; break-after: page; margin-bottom: 0; }
            .tabla-principal { width: 920px !important; }
            .tabla-referencias { width: 145px !important; }
        }
        @media (max-width: 768px) { .filtros-panel { flex-direction: column; } .form-group, .btn-search, .btn-print { width: 100%; } }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 Generar Planilla de Control de Extintores</h2>

    <div class="filtros-panel">
        <div class="form-group">
            <label for="filtroCliente">Seleccionar Cliente:</label>
            <select id="filtroCliente" onchange="generarInforme()">
                <option value="">-- Seleccioná un cliente --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="tipoFecha">Tipo de Vencimiento:</label>
            <select id="tipoFecha">
                <option value="vto_carga">Vencimiento de Carga</option>
                <option value="vto_prueb_hidr">Vencimiento Prueba Hidráulica (P.H.)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="fechaDesde">Desde (DD/MM/AAAA):</label>
            <input type="text" id="fechaDesde" placeholder="01/01/2026">
        </div>
        <div class="form-group">
            <label for="fechaHasta">Hasta (DD/MM/AAAA):</label>
            <input type="text" id="fechaHasta" placeholder="31/12/2026">
        </div>
        <button class="btn-search" onclick="generarInforme()">📊 Actualizar Vista</button>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Planilla A4</button>
    </div>

    <div id="mensajeEstado">Por favor, seleccioná un cliente para ver la planilla.</div>

    <div id="planillaWrapper" class="planilla-wrapper"></div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let datosGlobales = []; 
    let columnaOrdenActual = 'extintor_numero';
    let ascendenteActual = true;

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) return `${partes[1]}/${partes[0]}`; 
        return fechaSQL;
    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length === 3) {
            let dia = partes[0].padStart(2, '0');
            let mes = partes[1].padStart(2, '0');
            let anio = partes[2];
            return `${anio}-${mes}-${dia}`;
        }
        return null;
    }

    function renderBool(valor) {
        return valor === true || valor === "true" || valor === 1 ? "X" : "";
    }

    window.addEventListener("load", async function() {
        const { data, error } = await _supabase.from('extintores').select('cliente').not('cliente', 'is', null);
        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("filtroCliente");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }
        const hoy = new Date();
        window.fechaHoyStr = `${String(hoy.getDate()).padStart(2, '0')}/${String(hoy.getMonth() + 1).padStart(2, '0')}/${hoy.getFullYear()}`;
        document.getElementById("fechaDesde").value = `01/01/${hoy.getFullYear()}`;
        document.getElementById("fechaHasta").value = `31/12/${hoy.getFullYear()}`;
    });

    async function generarInforme() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const campoFecha = document.getElementById("tipoFecha").value;
        const inputDesde = document.getElementById("fechaDesde").value;
        const inputHasta = document.getElementById("fechaHasta").value;
        const mensaje = document.getElementById("mensajeEstado");
        const wrapper = document.getElementById("planillaWrapper");

        if (!cliente) {
            mensaje.textContent = "Por favor, seleccioná un cliente para generar la planilla.";
            wrapper.style.display = "none";
            return;
        }

        const fechaDesdeSQL = formatearFechaSQL(inputDesde);
        const fechaHastaSQL = formatearFechaSQL(inputHasta);

        if ((inputDesde && !fechaDesdeSQL) || (inputHasta && !fechaHastaSQL)) {
            alert("Formato de fecha inválido. Utilizá DD/MM/AAAA.");
            return;
        }

        mensaje.textContent = "Generando planilla...";
        wrapper.innerHTML = "";

        let query = _supabase.from('extintores').select('*').eq('cliente', cliente);
        if (fechaDesdeSQL && fechaHastaSQL) query = query.gte(campoFecha, fechaDesdeSQL).lte(campoFecha, fechaHastaSQL);

        const { data, error } = await query.limit(500);

        if (error) {
            console.error("Error:", error);
            mensaje.textContent = "Ocurrió un error al consultar la base de datos.";
            wrapper.style.display = "none";
            return;
        }

        if (data.length === 0) {
            mensaje.textContent = "No se encontraron extintores.";
            wrapper.style.display = "none";
            return;
        }

        datosGlobales = data;
        renderizarPlanilla();
    }

    function ordenarPor(columna) {
        if (columnaOrdenActual === columna) { ascendenteActual = !ascendenteActual; } 
        else { columnaOrdenActual = columna; ascendenteActual = true; }
        renderizarPlanilla();
    }

    function renderizarPlanilla() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const wrapper = document.getElementById("planillaWrapper");
        const mensaje = document.getElementById("mensajeEstado");
        if (datosGlobales.length === 0) return;

        datosGlobales.sort((a, b) => {
            let valA = a[columnaOrdenActual] || "";
            let valB = b[columnaOrdenActual] || "";
            if (!isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "") {
                valA = Number(valA); valB = Number(valB);
            }
            if (valA < valB) return ascendenteActual ? -1 : 1;
            if (valA > valB) return ascendenteActual ? 1 : -1;
            return 0;
        });

        wrapper.innerHTML = "";
        mensaje.textContent = `Planilla lista con ${datosGlobales.length} registros.`;
        wrapper.style.display = "block";

        const registrosPorPagina = 25;
        const totalPaginas = Math.ceil(datosGlobales.length / registrosPorPagina);

        const flecha = (col) => {
            if (columnaOrdenActual !== col) return " ↕";
            return ascendenteActual ? " ▲" : " ▼";
        };

        // ESTRUCTURA DEL PANEL LATERAL
        const panelReferenciasHTML = `
            <table class="tabla-referencias">
                <tr><td class="ref-center" style="font-size:9px; padding:6px 0;">FRECUENCIA: 30 DIAS</td></tr>
                <tr><td class="ref-center"><div class="texto-vertical-ref">REFERENCIAS</div></td></tr>
                <tr><td>D - DESCARGADO</td></tr>
                <tr><td>R - REEMPLAZAR</td></tr>
                <tr><td>P - PINTAR</td></tr>
                <tr><td>I - IDENTIFICAR</td></tr>
                <tr><td>O - OBSTRUIDO</td></tr>
                <tr><td>V - VENCIDO</td></tr>
                <tr><td>N/A - NO APLICA</td></tr>
                <tr><td>L - LIBRE</td></tr>
                
                <tr><td class="ref-box"></td></tr>
                
                <!-- BLOQUE SIN BORDES HORIZONTALES -->
                <tr><td class="ref-center no-b-bottom">SERVICIO TERCERIZADO</td></tr>
                <tr><td class="ref-center no-b-mid">VIVATEC</td></tr>
                <tr><td class="ref-center no-b-mid">RESPONSABLE:</td></tr>
                <tr><td class="ref-center no-b-mid">IGNACIO REPETTO</td></tr>
                <tr><td class="ref-center no-b-mid">ING. INDUSTRIAL</td></tr>
                <tr><td class="ref-center no-b-mid">C.I.P.B.A - MAT.51142</td></tr>
                <tr><td class="no-b-top">FIRMA:</td></tr> 
                
                <!-- 3 RENGLONES VACÍOS -->
                <tr><td class="ref-box"></td></tr>
                <tr><td class="ref-box"></td></tr>
                <tr><td class="ref-box"></td></tr>
                
                <!-- RENGLONES FINALES (Borde divisor eliminado con estilos en línea) -->
                <tr><td class="ref-center" style="font-size: 11px; font-weight: 900; border-bottom: none !important;">VIVATEC</td></tr>
                <tr><td class="ref-center" style="border-top: none !important;">REGISTRO DPS 382</td></tr>
            </table>
        `;

        for (let i = 0; i < totalPaginas; i++) {
            const inicio = i * registrosPorPagina;
            const loteRegistros = datosGlobales.slice(inicio, inicio + registrosPorPagina);
            const numeroHoja = i + 1;
            
            const divPagina = document.createElement("div");
            divPagina.className = "pagina-hoja";

            let htmlTabla = `
                <table class="tabla-principal">
                    <colgroup>
                        <col style="width: 60px;">  <!-- N° -->
                        <col style="width: 45px;">  <!-- TIPO -->
                        <col style="width: 40px;">  <!-- KG -->
                        <col style="width: 45px;">  <!-- FAB -->
                        <col style="width: 90px;">  <!-- MARCA -->
                        <col style="width: 65px;">  <!-- VTO PH -->
                        <col style="width: 65px;">  <!-- VTO C -->
                        <col style="width: 70px;">  <!-- N-DPS -->
                        <col style="width: 55px;">  <!-- PUESTO -->
                        <col style="width: 220px;"> <!-- UBICACION -->
                        <!-- BOOLEANAS (20px) -->
                        <col style="width: 20px;"> 
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th colspan="5" class="th-membrete titulo-cliente">${cliente.toUpperCase()}</th>
                            <th colspan="7" class="th-membrete titulo-control">CONTROL DE EXTINTORES</th>
                            <th colspan="7" class="th-membrete titulo-planilla">PLANILLA DE REVISION N° 1</th>
                        </tr>
                        <tr>
                            <th colspan="12" class="th-membrete" style="text-align: left; padding-left: 10px;">
                                <span class="lbl-campo">FECHA DE REVISION:</span> ${window.fechaHoyStr}
                            </th>
                            <th colspan="7" class="th-membrete" style="text-align: left; padding-left: 10px;">
                                <span class="lbl-campo">Hoja ${numeroHoja}/${totalPaginas}</span>
                            </th>
                        </tr>
                        <tr>
                            <th class="th-columna" onclick="ordenarPor('extintor_numero')">N°${flecha('extintor_numero')}</th>
                            <th class="th-columna" onclick="ordenarPor('tipo')">TIPO${flecha('tipo')}</th>
                            <th class="th-columna" onclick="ordenarPor('capacidad')">KG${flecha('capacidad')}</th>
                            <th class="th-columna" onclick="ordenarPor('ano_fab')">FAB${flecha('ano_fab')}</th>
                            <th class="th-columna" onclick="ordenarPor('marca')">MARCA${flecha('marca')}</th>
                            <th class="th-columna" onclick="ordenarPor('vto_prueb_hidr')">VTO. PH${flecha('vto_prueb_hidr')}</th>
                            <th class="th-columna" onclick="ordenarPor('vto_carga')">VTO. C.${flecha('vto_carga')}</th>
                            <th class="th-columna" onclick="ordenarPor('numero_dps')">N°-DPS${flecha('numero_dps')}</th>
                            <th class="th-columna" onclick="ordenarPor('identificacion_puesto')">PUESTO${flecha('identificacion_puesto')}</th>
                            <th class="th-columna" onclick="ordenarPor('ubicacion')">UBICACIÓN${flecha('ubicacion')}</th>
                            
                            <!-- COLUMNAS BOOLEANAS -->
                            <th class="th-columna"><div class="texto-vertical">CARGA</div></th>
                            <th class="th-columna"><div class="texto-vertical">PRECINTO</div></th>
                            <th class="th-columna"><div class="texto-vertical">BALIZA</div></th>
                            <th class="th-columna"><div class="texto-vertical">RECIPIENTE</div></th>
                            <th class="th-columna"><div class="texto-vertical">MANOMETRO</div></th>
                            <th class="th-columna"><div class="texto-vertical">MANGUERA</div></th>
                            <th class="th-columna"><div class="texto-vertical">TOBERA</div></th>
                            <th class="th-columna"><div class="texto-vertical">GABINETE</div></th>
                            <th class="th-columna"><div class="texto-vertical">ACCESO</div></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            loteRegistros.forEach(ex => {
                let formatoDps = ex.numero_dps || "-";
                if (formatoDps === "NUEVO") formatoDps = `<span class="badge badge-nuevo">NUEVO</span>`;

                let txtUbicacion = ex.ubicacion || "-";
                if (txtUbicacion.length > 32) txtUbicacion = txtUbicacion.substring(0, 32) + "...";

                let txtNumero = ex.extintor_numero || "-";
                if (String(txtNumero).length > 8) txtNumero = String(txtNumero).substring(0, 8);

                htmlTabla += `
                    <tr>
                        <td><strong>${txtNumero}</strong></td>
                        <td>${ex.tipo || "-"}</td>
                        <td>${ex.capacidad || "-"}</td>
                        <td>${ex.ano_fab || "-"}</td>
                        <td>${ex.marca || "-"}</td>
                        <td>${formatearFechaWeb(ex.vto_prueb_hidr)}</td>
                        <td>${formatearFechaWeb(ex.vto_carga)}</td>
                        <td>${formatoDps}</td>
                        <td>${ex.identificacion_puesto || "-"}</td>
                        <td class="texto-izq" title="${ex.ubicacion || ''}">${txtUbicacion}</td>
                        
                        <td><strong>${renderBool(ex.carga)}</strong></td>
                        <td><strong>${renderBool(ex.precinto)}</strong></td>
                        <td><strong>${renderBool(ex.baliza)}</strong></td>
                        <td><strong>${renderBool(ex.recipiente)}</strong></td>
                        <td><strong>${renderBool(ex.manometro)}</strong></td>
                        <td><strong>${renderBool(ex.manguera)}</strong></td>
                        <td><strong>${renderBool(ex.tobera)}</strong></td>
                        <td><strong>${renderBool(ex.gabinete)}</strong></td>
                        <td><strong>${renderBool(ex.acceso)}</strong></td>
                    </tr>
                `;
            });

            htmlTabla += `</tbody></table>`;
            
            divPagina.innerHTML = htmlTabla + panelReferenciasHTML;
            wrapper.appendChild(divPagina);
        }
    }
</script>
</body>
</html>
