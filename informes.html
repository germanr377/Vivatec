<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Planilla de Control de Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1350px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Panel de filtros (Solo visible en pantalla) */
        .filtros-panel { background: #ecf0f1; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { flex: 1; min-width: 190px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        
        .btn-search { background: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-print { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }

        #mensajeEstado { margin-top: 15px; font-weight: bold; color: #e67e22; text-align: center; }

        /* Contenedor general */
        .planilla-wrapper { display: none; background: white; width: 100%; }

        .pagina-hoja {
            width: 100%;
            margin-bottom: 50px;
            page-break-after: always;
            break-after: page;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }
        
        th, td {
            border: 1.5px solid #000;
            padding: 4px 3px;
            text-align: center;
            font-size: 9.5px;
        }

        .th-principal {
            background-color: #fff;
            font-weight: bold;
            font-size: 10px;
            height: 35px;
            vertical-align: middle;
        }

        .th-vertical {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            height: 75px;
            font-size: 9px;
            font-weight: bold;
            padding: 4px 2px;
        }

        .celda-control {
            width: 16px;
            height: 16px;
            border: 1px solid #000;
            background: #fff;
            margin: auto;
        }

        .badge-nuevo { background: #2ecc71; color: white; padding: 2px 3px; border-radius: 3px; font-weight: bold; font-size: 8.5px; }

        /* Pie de página corporativo por hoja */
        .footer-hoja {
            text-align: center;
            margin-top: 8px;
            font-family: Arial, sans-serif;
            border: 1.5px solid #000;
            border-top: none;
            padding: 6px;
            background: #fff;
        }
        .footer-titulo {
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .footer-sub {
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 1cm;
            }
            body * { visibility: hidden; }
            .container, .container * { visibility: visible; }
            
            .container { 
                position: absolute; 
                left: 0; 
                right: 0;
                top: 0; 
                width: 100% !important; 
                margin: auto !important;
                box-shadow: none; 
                padding: 0; 
            }
            .filtros-panel, .btn-print, .btn-search, h2, #mensajeEstado { display: none !important; }
            .pagina-hoja {
                margin-bottom: 0;
            }
        }

        @media (max-width: 768px) { 
            .filtros-panel { flex-direction: column; } 
            .form-group, .btn-search, .btn-print { width: 100%; } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 Generar Planilla de Control de Extintores</h2>

    <!-- PANEL DE FILTROS -->
    <div class="filtros-panel">
        <div class="form-group">
            <label for="filtroCliente">Seleccionar Cliente:</label>
            <select id="filtroCliente" onchange="generarInforme()">
                <option value="">-- Seleccioná un cliente --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="tipoFecha">Tipo de Vencimiento:</label>
            <select id="tipoFecha">
                <option value="vto_carga">Vencimiento de Carga</option>
                <option value="vto_prueb_hidr">Vencimiento Prueba Hidráulica (P.H.)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="fechaDesde">Desde (DD/MM/AAAA):</label>
            <input type="text" id="fechaDesde" placeholder="01/01/2026">
        </div>
        <div class="form-group">
            <label for="fechaHasta">Hasta (DD/MM/AAAA):</label>
            <input type="text" id="fechaHasta" placeholder="31/12/2026">
        </div>
        <button class="btn-search" onclick="generarInforme()">📊 Actualizar Vista</button>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Planilla A4</button>
    </div>

    <div id="mensajeEstado">Por favor, seleccioná un cliente para ver la planilla.</div>

    <div id="planillaWrapper" class="planilla-wrapper"></div>

</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let datosGlobales = [];
    let columnaOrdenActual = 'extintor_numero';
    let ascendenteActual = true;

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) {
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        return fechaSQL;
    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length === 3) {
            let dia = partes[0].padStart(2, '0');
            let mes = partes[1].padStart(2, '0');
            let anio = partes[2];
            return `${anio}-${mes}-${dia}`;
        }
        return null;
    }

    window.addEventListener("load", async function() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente')
            .not('cliente', 'is', null);

        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("filtroCliente");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }

        const hoy = new Date();
        const dia = String(hoy.getDate()).padStart(2, '0');
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const anio = hoy.getFullYear();
        window.fechaHoyStr = `${dia}/${mes}/${anio}`;

        document.getElementById("fechaDesde").value = `01/01/${anio}`;
        document.getElementById("fechaHasta").value = `31/12/${anio}`;
    });

    async function generarInforme() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const campoFecha = document.getElementById("tipoFecha").value;
        const inputDesde = document.getElementById("fechaDesde").value;
        const inputHasta = document.getElementById("fechaHasta").value;
        
        const mensaje = document.getElementById("mensajeEstado");
        const wrapper = document.getElementById("planillaWrapper");

        if (!cliente) {
            mensaje.textContent = "Por favor, seleccioná un cliente para generar la planilla.";
            wrapper.style.display = "none";
            return;
        }

        const fechaDesdeSQL = formatearFechaSQL(inputDesde);
        const fechaHastaSQL = formatearFechaSQL(inputHasta);

        if ((inputDesde && !fechaDesdeSQL) || (inputHasta && !fechaHastaSQL)) {
            alert("El formato de fecha ingresado no es válido. Utilizá el formato DD/MM/AAAA.");
            return;
        }

        mensaje.textContent = "Generando planilla...";
        wrapper.innerHTML = "";

        let query = _supabase.from('extintores').select('*').eq('cliente', cliente);

        if (fechaDesdeSQL && fechaHastaSQL) {
            query = query.gte(campoFecha, fechaDesdeSQL).lte(campoFecha, fechaHastaSQL);
        }

        const { data, error } = await query.limit(500);

        if (error) {
            console.error("Error:", error);
            mensaje.textContent = "Ocurrió un error al consultar la base de datos.";
            wrapper.style.display = "none";
            return;
        }

        if (data.length === 0) {
            mensaje.textContent = "No se encontraron extintores para este cliente en el rango de fechas seleccionado.";
            wrapper.style.display = "none";
            return;
        }

        datosGlobales = data;
        renderizarPlanilla();
    }

    function ordenarPor(columna) {
        if (columnaOrdenActual === columna) {
            ascendenteActual = !ascendenteActual;
        } else {
            columnaOrdenActual = columna;
            ascendenteActual = true;
        }
        renderizarPlanilla();
    }

    function renderizarPlanilla() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const wrapper = document.getElementById("planillaWrapper");
        const mensaje = document.getElementById("mensajeEstado");

        if (datosGlobales.length === 0) return;

        datosGlobales.sort((a, b) => {
            let valA = a[columnaOrdenActual];
            let valB = b[columnaOrdenActual];

            if (valA === null || valA === undefined) valA = "";
            if (valB === null || valB === undefined) valB = "";

            if (!isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "") {
                valA = Number(valA);
                valB = Number(valB);
            }

            if (valA < valB) return ascendenteActual ? -1 : 1;
            if (valA > valB) return ascendenteActual ? 1 : -1;
            return 0;
        });

        wrapper.innerHTML = "";
        mensaje.textContent = `Planilla lista con ${datosGlobales.length} registros. Hacé clic en 'Imprimir Planilla A4'.`;
        wrapper.style.display = "block";

        const registrosPorPagina = 18; // Cantidad de extintores en columnas por hoja
        const totalPaginas = Math.ceil(datosGlobales.length / registrosPorPagina);

        const itemsControl = [
            "CARGA", "PREC.", "BAL.", "RECIP.", "MANOM.", "MANG.", "TOB.", "GAB.", "ACCESO"
        ];

        for (let i = 0; i < totalPaginas; i++) {
            const inicio = i * registrosPorPagina;
            const fin = inicio + registrosPorPagina;
            const loteRegistros = datosGlobales.slice(inicio, fin);
            const numeroHoja = i + 1;

            const divPagina = document.createElement("div");
            divPagina.className = "pagina-hoja";

            let htmlTabla = `
                <table>
                    <thead>
                        <tr>
                            <th colspan="2" style="font-size: 14px; background: #f2f2f2; text-align: center;">${cliente.toUpperCase()}</th>
                            <th colspan="${loteRegistros.length}" style="font-size: 13px; text-align: center;">CONTROL DE EXTINTORES</th>
                            <th colspan="9" style="font-size: 10px; text-align: right; padding-right: 8px;">
                                REVISION: 00 &nbsp;|&nbsp; VIGENCIA: 11/03/05 &nbsp;|&nbsp; FRECUENCIA: 30 DÍAS
                            </th>
                        </tr>
                        <tr>
                            <th colspan="2" style="text-align: left; padding-left: 6px; font-size: 10px;">
                                FECHA: ${window.fechaHoyStr}
                            </th>
                            <th colspan="${loteRegistros.length + 9}" style="text-align: right; font-size: 10px; padding-right: 8px;">
                                HOJA: ${numeroHoja} / ${totalPaginas}
                            </th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Fila de Extintor N°
            htmlTabla += `<tr><td colspan="2" class="th-principal">EXTINTOR N°</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td><strong>${ex.extintor_numero || "-"}</strong></td>`; });
            // Celdas vacías para completar la grilla derecha de referencias
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Tipo
            htmlTabla += `<tr><td colspan="2" class="th-principal">TIPO</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${ex.tipo || "-"}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Capacidad
            htmlTabla += `<tr><td colspan="2" class="th-principal">CAPACIDAD</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${ex.capacidad || "-"}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // A. Fabricación
            htmlTabla += `<tr><td colspan="2" class="th-principal">A. FABRICACION</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${ex.ano_fab || "-"}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Marca
            htmlTabla += `<tr><td colspan="2" class="th-principal">MARCA</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${ex.marca || "-"}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Venc. P. Hidráulica
            htmlTabla += `<tr><td colspan="2" class="th-principal">VENC. P. HIDRAULICA</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${formatearFechaWeb(ex.vto_prueb_hidr)}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Vencimiento Carga
            htmlTabla += `<tr><td colspan="2" class="th-principal">VENCIMIENTO CARGA</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${formatearFechaWeb(ex.vto_carga)}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Número DPS
            htmlTabla += `<tr><td colspan="2" class="th-principal">NUMERO - DPS</td>`;
            loteRegistros.forEach(ex => {
                let formatoDps = ex.numero_dps || "-";
                if (formatoDps === "NUEVO") formatoDps = `<span class="badge badge-nuevo">NUEVO</span>`;
                htmlTabla += `<td>${formatoDps}</td>`;
            });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Identificación Puesto
            htmlTabla += `<tr><td colspan="2" class="th-principal">IDENTIFICACION PUESTO</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td>${ex.identificacion_puesto || "-"}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // Ubicación
            htmlTabla += `<tr><td colspan="2" class="th-principal">UBICACIÓN DEL PUESTO</td>`;
            loteRegistros.forEach(ex => { htmlTabla += `<td style="text-align: left; font-size: 8px;">${ex.ubicacion || "-"}</td>`; });
            for(let c=0; c<9; c++) htmlTabla += `<td></td>`;
            htmlTabla += `</tr>`;

            // CABECERAS VERTICALES DE CONTROL (CARGA, PRECINTO, ETC.)
            htmlTabla += `<tr><td colspan="2" style="background: #000; color: #fff; font-weight: bold; text-align: center;">CONTROL / ESTADO</td>`;
            loteRegistros.forEach(() => { htmlTabla += `<td></td>`; }); // espacio sobre los extintores
            
            // Las 9 columnas verticales con los nombres de control
            const nombresControlLargo = ["CARGA", "PRECINTO", "BALIZA", "RECIPIENTE", "MANOMETRO", "MANGUERA", "TOBERA", "GABINETE", "ACCESO"];
            nombresControlLargo.forEach(nombre => {
                htmlTabla += `<td class="th-vertical">${nombre}</td>`;
            });
            htmlTabla += `</tr>`;

            // Filas de casilleros de control cruzados con las referencias a la derecha
            const referenciasTexto = [
                "D - DESCARGADO",
                "R - REEMPLAZAR",
                "P - PINTAR",
                "I - IDENTIFICAR",
                "O - OBSTRUIDO",
                "V - VENCIDO",
                "N/A - NO APLICA",
                "L - LIBRE",
                "SERVICIO TERCERIZADO",
                "VIVATEC",
                "RESPONSABLE:",
                "IGNACIO REPETTO",
                "ING. INDUSTRIAL",
                "C.I.P.B.A - MAT.51142",
                "FIRMA:"
            ];

            // Generamos filas suficientes para completar la planilla de campo
            for (let r = 0; r < 15; r++) {
                htmlTabla += `<tr>`;
                if (r === 0) {
                    htmlTabla += `<td colspan="2" rowspan="15" style="vertical-align: top; text-align: left; font-weight: bold; font-size: 9px; background: #fafafa;">REFERENCIAS Y FIRMAS:</td>`;
                }
                
                // Celdas de datos vacías para los extintores
                loteRegistros.forEach(() => {
                    htmlTabla += `<td><div class="celda-control"></div></td>`;
                });

                // Los 9 casilleros verticales de control
                for(let c=0; c<9; c++) {
                    htmlTabla += `<td><div class="celda-control"></div></td>`;
                }

                // Columna de texto de referencias a la derecha
                htmlTabla += `<td colspan="9" style="text-align: left; padding-left: 6px; font-weight: bold; font-size: 8.5px; background: #fff;">${referenciasTexto[r] || ''}</td>`;
                htmlTabla += `</tr>`;
            }

            htmlTabla += `
                    </tbody>
                </table>
            `;

            // Pie de página exacto por hoja
            let htmlFooter = `
                <div class="footer-hoja">
                    <div class="footer-titulo">VIVATEC</div>
                    <div class="footer-sub">REGISTRO DPS 382</div>
                </div>
            `;

            divPagina.innerHTML = htmlTabla + htmlFooter;
            wrapper.appendChild(divPagina);
        }
    }
</script>

</body>
</html>
