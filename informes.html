<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Planilla de Control de Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Panel de filtros (Solo visible en pantalla) */
        .filtros-panel { background: #ecf0f1; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { flex: 1; min-width: 190px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        
        .btn-search { background: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-print { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }

        #mensajeEstado { margin-top: 15px; font-weight: bold; color: #e67e22; text-align: center; }

        /* Contenedor general de las páginas impresas */
        .planilla-wrapper { display: none; background: white; width: 100%; }

        /* Estilo de cada Bloque / Hoja individual */
        .pagina-hoja {
            width: 100%;
            max-width: 900px; /* Ancho acotado para centrar y compactar la tabla */
            margin: 0 auto 30px auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }
        
        /* Estilos del Membrete */
        .th-membrete {
            border: 1.5px solid #000;
            padding: 8px;
            font-size: 13px;
            vertical-align: middle;
            background-color: #fff !important;
            color: #000 !important;
        }
        .titulo-cliente {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            background-color: #f2f2f2 !important;
            width: 35%;
        }
        .titulo-control {
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            width: 45%;
        }
        .titulo-planilla {
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            width: 20%;
        }
        .lbl-campo {
            font-weight: bold;
            font-size: 12px;
        }

        /* Cabeceras de columnas de datos con anchos optimizados y achicados */
        .th-columna {
            border: 1.5px solid #000;
            padding: 6px 3px;
            text-align: center;
            font-size: 11px;
            background-color: #fff;
            color: #000;
            font-weight: bold;
            vertical-align: middle;
            height: 55px;
            line-height: 1.2;
        }

        /* Celdas de datos */
        td {
            border: 1.5px solid #000;
            padding: 6px 4px;
            text-align: center;
            font-size: 12px;
        }
        .texto-izq {
            text-align: left !important;
            padding-left: 8px !important;
        }

        .badge-nuevo { background: #2ecc71; color: white; padding: 2px 6px; border-radius: 3px; font-weight: bold; }

        /* CONFIGURACIÓN DE IMPRESIÓN */
        @media print {
            @page {
                size: A4 landscape;
                margin: 2cm;
            }
            body * { visibility: hidden; }
            .container, .container * { visibility: visible; }
            
            .container { 
                position: absolute; 
                left: 0; 
                right: 0;
                top: 0; 
                width: 100% !important; 
                margin: auto !important;
                box-shadow: none; 
                padding: 0; 
            }
            .filtros-panel, .btn-print, .btn-search, h2, #mensajeEstado { display: none !important; }
            .planilla-wrapper { display: block !important; }

            .pagina-hoja {
                page-break-after: always;
                break-after: page;
                margin-bottom: 0;
                max-width: 100% !important;
            }
        }

        @media (max-width: 768px) { 
            .filtros-panel { flex-direction: column; } 
            .form-group, .btn-search, .btn-print { width: 100%; } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 Generar Planilla de Control de Extintores</h2>

    <!-- PANEL DE FILTROS -->
    <div class="filtros-panel">
        <div class="form-group">
            <label for="filtroCliente">Seleccionar Cliente:</label>
            <select id="filtroCliente" onchange="generarInforme()">
                <option value="">-- Seleccioná un cliente --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="tipoFecha">Tipo de Vencimiento:</label>
            <select id="tipoFecha">
                <option value="vto_carga">Vencimiento de Carga</option>
                <option value="vto_prueb_hidr">Vencimiento Prueba Hidráulica (P.H.)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="fechaDesde">Desde (DD/MM/AAAA):</label>
            <input type="text" id="fechaDesde" placeholder="01/01/2026">
        </div>
        <div class="form-group">
            <label for="fechaHasta">Hasta (DD/MM/AAAA):</label>
            <input type="text" id="fechaHasta" placeholder="31/12/2026">
        </div>
        <button class="btn-search" onclick="generarInforme()">📊 Actualizar Vista</button>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Planilla A4</button>
    </div>

    <div id="mensajeEstado">Por favor, seleccioná un cliente para ver la planilla.</div>

    <!-- CONTENEDOR DE PÁGINAS DINÁMICAS -->
    <div id="planillaWrapper" class="planilla-wrapper">
        <!-- Las páginas de 20 registros se arman solas acá -->
    </div>

</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) {
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        return fechaSQL;
    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length === 3) {
            let dia = partes[0].padStart(2, '0');
            let mes = partes[1].padStart(2, '0');
            let anio = partes[2];
            return `${anio}-${mes}-${dia}`;
        }
        return null;
    }

    window.addEventListener("load", async function() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente')
            .not('cliente', 'is', null);

        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("filtroCliente");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }

        const hoy = new Date();
        const dia = String(hoy.getDate()).padStart(2, '0');
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const anio = hoy.getFullYear();
        window.fechaHoyStr = `${dia}/${mes}/${anio}`;

        document.getElementById("fechaDesde").value = `01/01/${anio}`;
        document.getElementById("fechaHasta").value = `31/12/${anio}`;
    });

    async function generarInforme() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const campoFecha = document.getElementById("tipoFecha").value;
        const inputDesde = document.getElementById("fechaDesde").value;
        const inputHasta = document.getElementById("fechaHasta").value;
        
        const wrapper = document.getElementById("planillaWrapper");
        const mensaje = document.getElementById("mensajeEstado");

        if (!cliente) {
            mensaje.textContent = "Por favor, seleccioná un cliente para generar la planilla.";
            wrapper.style.display = "none";
            return;
        }

        const fechaDesdeSQL = formatearFechaSQL(inputDesde);
        const fechaHastaSQL = formatearFechaSQL(inputHasta);

        if ((inputDesde && !fechaDesdeSQL) || (inputHasta && !fechaHastaSQL)) {
            alert("El formato de fecha ingresado no es válido. Utilizá el formato DD/MM/AAAA.");
            return;
        }

        mensaje.textContent = "Generando planilla...";
        wrapper.innerHTML = "";

        let query = _supabase.from('extintores').select('*').eq('cliente', cliente);

        if (fechaDesdeSQL && fechaHastaSQL) {
            query = query.gte(campoFecha, fechaDesdeSQL).lte(campoFecha, fechaHastaSQL);
        }

        query = query.order('extintor_numero', { ascending: true });

        const { data, error } = await query.limit(500);

        if (error) {
            console.error("Error:", error);
            mensaje.textContent = "Ocurrió un error al consultar la base de datos.";
            wrapper.style.display = "none";
            return;
        }

        if (data.length === 0) {
            mensaje.textContent = "No se encontraron extintores para este cliente en el rango de fechas seleccionado.";
            wrapper.style.display = "none";
            return;
        }

        mensaje.textContent = `Planilla lista con ${data.length} registros divididos en páginas de 20. Hacé clic en 'Imprimir Planilla A4'.`;
        wrapper.style.display = "block";

        const registrosPorPagina = 20;
        const totalPaginas = Math.ceil(data.length / registrosPorPagina);

        for (let i = 0; i < totalPaginas; i++) {
            const inicio = i * registrosPorPagina;
            const fin = inicio + registrosPorPagina;
            const loteRegistros = data.slice(inicio, fin);
            const numeroHoja = i + 1;

            const divPagina = document.createElement("div");
            divPagina.className = "pagina-hoja";

            let htmlTabla = `
                <table>
                    <thead>
                        <tr>
                            <th colspan="3" class="th-membrete titulo-cliente">${cliente.toUpperCase()}</th>
                            <th colspan="4" class="th-membrete titulo-control">CONTROL DE EXTINTORES</th>
                            <th colspan="3" class="th-membrete titulo-planilla">PLANILLA DE REVISION N° 1</th>
                        </tr>
                        <tr>
                            <th colspan="7" class="th-membrete" style="text-align: left; padding-left: 10px;">
                                <span class="lbl-campo">FECHA DE REVISION:</span> ${window.fechaHoyStr}
                            </th>
                            <th colspan="3" class="th-membrete" style="text-align: left; padding-left: 10px;">
                                <span class="lbl-campo">HOJA - ${numeroHoja} de ${totalPaginas}</span>
                            </th>
                        </tr>
                        <tr>
                            <th class="th-columna" style="width: 7%;">EXTINTOR<br>N°</th>
                            <th class="th-columna" style="width: 5%;">TIPO</th>
                            <th class="th-columna" style="width: 5%;">CAPAC.</th>
                            <th class="th-columna" style="width: 6%;">A. FABRIC</th>
                            <th class="th-columna" style="width: 12%;">MARCA</th>
                            <th class="th-columna" style="width: 9%;">VENC. P. HIDRAULICA</th>
                            <th class="th-columna" style="width: 9%;">VENC CARGA</th>
                            <th class="th-columna" style="width: 9%;">N°-DPS</th>
                            <th class="th-columna" style="width: 6%;">PUESTO</th>
                            <th class="th-columna" style="width: 22%;">UBICACIÓN DEL PUESTO</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            loteRegistros.forEach(ex => {
                let formatoDps = ex.numero_dps || "-";
                if (formatoDps === "NUEVO") {
                    formatoDps = `<span class="badge badge-nuevo">NUEVO</span>`;
                }

                htmlTabla += `
                    <tr>
                        <td><strong>${ex.extintor_numero || "-"}</strong></td>
                        <td>${ex.tipo || "-"}</td>
                        <td>${ex.capacidad || "-"}</td>
                        <td>${ex.ano_fab || "-"}</td>
                        <td>${ex.marca || "-"}</td>
                        <td>${formatearFechaWeb(ex.vto_prueb_hidr)}</td>
                        <td>${formatearFechaWeb(ex.vto_carga)}</td>
                        <td>${formatoDps}</td>
                        <td>${ex.identificacion_puesto || "-"}</td>
                        <td class="texto-izq">${ex.ubicacion || "-"}</td>
                    </tr>
                `;
            });

            htmlTabla += `
                    </tbody>
                </table>
            `;

            divPagina.innerHTML = htmlTabla;
            wrapper.appendChild(divPagina);
        }
    }
</script>

</body>
</html>
