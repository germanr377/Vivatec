<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Planilla de Control de Extintores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="menu.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1400px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Selector de modo */
        .modo-panel {
            display: flex;
            justify-content: center;
            gap: 25px;
            background: #dfe6e9;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #b2bec3;
        }
        .modo-opcion {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            margin: 0;
        }
        .modo-opcion input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
            accent-color: #2980b9;
        }

        /* Panel de filtros */
        .filtros-panel { background: #ecf0f1; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { flex: 1; min-width: 210px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; height: 42px; background: #fff; }

        .btn-search { background: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-search:hover { background: #1f618d; }

        .btn-print { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-print:hover { background: #219653; }

        .btn-clear { background: #7f8c8d; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-clear:hover { background: #6c7a89; }

        #mensajeEstado { margin-top: 15px; font-weight: bold; color: #e67e22; text-align: center; }

        /* Contenedor general */
        .planilla-wrapper { 
            display: none; 
            background: white; 
            width: 100%; 
            overflow-x: auto; 
            padding-bottom: 15px;
        }

        /* Cada página ahora es un contenedor FLEX para alinear tabla y referencias */
        .pagina-hoja { 
            display: flex; 
            flex-direction: row;
            align-items: flex-start;
            gap: 15px;
            width: 100%; 
            margin-bottom: 40px; 
        }
        
        /* TABLA PRINCIPAL (POR EXTINTOR) */
        .tabla-principal { 
            width: 920px; 
            min-width: 920px; 
            margin: 0; 
            border-collapse: collapse; 
            border: 2px solid #000; 
            font-family: Arial, sans-serif; 
            background-color: #fff; 
            table-layout: fixed; 
        }

        /* TABLA RESUMEN (POR CLIENTE) */
        .tabla-clientes {
            width: 100%;
            min-width: 850px;
            margin: 0;
            border-collapse: collapse;
            border: 2px solid #000;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }
        .tabla-clientes th {
            border: 1.5px solid #000;
            padding: 8px 6px;
            text-align: center;
            font-size: 11px;
            background-color: #f2f2f2;
            color: #000;
            font-weight: bold;
            user-select: none;
        }
        .tabla-clientes th[onclick] { cursor: pointer; }
        .tabla-clientes th[onclick]:hover { background-color: #e2e8f0; }
        .tabla-clientes td {
            border: 1.5px solid #000;
            padding: 6px 8px;
            text-align: center;
            font-size: 12px;
        }
        .fila-totales td {
            background-color: #ecf0f1;
            font-weight: bold;
            font-size: 12px;
        }
        
        /* TABLA DE REFERENCIAS (PANEL DERECHO) */
        .tabla-referencias {
            width: 145px;
            min-width: 145px;
            border-collapse: collapse; 
            border: 2px solid #000; 
            font-family: Arial, sans-serif; 
            background-color: #fff; 
        }

        /* Estilos generales de celdas */
        .th-membrete { border: 1.5px solid #000; padding: 6px; font-size: 12px; vertical-align: middle; background-color: #fff !important; color: #000 !important; }
        .titulo-cliente { font-size: 16px; font-weight: bold; text-align: center; background-color: #f2f2f2 !important; }
        .titulo-control { font-size: 14px; font-weight: bold; text-align: center; }
        .titulo-planilla { font-size: 12px; font-weight: bold; text-align: center; }
        .lbl-campo { font-weight: bold; font-size: 11px; }

        /* Cabeceras normales */
        .th-columna {
            border: 1.5px solid #000;
            padding: 5px 2px;
            text-align: center;
            font-size: 9px;
            background-color: #fff;
            color: #000;
            font-weight: bold;
            vertical-align: middle;
            user-select: none;
            transition: background 0.2s;
            line-height: 1.1;
        }
        .th-columna[onclick] { cursor: pointer; }
        .th-columna[onclick]:hover { background-color: #e2e8f0; }

        /* Contenedor interno para texto vertical a 90 GRADOS */
        .texto-vertical {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            display: inline-block;
            height: 75px; 
            font-size: 8.5px;
            padding: 2px 0;
        }

        /* Texto vertical del panel de referencias */
        .texto-vertical-ref {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            display: inline-block;
            height: 110px; 
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Celdas de datos tabla principal */
        .tabla-principal td { 
            border: 1.5px solid #000; 
            padding: 4px 2px; 
            text-align: center; 
            font-size: 10px; 
            word-wrap: break-word;
            overflow: hidden;
        }

        /* Celdas del panel de referencias */
        .tabla-referencias td {
            border: 1.5px solid #000; 
            padding: 3px 5px; 
            text-align: left; 
            font-size: 7.5px; 
            font-weight: bold;
            text-transform: uppercase;
        }
        .ref-center { text-align: center !important; }
        .ref-box { height: 18px; }
        
        .no-b-bottom { border-bottom: none !important; padding-bottom: 2px !important; }
        .no-b-mid { border-top: none !important; border-bottom: none !important; padding-top: 2px !important; padding-bottom: 2px !important; }
        .no-b-top { border-top: none !important; padding-top: 2px !important; padding-bottom: 20px !important; }

        .texto-izq { text-align: left !important; padding-left: 6px !important; }
        .badge-nuevo { background: #2ecc71; color: white; padding: 2px 4px; border-radius: 3px; font-weight: bold; font-size: 9px;}

        /* CONFIGURACIÓN DE IMPRESIÓN */
        @media print {
            @page { size: A4 landscape; margin: 1cm; }
            body * { visibility: hidden; }
            .container, .container * { visibility: visible; }
            .container { position: absolute; left: 0; top: 0; width: 100% !important; box-shadow: none; padding: 0; }
            .modo-panel, .filtros-panel, .btn-print, .btn-search, .btn-clear, h2, #mensajeEstado, nav, header, [id*="menu"], [class*="menu"] { display: none !important; }
            .planilla-wrapper { display: block !important; overflow: visible; }
            
            .pagina-hoja { page-break-after: always; break-after: page; margin-bottom: 0; }
            .tabla-principal { width: 920px !important; }
            .tabla-referencias { width: 145px !important; }
            .tabla-clientes { width: 100% !important; min-width: unset !important; }
        }
        @media (max-width: 768px) { 
            .filtros-panel, .modo-panel { flex-direction: column; } 
            .form-group, .btn-search, .btn-print, .btn-clear { width: 100%; } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 Generar Planilla de Control de Extintores</h2>

    <!-- SELECTOR DE MODO DE INFORME -->
    <div class="modo-panel">
        <label class="modo-opcion">
            <input type="radio" name="modoInforme" value="extintor" checked onchange="cambiarModoInforme()">
            🧯 Informe por Extintor (Planilla Individual)
        </label>
        <label class="modo-opcion">
            <input type="radio" name="modoInforme" value="cliente" onchange="cambiarModoInforme()">
            🏢 Informe por Cliente (Resumen de Vencimientos)
        </label>
    </div>

    <div class="filtros-panel">
        <!-- CAMPO PREDICTIVO DE CLIENTES -->
        <div class="form-group">
            <label for="filtroCliente" id="lblCliente">Cliente:</label>
            <input type="text" id="filtroCliente" list="listaClientes" placeholder="Escribí o seleccioná cliente..." autocomplete="off">
            <datalist id="listaClientes"></datalist>
        </div>
        <div class="form-group" id="grupoTipoFecha">
            <label for="tipoFecha">Tipo de Vencimiento:</label>
            <select id="tipoFecha">
                <option value="vto_carga">Vencimiento de Carga</option>
                <option value="vto_prueb_hidr">Vencimiento Prueba Hidráulica (P.H.)</option>
            </select>
        </div>
        <div class="form-group" id="grupoFrecuencia">
            <label for="frecuenciaDias">Frecuencia (Días):</label>
            <input type="number" id="frecuenciaDias" value="30" min="1" step="1">
        </div>
        <div class="form-group">
            <label for="fechaDesde">Desde (DD/MM/AAAA):</label>
            <input type="text" id="fechaDesde" placeholder="DD/MM/AAAA" maxlength="10" oninput="formatearEntradaFecha(this)">
        </div>
        <div class="form-group">
            <label for="fechaHasta">Hasta (DD/MM/AAAA):</label>
            <input type="text" id="fechaHasta" placeholder="DD/MM/AAAA" maxlength="10" oninput="formatearEntradaFecha(this)">
        </div>
        
        <button class="btn-search" onclick="generarInforme()">📊 Actualizar Vista</button>
        <button class="btn-clear" onclick="limpiarFiltros()">🧹 Limpiar</button>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Planilla A4</button>
    </div>

    <div id="mensajeEstado">Por favor, seleccioná un cliente para ver la planilla.</div>

    <div id="planillaWrapper" class="planilla-wrapper"></div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let datosGlobales = []; 
    let datosClientesAgrupados = [];
    let tiposAgenteUnicos = [];
    let mapaClientesInfo = {};

    let columnaOrdenActual = 'extintor_numero';
    let ascendenteActual = true;

    let colOrdenCliente = 'cliente';
    let ascOrdenCliente = true;

    function obtenerModoActual() {
        return document.querySelector('input[name="modoInforme"]:checked').value;
    }

    function cambiarModoInforme() {
        const modo = obtenerModoActual();
        const grupoTipoFecha = document.getElementById("grupoTipoFecha");
        const grupoFrecuencia = document.getElementById("grupoFrecuencia");
        const lblCliente = document.getElementById("lblCliente");
        const inputCliente = document.getElementById("filtroCliente");
        const mensaje = document.getElementById("mensajeEstado");
        const wrapper = document.getElementById("planillaWrapper");

        wrapper.style.display = "none";
        wrapper.innerHTML = "";

        if (modo === "cliente") {
            grupoTipoFecha.style.display = "none";
            grupoFrecuencia.style.display = "none";
            lblCliente.textContent = "Cliente (Opcional - vacío = todos):";
            inputCliente.placeholder = "Dejá vacío para ver todos los clientes...";
            mensaje.textContent = "Seleccioná un rango de fechas (opcional) y presioná 'Actualizar Vista' para ver el resumen por cliente.";
        } else {
            grupoTipoFecha.style.display = "block";
            grupoFrecuencia.style.display = "block";
            lblCliente.textContent = "Cliente:";
            inputCliente.placeholder = "Escribí o seleccioná cliente...";
            mensaje.textContent = "Por favor, seleccioná un cliente para ver la planilla.";
        }
    }

    // AUTO-FORMATO MIENTRAS SE ESCRIBE PARA DD/MM/AAAA
    function formatearEntradaFecha(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length > 2 && valor.length <= 4) {
            valor = valor.substring(0, 2) + '/' + valor.substring(2);
        } else if (valor.length > 4) {
            valor = valor.substring(0, 2) + '/' + valor.substring(2, 4) + '/' + valor.substring(4, 8);
        }
        input.value = valor;
    }

    // BOTÓN LIMPIAR
    function limpiarFiltros() {
        document.getElementById("filtroCliente").value = "";
        document.getElementById("tipoFecha").value = "vto_carga";
        document.getElementById("frecuenciaDias").value = "30";
        document.getElementById("fechaDesde").value = "";
        document.getElementById("fechaHasta").value = "";
        document.getElementById("planillaWrapper").style.display = "none";
        datosGlobales = [];
        datosClientesAgrupados = [];
        cambiarModoInforme();
    }

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) return `${partes[1]}/${partes[0]}`; 
        return fechaSQL;
    }

    function validarYConvertirFechaDesde(fechaWeb) {
        if (!fechaWeb || fechaWeb.trim() === "") return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length !== 3) return "INVALIDA";

        let dia = parseInt(partes[0], 10);
        let mes = parseInt(partes[1], 10);
        let anio = parseInt(partes[2].trim(), 10);
        if (partes[2].trim().length === 2) anio += 2000;

        if (isNaN(dia) || isNaN(mes) || isNaN(anio) || mes < 1 || mes > 12 || dia < 1 || dia > 31) return "INVALIDA";

        let fechaObj = new Date(anio, mes - 1, dia);
        if (fechaObj.getFullYear() !== anio || fechaObj.getMonth() !== mes - 1 || fechaObj.getDate() !== dia) return "INVALIDA";

        let yyyy = fechaObj.getFullYear();
        let mm = String(fechaObj.getMonth() + 1).padStart(2, '0');
        let dd = String(fechaObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function validarYConvertirFechaHasta(fechaWeb) {
        if (!fechaWeb || fechaWeb.trim() === "") return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length !== 3) return "INVALIDA";

        let mes = parseInt(partes[1], 10);
        let anio = parseInt(partes[2].trim(), 10);
        if (partes[2].trim().length === 2) anio += 2000;

        if (isNaN(mes) || isNaN(anio) || mes < 1 || mes > 12) return "INVALIDA";

        let ultimoDiaMes = new Date(anio, mes, 0).getDate();

        let mm = String(mes).padStart(2, '0');
        let dd = String(ultimoDiaMes).padStart(2, '0');
        return `${anio}-${mm}-${dd}`;
    }

    function renderBool(valor) {
        return valor === true || valor === "true" || valor === 1 ? "X" : "";
    }

    window.addEventListener("load", async function() {
        // 🔒 CONTROL DE SEGURIDAD: Validación de sesión activa
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }

        // LLENAR EL DATALIST Y GUARDAR INFO DE CLIENTES (INCLUIDA DIRECCIÓN)
        const { data, error } = await _supabase
            .from('clientes')
            .select('*')
            .order('nombre_cliente', { ascending: true });

        if (!error && data) {
            let datalist = document.getElementById("listaClientes");
            datalist.innerHTML = "";
            mapaClientesInfo = {};

            data.forEach(c => {
                if (c.nombre_cliente) {
                    mapaClientesInfo[c.nombre_cliente.trim().toUpperCase()] = c;
                }
                let opt = document.createElement("option");
                opt.value = c.nombre_cliente;
                if (c.razon_social) {
                    opt.textContent = c.razon_social;
                }
                datalist.appendChild(opt);
            });
        }
        
        const hoy = new Date();
        window.fechaHoyStr = `${String(hoy.getDate()).padStart(2, '0')}/${String(hoy.getMonth() + 1).padStart(2, '0')}/${hoy.getFullYear()}`;
    });

    async function generarInforme() {
        const modo = obtenerModoActual();
        const cliente = document.getElementById("filtroCliente").value.trim();
        const inputDesde = document.getElementById("fechaDesde").value.trim();
        const inputHasta = document.getElementById("fechaHasta").value.trim();
        const mensaje = document.getElementById("mensajeEstado");
        const wrapper = document.getElementById("planillaWrapper");

        let fechaDesdeSQL = null;
        let fechaHastaSQL = null;

        if (inputDesde !== "") {
            fechaDesdeSQL = validarYConvertirFechaDesde(inputDesde);
            if (fechaDesdeSQL === "INVALIDA") {
                alert("⚠️ La fecha 'Desde' es inválida. Verificá el formato (Ej: 01/08/2027).");
                document.getElementById("fechaDesde").focus();
                return;
            }
        }

        if (inputHasta !== "") {
            fechaHastaSQL = validarYConvertirFechaHasta(inputHasta);
            if (fechaHastaSQL === "INVALIDA") {
                alert("⚠️ La fecha 'Hasta' es inválida. Verificá el formato (Ej: 30/08/2027).");
                document.getElementById("fechaHasta").focus();
                return;
            }
        }

        // ==========================================
        // MODO 1: INFORME POR EXTINTOR (ORIGINAL)
        // ==========================================
        if (modo === "extintor") {
            const campoFecha = document.getElementById("tipoFecha").value;

            if (!cliente) {
                mensaje.textContent = "Por favor, escribí o seleccioná un cliente para generar la planilla.";
                wrapper.style.display = "none";
                return;
            }

            mensaje.textContent = "Generando planilla...";
            wrapper.innerHTML = "";

            let query = _supabase.from('extintores').select('*').eq('cliente', cliente);

            if (fechaDesdeSQL && fechaHastaSQL) {
                query = query.gte(campoFecha, fechaDesdeSQL).lte(campoFecha, fechaHastaSQL);
            } else if (!fechaDesdeSQL && fechaHastaSQL) {
                query = query.lte(campoFecha, fechaHastaSQL);
            } else if (fechaDesdeSQL && !fechaHastaSQL) {
                query = query.gte(campoFecha, fechaDesdeSQL);
            }

            const { data, error } = await query.limit(1000);

            if (error) {
                console.error("Error:", error);
                mensaje.textContent = "Ocurrió un error al consultar la base de datos.";
                wrapper.style.display = "none";
                return;
            }

            if (data.length === 0) {
                mensaje.textContent = "No se encontraron extintores con los filtros indicados para este cliente.";
                wrapper.style.display = "none";
                return;
            }

            datosGlobales = data;
            renderizarPlanilla();
            return;
        }

        // ==========================================
        // MODO 2: INFORME POR CLIENTE (AGRUPADO)
        // ==========================================
        mensaje.textContent = "Calculando vencimientos por cliente...";
        wrapper.innerHTML = "";

        let query = _supabase.from('extintores').select('*');

        if (cliente) {
            query = query.ilike('cliente', `%${cliente}%`);
        }

        // Construir filtro OR para traer los que venzan de carga O de P.H. en el rango
        if (fechaDesdeSQL && fechaHastaSQL) {
            query = query.or(`and(vto_carga.gte.${fechaDesdeSQL},vto_carga.lte.${fechaHastaSQL}),and(vto_prueb_hidr.gte.${fechaDesdeSQL},vto_prueb_hidr.lte.${fechaHastaSQL})`);
        } else if (!fechaDesdeSQL && fechaHastaSQL) {
            query = query.or(`vto_carga.lte.${fechaHastaSQL},vto_prueb_hidr.lte.${fechaHastaSQL}`);
        } else if (fechaDesdeSQL && !fechaHastaSQL) {
            query = query.or(`vto_carga.gte.${fechaDesdeSQL},vto_prueb_hidr.gte.${fechaDesdeSQL}`);
        }

        const { data, error } = await query.limit(5000);

        if (error) {
            console.error("Error:", error);
            mensaje.textContent = "Ocurrió un error al consultar la base de datos.";
            wrapper.style.display = "none";
            return;
        }

        if (!data || data.length === 0) {
            mensaje.textContent = "No se encontraron vencimientos en el período seleccionado.";
            wrapper.style.display = "none";
            return;
        }

        procesarDatosPorCliente(data, fechaDesdeSQL, fechaHastaSQL);
        renderizarTablaClientes(fechaDesdeSQL, fechaHastaSQL);
    }

    function fechaEnRango(fechaSQL, desdeSQL, hastaSQL) {
        if (!fechaSQL) return false;
        const f = fechaSQL.substring(0, 10);
        if (desdeSQL && f < desdeSQL) return false;
        if (hastaSQL && f > hastaSQL) return false;
        return true;
    }

    function procesarDatosPorCliente(extintores, desdeSQL, hastaSQL) {
        const agrupado = {};
        const setTipos = new Set();

        extintores.forEach(ex => {
            const nombreCli = (ex.cliente || "SIN CLIENTE").trim();
            const claveCli = nombreCli.toUpperCase();

            const venceCarga = fechaEnRango(ex.vto_carga, desdeSQL, hastaSQL);
            const vencePH = fechaEnRango(ex.vto_prueb_hidr, desdeSQL, hastaSQL);

            if (!venceCarga && !vencePH) return;

            if (!agrupado[claveCli]) {
                const infoDB = mapaClientesInfo[claveCli] || {};
                const direccion = infoDB.direccion || infoDB.domicilio || infoDB.calle || "-";

                agrupado[claveCli] = {
                    cliente: nombreCli,
                    direccion: direccion,
                    recargas: 0,
                    ph: 0,
                    tipos: {}
                };
            }

            if (venceCarga) {
                agrupado[claveCli].recargas += 1;
                const tipoAgente = (ex.tipo || "OTRO").trim().toUpperCase();
                setTipos.add(tipoAgente);
                agrupado[claveCli].tipos[tipoAgente] = (agrupado[claveCli].tipos[tipoAgente] || 0) + 1;
            }

            if (vencePH) {
                agrupado[claveCli].ph += 1;
            }
        });

        tiposAgenteUnicos = Array.from(setTipos).sort();
        datosClientesAgrupados = Object.values(agrupado);
    }

    function ordenarPorCliente(columna, esTipoAgente = false) {
        const claveCompleta = esTipoAgente ? `TIPO_${columna}` : columna;
        if (colOrdenCliente === claveCompleta) {
            ascOrdenCliente = !ascOrdenCliente;
        } else {
            colOrdenCliente = claveCompleta;
            ascOrdenCliente = true;
        }

        const fDesde = validarYConvertirFechaDesde(document.getElementById("fechaDesde").value.trim());
        const fHasta = validarYConvertirFechaHasta(document.getElementById("fechaHasta").value.trim());
        renderizarTablaClientes(fDesde === "INVALIDA" ? null : fDesde, fHasta === "INVALIDA" ? null : fHasta);
    }

    function renderizarTablaClientes(desdeSQL, hastaSQL) {
        const wrapper = document.getElementById("planillaWrapper");
        const mensaje = document.getElementById("mensajeEstado");

        if (datosClientesAgrupados.length === 0) {
            mensaje.textContent = "No se encontraron vencimientos en el período seleccionado.";
            wrapper.style.display = "none";
            return;
        }

        // Ordenar filas
        datosClientesAgrupados.sort((a, b) => {
            let valA, valB;
            if (colOrdenCliente.startsWith("TIPO_")) {
                const t = colOrdenCliente.replace("TIPO_", "");
                valA = a.tipos[t] || 0;
                valB = b.tipos[t] || 0;
            } else {
                valA = a[colOrdenCliente] ?? "";
                valB = b[colOrdenCliente] ?? "";
            }

            if (typeof valA === "string") valA = valA.toLowerCase();
            if (typeof valB === "string") valB = valB.toLowerCase();

            if (valA < valB) return ascOrdenCliente ? -1 : 1;
            if (valA > valB) return ascOrdenCliente ? 1 : -1;
            return 0;
        });

        const flecha = (col) => {
            if (colOrdenCliente !== col) return " ↕";
            return ascOrdenCliente ? " ▲" : " ▼";
        };

        const inputDesde = document.getElementById("fechaDesde").value.trim();
        const inputHasta = document.getElementById("fechaHasta").value.trim();
        let textoPeriodo = "TODOS LOS PERÍODOS";
        if (inputDesde && inputHasta) textoPeriodo = `DEL ${inputDesde} AL ${inputHasta}`;
        else if (inputDesde) textoPeriodo = `DESDE EL ${inputDesde}`;
        else if (inputHasta) textoPeriodo = `HASTA EL ${inputHasta}`;

        const totalCols = 4 + tiposAgenteUnicos.length;

        let totalRecargas = 0;
        let totalPH = 0;
        let totalesPorTipo = {};
        tiposAgenteUnicos.forEach(t => totalesPorTipo[t] = 0);

        let filasHTML = "";
        datosClientesAgrupados.forEach(item => {
            totalRecargas += item.recargas;
            totalPH += item.ph;

            let celdasTiposHTML = "";
            tiposAgenteUnicos.forEach(t => {
                const cant = item.tipos[t] || 0;
                totalesPorTipo[t] += cant;
                celdasTiposHTML += `<td>${cant > 0 ? cant : "-"}</td>`;
            });

            filasHTML += `
                <tr>
                    <td class="texto-izq"><strong>${item.cliente}</strong></td>
                    <td class="texto-izq">${item.direccion}</td>
                    <td><strong>${item.recargas}</strong></td>
                    <td><strong>${item.ph}</strong></td>
                    ${celdasTiposHTML}
                </tr>
            `;
        });

        let celdasTotalesTiposHTML = "";
        tiposAgenteUnicos.forEach(t => {
            celdasTotalesTiposHTML += `<td>${totalesPorTipo[t]}</td>`;
        });

        const encabezadoTiposHTML = tiposAgenteUnicos.map(t => 
            `<th onclick="ordenarPorCliente('${t}', true)">${t}${flecha('TIPO_' + t)}</th>`
        ).join("");

        const html = `
            <table class="tabla-clientes">
                <thead>
                    <tr>
                        <th colspan="${totalCols}" style="font-size: 15px; background: #fff; padding: 10px;">
                            VIVATEC - RESUMEN DE VENCIMIENTOS POR CLIENTE (${textoPeriodo})
                        </th>
                    </tr>
                    <tr>
                        <th colspan="${totalCols}" style="text-align: left; background: #fff; font-size: 11px; padding: 6px 10px;">
                            FECHA DE EMISIÓN: ${window.fechaHoyStr} &nbsp;|&nbsp; TOTAL CLIENTES: ${datosClientesAgrupados.length}
                        </th>
                    </tr>
                    <tr>
                        <th rowspan="2" style="width: 24%;" onclick="ordenarPorCliente('cliente')">CLIENTE${flecha('cliente')}</th>
                        <th rowspan="2" style="width: 26%;" onclick="ordenarPorCliente('direccion')">DIRECCIÓN${flecha('direccion')}</th>
                        <th rowspan="2" style="width: 10%;" onclick="ordenarPorCliente('recargas')">RECARGAS${flecha('recargas')}</th>
                        <th rowspan="2" style="width: 10%;" onclick="ordenarPorCliente('ph')">PRUEBAS HIDRÁULICAS${flecha('ph')}</th>
                        ${tiposAgenteUnicos.length > 0 ? `<th colspan="${tiposAgenteUnicos.length}">DESGLOSE DE RECARGAS POR AGENTE EXTINTOR</th>` : ''}
                    </tr>
                    <tr>
                        ${encabezadoTiposHTML}
                    </tr>
                </thead>
                <tbody>
                    ${filasHTML}
                    <tr class="fila-totales">
                        <td colspan="2" style="text-align: right; padding-right: 10px;">TOTALES GENERALES:</td>
                        <td>${totalRecargas}</td>
                        <td>${totalPH}</td>
                        ${celdasTotalesTiposHTML}
                    </tr>
                </tbody>
            </table>
        `;

        wrapper.innerHTML = html;
        wrapper.style.display = "block";
        mensaje.textContent = `Resumen listo: ${datosClientesAgrupados.length} clientes encontrados.`;
    }

    function ordenarPor(columna) {
        if (columnaOrdenActual === columna) { ascendenteActual = !ascendenteActual; } 
        else { columnaOrdenActual = columna; ascendenteActual = true; }
        renderizarPlanilla();
    }

    function renderizarPlanilla() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const frecuenciaVal = document.getElementById("frecuenciaDias").value || "30";
        const wrapper = document.getElementById("planillaWrapper");
        const mensaje = document.getElementById("mensajeEstado");
        
        if (datosGlobales.length === 0) return;

        datosGlobales.sort((a, b) => {
            let valA = a[columnaOrdenActual] || "";
            let valB = b[columnaOrdenActual] || "";
            if (!isNaN(valA) && !isNaN(valB) && valA !== "" && valB !== "") {
                valA = Number(valA); valB = Number(valB);
            }
            if (valA < valB) return ascendenteActual ? -1 : 1;
            if (valA > valB) return ascendenteActual ? 1 : -1;
            return 0;
        });

        wrapper.innerHTML = "";
        mensaje.textContent = `Planilla lista con ${datosGlobales.length} registros.`;
        wrapper.style.display = "block";

        const registrosPorPagina = 25;
        const totalPaginas = Math.ceil(datosGlobales.length / registrosPorPagina);

        const flecha = (col) => {
            if (columnaOrdenActual !== col) return " ↕";
            return ascendenteActual ? " ▲" : " ▼";
        };

        const panelReferenciasHTML = `
            <table class="tabla-referencias">
                <tr><td class="ref-center" style="font-size:9px; padding:6px 0;">FRECUENCIA: ${frecuenciaVal} DIAS</td></tr>
                <tr><td class="ref-center"><div class="texto-vertical-ref">REFERENCIAS</div></td></tr>
                <tr><td>D - DESCARGADO</td></tr>
                <tr><td>R - REEMPLAZAR</td></tr>
                <tr><td>P - PINTAR</td></tr>
                <tr><td>I - IDENTIFICAR</td></tr>
                <tr><td>O - OBSTRUIDO</td></tr>
                <tr><td>V - VENCIDO</td></tr>
                <tr>
                    <td style="display:flex; align-items:flex-start; gap:5px;">
                        <span style="display:inline-block; width:10px; height:10px; border:1.2px solid #000; flex-shrink:0; margin-top:1px;"></span>
                        <span style="flex:1; line-height:1.25;">EN BLANCO SIGNIFICA QUE EL ITEM ESTA CORRECTO</span>
                    </td>
                </tr>
                
                <tr><td class="ref-box"></td></tr>
                
                <tr><td class="ref-center no-b-bottom">SERVICIO TERCERIZADO</td></tr>
                <tr><td class="ref-center no-b-mid">VIVATEC</td></tr>
                <tr><td class="ref-center no-b-mid">RESPONSABLE:</td></tr>
                <tr><td class="ref-center no-b-mid">IGNACIO REPETTO</td></tr>
                <tr><td class="ref-center no-b-mid">ING. INDUSTRIAL</td></tr>
                <tr><td class="ref-center no-b-mid">C.I.P.B.A - MAT.51142</td></tr>
                <tr><td class="no-b-top">FIRMA:</td></tr> 
                
                <tr><td class="ref-box"></td></tr>
                <tr><td class="ref-box"></td></tr>
                <tr><td class="ref-box"></td></tr>
                
                <tr><td class="ref-center" style="font-size: 11px; font-weight: 900; border-bottom: none !important;">VIVATEC</td></tr>
                <tr><td class="ref-center" style="border-top: none !important;">REGISTRO DPS 382</td></tr>
            </table>
        `;

        for (let i = 0; i < totalPaginas; i++) {
            const inicio = i * registrosPorPagina;
            const loteRegistros = datosGlobales.slice(inicio, inicio + registrosPorPagina);
            const numeroHoja = i + 1;
            
            let divPagina = document.createElement("div");
            divPagina.className = "pagina-hoja";

            let htmlTabla = `
                <table class="tabla-principal">
                    <colgroup>
                        <col style="width: 60px;">  <!-- N° -->
                        <col style="width: 45px;">  <!-- TIPO -->
                        <col style="width: 40px;">  <!-- KG -->
                        <col style="width: 45px;">  <!-- FAB -->
                        <col style="width: 90px;">  <!-- MARCA -->
                        <col style="width: 65px;">  <!-- VTO PH -->
                        <col style="width: 65px;">  <!-- VTO C -->
                        <col style="width: 70px;">  <!-- N-DPS -->
                        <col style="width: 55px;">  <!-- PUESTO -->
                        <col style="width: 220px;"> <!-- UBICACION -->
                        <col style="width: 20px;">  
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                        <col style="width: 20px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th colspan="5" class="th-membrete titulo-cliente">${cliente.toUpperCase()}</th>
                            <th colspan="7" class="th-membrete titulo-control">CONTROL DE EXTINTORES</th>
                            <th colspan="7" class="th-membrete titulo-planilla">PLANILLA DE REVISION N° 1</th>
                        </tr>
                        <tr>
                            <th colspan="12" class="th-membrete" style="text-align: left; padding-left: 10px;">
                                <span class="lbl-campo">FECHA DE REVISION:</span> ${window.fechaHoyStr}
                            </th>
                            <th colspan="7" class="th-membrete" style="text-align: left; padding-left: 10px;">
                                <span class="lbl-campo">Hoja ${numeroHoja}/${totalPaginas}</span>
                            </th>
                        </tr>
                        <tr>
                            <th class="th-columna" onclick="ordenarPor('extintor_numero')">N°${flecha('extintor_numero')}</th>
                            <th class="th-columna" onclick="ordenarPor('tipo')">TIPO${flecha('tipo')}</th>
                            <th class="th-columna" onclick="ordenarPor('capacidad')">KG${flecha('capacidad')}</th>
                            <th class="th-columna" onclick="ordenarPor('ano_fab')">FAB${flecha('ano_fab')}</th>
                            <th class="th-columna" onclick="ordenarPor('marca')">MARCA${flecha('marca')}</th>
                            <th class="th-columna" onclick="ordenarPor('vto_prueb_hidr')">VTO. PH${flecha('vto_prueb_hidr')}</th>
                            <th class="th-columna" onclick="ordenarPor('vto_carga')">VTO. C.${flecha('vto_carga')}</th>
                            <th class="th-columna" onclick="ordenarPor('numero_dps')">N°-DPS${flecha('numero_dps')}</th>
                            <th class="th-columna" onclick="ordenarPor('identificacion_puesto')">PUESTO${flecha('identificacion_puesto')}</th>
                            <th class="th-columna" onclick="ordenarPor('ubicacion')">UBICACIÓN${flecha('ubicacion')}</th>
                            
                            <th class="th-columna"><div class="texto-vertical">CARGA</div></th>
                            <th class="th-columna"><div class="texto-vertical">PRECINTO</div></th>
                            <th class="th-columna"><div class="texto-vertical">BALIZA</div></th>
                            <th class="th-columna"><div class="texto-vertical">RECIPIENTE</div></th>
                            <th class="th-columna"><div class="texto-vertical">MANOMETRO</div></th>
                            <th class="th-columna"><div class="texto-vertical">MANGUERA</div></th>
                            <th class="th-columna"><div class="texto-vertical">TOBERA</div></th>
                            <th class="th-columna"><div class="texto-vertical-ref">GABINETE</div></th>
                            <th class="th-columna"><div class="texto-vertical">ACCESO</div></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            loteRegistros.forEach(ex => {
                let formatoDps = ex.numero_dps || "-";
                if (formatoDps === "NUEVO") formatoDps = `<span class="badge badge-nuevo">NUEVO</span>`;

                let txtUbicacion = ex.ubicacion || "-";
                if (txtUbicacion.length > 32) txtUbicacion = txtUbicacion.substring(0, 32) + "...";

                let txtNumero = ex.extintor_numero || "-";
                if (String(txtNumero).length > 8) txtNumero = String(txtNumero).substring(0, 8);

                htmlTabla += `
                    <tr>
                        <td><strong>${txtNumero}</strong></td>
                        <td>${ex.tipo || "-"}</td>
                        <td>${ex.capacidad || "-"}</td>
                        <td>${ex.ano_fab || "-"}</td>
                        <td>${ex.marca || "-"}</td>
                        <td>${formatearFechaWeb(ex.vto_prueb_hidr)}</td>
                        <td>${formatearFechaWeb(ex.vto_carga)}</td>
                        <td>${formatoDps}</td>
                        <td>${ex.identificacion_puesto || "-"}</td>
                        <td class="texto-izq" title="${ex.ubicacion || ''}">${txtUbicacion}</td>
                        
                        <td><strong>${renderBool(ex.carga)}</strong></td>
                        <td><strong>${renderBool(ex.precinto)}</strong></td>
                        <td><strong>${renderBool(ex.baliza)}</strong></td>
                        <td><strong>${renderBool(ex.recipiente)}</strong></td>
                        <td><strong>${renderBool(ex.manometro)}</strong></td>
                        <td><strong>${renderBool(ex.manguera)}</strong></td>
                        <td><strong>${renderBool(ex.tobera)}</strong></td>
                        <td><strong>${renderBool(ex.gabinete)}</strong></td>
                        <td><strong>${renderBool(ex.acceso)}</strong></td>
                    </tr>
                `;
            });

            htmlTabla += `</tbody></table>`;
            
            divPagina.innerHTML = htmlTabla + panelReferenciasHTML;
            wrapper.appendChild(divPagina);
        }
    }
</script>
</body>
