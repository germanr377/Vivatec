<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión e Impresión de Obleas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 600px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input:read-only { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; }
        
        .btn { padding: 12px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn-buscar { background-color: #007bff; color: white; width: auto; flex-shrink: 0; padding: 10px 20px; margin-top: 0; }
        .btn-guardar { background-color: #28a745; color: white; }
        .btn-imprimir { background-color: #17a2b8; color: white; display: none; margin-top: 15px;}
        
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; font-weight: bold; text-align: center; display: none; }
        .alert-info { background-color: #d1ecf1; color: #0c5460; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-danger { background-color: #f8d7da; color: #721c24; }

        /* --- ZONA IMPRESIÓN --- */
        #printable-area { display: none; }
        .campo-impreso { position: absolute; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; color: #000; }
        .sello-impreso { font-family: 'Arial', sans-serif; font-size: 10px; font-weight: bold; color: #000; text-align: center; line-height: 1.2; }

        @media print {
            body { margin: 0; padding: 0; background-color: #fff; }
            .no-print { display: none !important; }
            #printable-area { display: block !important; position: absolute; top: 0; left: 0; width: 210mm; height: 297mm; }
            @page { margin: 0; } 
        }
    </style>
</head>
<body>

<div class="card no-print">
    <h2>Módulo de Impresión de Obleas</h2>
    <div class="form-group">
        <label for="inputBuscador">Número de Extintor (Buscar):</label>
        <div class="flex-row">
            <input type="text" id="inputBuscador" placeholder="Ej: 136864">
            <button class="btn btn-buscar" onclick="buscarExtintor()">Buscar</button>
        </div>
    </div>

    <div id="alertaEstado" class="alert"></div>

    <div id="seccionFormulario" style="display: none;">
        <div class="form-row">
            <div class="form-group">
                <label>Tipo Oblea:</label>
                <select id="tipoOblea"><option value="A">Oblea A</option><option value="B">Oblea B</option></select>
            </div>
            <div class="form-group">
                <label>Nº Extintor:</label>
                <input type="text" id="nroExtintorFijo" readonly>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Año Fabricación:</label>
                <input type="text" id="anoFab" placeholder="Ej: 2008">
            </div>
            <div class="form-group">
                <label>Venc. PH (Recarga):</label>
                <input type="text" id="fechaRecarga" placeholder="Ej: 11 28">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Capacidad:</label>
                <input type="text" id="capacidad" value="1 Kg">
            </div>
            <div class="form-group">
                <label>Agente Extintor:</label>
                <input type="text" id="agente" value="DPS">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Mes Vencimiento:</label>
                <input type="text" id="vencMes" placeholder="Ej: 11">
            </div>
            <div class="form-group">
                <label>Año Vencimiento:</label>
                <input type="text" id="vencAno" placeholder="Ej: 27">
            </div>
        </div>

        <div class="form-group">
            <label>Taller / Responsable:</label>
            <input type="text" id="taller" value="VIVATEC 382">
        </div>

        <button class="btn btn-guardar" onclick="guardarDatos()">Guardar Cambios / Registrar</button>
        <button id="btnImprimir" class="btn btn-imprimir" onclick="lanzarImpresion()">🖨️ Imprimir Tarjeta y Oblea</button>
    </div>
</div>

<!-- ==========================================
     MAPA DE IMPRESIÓN (MEDIDAS A CALIBRAR)
     ========================================== -->
<div id="printable-area">
    <!-- LADO IZQUIERDO (Tarjeta Usuario) -->
    <div id="izq-extintor" class="campo-impreso" style="top: 88mm; left: 35mm;"></div>
    <div id="izq-fab"      class="campo-impreso" style="top: 88mm; left: 55mm;"></div>
    <div id="izq-ph"       class="campo-impreso" style="top: 88mm; left: 70mm;"></div>
    <div id="izq-cap"      class="campo-impreso" style="top: 88mm; left: 90mm;"></div>
    <div id="izq-agente"   class="campo-impreso" style="top: 88mm; left: 110mm;"></div>
    <div id="izq-taller"   class="campo-impreso" style="top: 98mm; left: 50mm;"></div>
    <div id="izq-mes"      class="campo-impreso" style="top: 108mm; left: 60mm;"></div>
    <div id="izq-ano"      class="campo-impreso" style="top: 108mm; left: 75mm;"></div>
    
    <!-- SELLO AUTOMÁTICO (Mitad Izquierda) -->
    <div id="izq-sello" class="campo-impreso sello-impreso" style="top: 98mm; left: 85mm;">
        IGNACIO REPETTO<br>INGENIERO INDUSTRIAL<br>C.I.P.B.A. Mat. 5111
    </div>

    <!-- LADO DERECHO (Oblea Extintor) -->
    <div id="der-extintor" class="campo-impreso" style="top: 60mm; left: 160mm; transform: rotate(-90deg);"></div>
    <div id="der-ph"       class="campo-impreso" style="top: 60mm; left: 170mm; transform: rotate(-90deg);"></div>
    <div id="der-mes"      class="campo-impreso" style="top: 75mm; left: 155mm; transform: rotate(-90deg);"></div>
    <div id="der-ano"      class="campo-impreso" style="top: 75mm; left: 165mm; transform: rotate(-90deg);"></div>
    <div id="der-taller"   class="campo-impreso" style="top: 70mm; left: 175mm; transform: rotate(-90deg);"></div>
</div>

<script>
    // ACORDATE DE PEGAR TU URL DE APPS SCRIPT ACÁ ADENTRO
    const URL_API = "AQUI_PEGA_TU_URL_DE_APPS_SCRIPT";
    let esRegistroNuevo = false;

    async function buscarExtintor() {
        const nro = document.getElementById('inputBuscador').value.trim();
        if (!nro) { mostrarAlerta("Por favor, ingrese un número.", "danger"); return; }
        mostrarAlerta("Buscando en la base...", "info");
        
        try {
            let respuesta = await fetch(`${URL_API}?accion=buscar&extintor=${encodeURIComponent(nro)}`);
            let res = await respuesta.json();
            document.getElementById('seccionFormulario').style.display = 'block';
            document.getElementById('nroExtintorFijo').value = nro;
            document.getElementById('btnImprimir').style.display = 'none';

            if (res.encontrado) {
                esRegistroNuevo = false;
                document.getElementById('tipoOblea').value = res.tipo || "A";
                document.getElementById('anoFab').value = res.anoFab || "";
                document.getElementById('fechaRecarga').value = res.recarga || "";
                document.getElementById('capacidad').value = res.capacidad || "1 Kg";
                document.getElementById('agente').value = res.agente || "DPS";
                document.getElementById('vencMes').value = res.vencMes || "";
                document.getElementById('vencAno').value = res.vencAno || "";
                document.getElementById('taller').value = res.taller || "VIVATEC 382";
                mostrarAlerta("Extintor encontrado. Verificá y guardá.", "info");
            } else {
                esRegistroNuevo = true;
                document.getElementById('tipoOblea').value = "A";
                document.getElementById('anoFab').value = "";
                document.getElementById('fechaRecarga').value = "";
                document.getElementById('vencMes').value = "";
                document.getElementById('vencAno').value = "";
                mostrarAlerta("Extintor NUEVO. Cargá los datos.", "success");
            }
        } catch (error) { mostrarAlerta("Error de conexión.", "danger"); }
    }

    async function guardarDatos() {
        const datos = {
            accion: "guardar",
            extintor: document.getElementById('nroExtintorFijo').value,
            tipo: document.getElementById('tipoOblea').value,
            anoFab: document.getElementById('anoFab').value,
            recarga: document.getElementById('fechaRecarga').value,
            capacidad: document.getElementById('capacidad').value,
            agente: document.getElementById('agente').value,
            vencMes: document.getElementById('vencMes').value,
            vencAno: document.getElementById('vencAno').value,
            taller: document.getElementById('taller').value
        };
        mostrarAlerta("Guardando...", "info");
        try {
            let res = await fetch(URL_API, { method: "POST", body: JSON.stringify(datos) });
            let json = await res.json();
            if (json.exito) {
                mostrarAlerta("¡Guardado OK!", "success");
                document.getElementById('btnImprimir').style.display = 'block';
            }
        } catch (error) { mostrarAlerta("Error al guardar.", "danger"); }
    }

    function lanzarImpresion() {
        // Volcar a Tarjeta (Izq)
        document.getElementById('izq-extintor').innerText = document.getElementById('nroExtintorFijo').value;
        document.getElementById('izq-fab').innerText = document.getElementById('anoFab').value;
        document.getElementById('izq-ph').innerText = document.getElementById('fechaRecarga').value;
        document.getElementById('izq-cap').innerText = document.getElementById('capacidad').value;
        document.getElementById('izq-agente').innerText = document.getElementById('agente').value;
        document.getElementById('izq-taller').innerText = document.getElementById('taller').value;
        document.getElementById('izq-mes').innerText = document.getElementById('vencMes').value;
        document.getElementById('izq-ano').innerText = document.getElementById('vencAno').value;

        // Volcar a Oblea (Der)
        document.getElementById('der-extintor').innerText = document.getElementById('nroExtintorFijo').value;
        document.getElementById('der-ph').innerText = document.getElementById('fechaRecarga').value;
        document.getElementById('der-mes').innerText = document.getElementById('vencMes').value;
        document.getElementById('der-ano').innerText = document.getElementById('vencAno').value;
        document.getElementById('der-taller').innerText = document.getElementById('taller').value;

        window.print();
    }

    function mostrarAlerta(msg, tipo) {
        let a = document.getElementById('alertaEstado');
        a.innerText = msg; a.className = `alert alert-${tipo}`; a.style.display = "block";
    }
</script>
</body>
</html>
