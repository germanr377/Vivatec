<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Gestión e Impresión de Obleas</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; transition: background 0.3s; }
        
        .search-row { display: flex; gap: 15px; }
        .search-row .form-group { flex: 1; }

        .btn-search { background: #2980b9; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        
        /* Formulario Editable y Preview */
        .oblea-preview { margin-top: 30px; border: 2px dashed #3498db; padding: 15px 20px; border-radius: 6px; background: #fafbfc; display: none; transition: all 0.3s; }
        .oblea-header { font-size: 18px; font-weight: bold; text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-bottom: 15px; }
        
        /* DISEÑO COMPACTO POR FILAS */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; } 
        
        /* Ajuste de tamaño visual */
        .oblea-preview label { font-size: 12px; margin-bottom: 4px; color: #444; }
        .oblea-preview input, .oblea-preview select { padding: 8px; font-size: 14px; }
        
        /* Estilos para el modo RECARGA (Fondo Amarillo) */
        .modo-recarga { background-color: #fff9c4 !important; border-color: #f1c40f !important; }
        .modo-recarga input, .modo-recarga select { background-color: #fffde7; border-color: #f1c40f; }

        /* Botones de acción */
        .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn-save { background: #d35400; flex: 1; min-width: 120px; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .btn-save.success { background: #2ecc71 !important; }
        .btn-print { background: #27ae60; flex: 1; min-width: 120px; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: #7f8c8d; flex: 1; min-width: 120px; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-warning { background: #f1c40f; flex: 1; min-width: 120px; padding: 12px; border: none; color: #333; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        @media print {
            body * { visibility: hidden; }
            .oblea-preview, .oblea-preview * { visibility: visible; }
            .oblea-preview { position: absolute; left: 0; top: 0; width: 100%; border: none; background: white !important; }
            .oblea-preview input, .oblea-preview select { background: transparent !important; border: none !important; }
            .action-buttons, .container > *:not(.oblea-preview) { display: none; }
        }
        @media (max-width: 600px) { 
            .search-row { flex-direction: column; gap: 0; } 
            .action-buttons { flex-direction: column; }
            .form-row .form-group { min-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Vivatec - Gestión e Impresión de Obleas</h2>

    <div class="form-group">
        <label for="clienteSelect">Cliente (Opcional):</label>
        <select id="clienteSelect">
            <option value="">-- Todos los clientes / No filtrar --</option>
        </select>
    </div>

    <!-- Buscador Manual -->
    <div class="search-row">
        <div class="form-group">
            <label for="nroExtintorInput">N° de Extintor:</label>
            <input type="text" id="nroExtintorInput" placeholder="Ej: 6389130">
        </div>
        <div class="form-group">
            <label for="nroDpsInput">N° de DPS:</label>
            <input type="text" id="nroDpsInput" placeholder="Ej: 5503020">
        </div>
    </div>

    <button class="btn-search" onclick="buscarExtintor()">⚡ Buscar Extintor</button>

    <!-- FORMULARIO EDITABLE -->
    <div id="obleaPreview" class="oblea-preview">
        <div class="oblea-header">DATOS DEL EXTINTOR</div>
        
        <input type="hidden" id="editId">

        <!-- FILA 1: Cliente, N° Extintor, DPS -->
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>Cliente:</label>
                <input type="text" id="editCliente">
            </div>
            <div class="form-group" style="flex: none; width: 15ch;">
                <label>N° Extintor:</label>
                <input type="text" id="editExtintor">
            </div>
            <div class="form-group" style="flex: none; width: 15ch;">
                <label>N° DPS:</label>
                <input type="text" id="editDps">
            </div>
        </div>

        <!-- FILA 2: Tipo de Oblea, Marca, Tipo, Agente Extintor, Capacidad -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>Tipo de Oblea:</label>
                <select id="editOblea">
                    <option value="">(En blanco)</option>
                    <option value="Uso Gral">Uso Gral</option>
                    <option value="Vehicular 1K">Vehicular 1K</option>
                    <option value="Vehicular">Vehicular</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Marca:</label>
                <input type="text" id="editMarca">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Tipo:</label>
                <input type="text" id="editTipo">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Agente Extintor:</label>
                <input type="text" id="editAgente" placeholder="Ej: ABC / CO2">
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Capacidad:</label>
                <input type="text" id="editCapacidad">
            </div>
        </div>

        <!-- FILA 3: Año Fab, Vencimientos y Ubicación -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Año Fab.:</label>
                <input type="number" id="editAFabricacion">
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Venc. P.H.:</label>
                <input type="text" id="editVencPH" placeholder="MM/AAAA">
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Venc. Carga:</label>
                <input type="text" id="editVencCarga" placeholder="MM/AAAA">
            </div>
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Puesto:</label>
                <input type="number" id="editPuesto">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Ubicación:</label>
                <input type="text" id="editUbicacion">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-cancel" onclick="volverABuscar()">↩️ Volver</button>
            <button class="btn-warning" onclick="iniciarRecarga()">🔄 RECARGA</button>
            <button id="btnGuardar" class="btn-save" onclick="guardarCambios()">💾 Guardar Cambios</button>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir Oblea</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) {
            return `${partes[1]}/${partes[0]}`;
        }
        return fechaSQL;
    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        let partes = fechaWeb.trim().split("/");
        
        if (partes.length === 2) {
            let mes = partes[0].padStart(2, '0');
            let anio = partes[1];
            return `${anio}-${mes}-01`;
        } 
        else if (partes.length === 3) {
            let dia = partes[0].padStart(2, '0');
            let mes = partes[1].padStart(2, '0');
            let anio = partes[2];
            return `${anio}-${mes}-${dia}`;
        }
        
        return null;
    }

    window.addEventListener("load", async function() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente')
            .not('cliente', 'is', null);

        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("clienteSelect");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }
    });

    async function buscarExtintor() {
        document.getElementById("obleaPreview").classList.remove("modo-recarga");

        let cliente = document.getElementById("clienteSelect").value.trim();
        let nroExtintor = document.getElementById("nroExtintorInput").value.trim();
        let nroDps = document.getElementById("nroDpsInput").value.trim();

        if (!cliente && !nroExtintor && !nroDps) {
            alert("Por favor, completá al menos un campo de búsqueda.");
            return;
        }

        let query = _supabase.from('extintores').select('*');

        if (cliente) query = query.eq('cliente', cliente);
        if (nroExtintor) query = query.eq('extintor_numero', nroExtintor);
        if (nroDps) query = query.eq('numero_dps', nroDps);

        const { data, error } = await query.order('id', { ascending: false }).limit(1);

        if (error) {
            console.error("Error al buscar:", error);
            alert("Ocurrió un error al consultar Supabase.");
            return;
        }

        if (data && data.length > 0) {
            let ex = data[0];
            document.getElementById("editId").value = ex.id;
            document.getElementById("editCliente").value = ex.cliente || "";
            document.getElementById("editOblea").value = ex.oblea || "";
            document.getElementById("editExtintor").value = ex.extintor_numero || "";
            document.getElementById("editTipo").value = ex.tipo || "";
            document.getElementById("editAgente").value = ex.agente_extintor || ""; // Cargamos el agente
            document.getElementById("editCapacidad").value = ex.capacidad || "";
            document.getElementById("editAFabricacion").value = ex.ano_fab || "";
            document.getElementById("editMarca").value = ex.marca || "";
            
            document.getElementById("editVencPH").value = formatearFechaWeb(ex.vto_prueb_hidr);
            document.getElementById("editVencCarga").value = formatearFechaWeb(ex.vto_carga);
            
            document.getElementById("editDps").value = ex.numero_dps || "";
            document.getElementById("editPuesto").value = ex.identificacion_puesto || "";
            document.getElementById("editUbicacion").value = ex.ubicacion || "";

            document.getElementById("obleaPreview").style.display = "block";
        } else {
            alert("No se encontró ningún extintor con los datos indicados.");
            document.getElementById("obleaPreview").style.display = "none";
        }
    }

    function iniciarRecarga() {
        let nuevoDps = prompt("Ingrese el nuevo número de DPS (Deje en blanco si es 'NUEVO'):");
        
        if (nuevoDps === null) return;

        let hoy = new Date();
        let anio = hoy.getFullYear() + 1;
        let mes = String(hoy.getMonth() + 1).padStart(2, '0');
        let nuevaFechaCarga = `${mes}/${anio}`;

        document.getElementById("editVencCarga").value = nuevaFechaCarga;
        document.getElementById("editDps").value = nuevoDps.trim().toUpperCase();

        document.getElementById("obleaPreview").classList.add("modo-recarga");
    }

    async function guardarCambios() {
        let id = document.getElementById("editId").value;
        if (!id) return;

        let valAnoFab = document.getElementById("editAFabricacion").value;
        let valPuesto = document.getElementById("editPuesto").value;

        const actualizacion = {
            cliente: document.getElementById("editCliente").value,
            oblea: document.getElementById("editOblea").value,
            extintor_numero: document.getElementById("editExtintor").value,
            tipo: document.getElementById("editTipo").value,
            agente_extintor: document.getElementById("editAgente").value, // Guardamos el agente
            capacidad: document.getElementById("editCapacidad").value,
            ano_fab: valAnoFab ? parseInt(valAnoFab, 10) : null,
            marca: document.getElementById("editMarca").value,
            
            vto_prueb_hidr: formatearFechaSQL(document.getElementById("editVencPH").value),
            vto_carga: formatearFechaSQL(document.getElementById("editVencCarga").value),
            
            numero_dps: document.getElementById("editDps").value,
            identificacion_puesto: valPuesto ? parseInt(valPuesto, 10) : null,
            ubicacion: document.getElementById("editUbicacion").value
        };

        const { error } = await _supabase
            .from('extintores')
            .update(actualizacion)
            .eq('id', id);

        if (error) {
            console.error("Error al actualizar:", error);
            alert("No se pudieron guardar los cambios.");
        } else {
            document.getElementById("obleaPreview").classList.remove("modo-recarga");
            
            const btn = document.getElementById("btnGuardar");
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "✅ ¡Guardado!";
            btn.classList.add("success");
            
            setTimeout(() => {
                btn.innerHTML = textoOriginal;
                btn.classList.remove("success");
            }, 2000);
        }
    }

    function volverABuscar() {
        document.getElementById("obleaPreview").style.display = "none";
        document.getElementById("obleaPreview").classList.remove("modo-recarga");
        document.getElementById("clienteSelect").value = "";
        document.getElementById("nroExtintorInput").value = "";
        document.getElementById("nroDpsInput").value = "";
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
