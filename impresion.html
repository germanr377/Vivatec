<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Impresión de Obleas</title>
    <!-- Incluimos Tesseract.js para el reconocimiento óptico de caracteres -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .search-row {
            display: flex;
            gap: 15px;
        }
        .search-row .form-group {
            flex: 1;
        }
        .input-with-cam {
            display: flex;
            align-items: center;
            position: relative;
        }
        .input-with-cam input {
            padding-right: 45px; /* Espacio para el botón de la cámara */
        }
        .btn-cam-icon {
            position: absolute;
            right: 5px;
            background: #3498db;
            border: none;
            color: white;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-cam-icon:hover {
            background: #2980b9;
        }
        button.btn-search {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button.btn-search:hover {
            background-color: #219653;
        }
        /* Estilo de la Oblea para Imprimir */
        .oblea-preview {
            margin-top: 30px;
            border: 2px dashed #3498db;
            padding: 20px;
            border-radius: 6px;
            background: #fafbfc;
            display: none;
        }
        .oblea-header {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .oblea-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        .oblea-grid div span {
            font-weight: bold;
        }
        .btn-print {
            background-color: #2980b9;
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-print:hover {
            background-color: #1f618d;
        }
        #loadingScan {
            display: none;
            color: #e67e22;
            font-weight: bold;
            font-size: 12px;
            margin-top: 4px;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            .oblea-preview, .oblea-preview * {
                visibility: visible;
            }
            .oblea-preview {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
                background: white;
            }
            .btn-print, .container > *:not(.oblea-preview) {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Impresión de Obleas - Vivatec</h2>
    
    <!-- Selección de Cliente (Opcional) -->
    <div class="form-group">
        <label for="clienteSelect">Cliente (Opcional):</label>
        <select id="clienteSelect">
            <option value="">-- Todos los clientes / No filtrar --</option>
        </select>
    </div>

    <!-- Campos de Búsqueda -->
    <div class="search-row">
        <div class="form-group">
            <label for="nroExtintorInput">N° de Extintor:</label>
            <input type="text" id="nroExtintorInput" placeholder="Ej: 105">
        </div>
        <div class="form-group">
            <label for="nroDpsInput">N° de DPS:</label>
            <div class="input-with-cam">
                <input type="text" id="nroDpsInput" placeholder="Ej: 4521">
                <!-- Input de cámara oculto que se activa al presionar el ícono -->
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="leerTextoDPS(event)">
                <button type="button" class="btn-cam-icon" onclick="document.getElementById('cameraInput').click()" title="Escanear con cámara">📷</button>
            </div>
            <div id="loadingScan">Leyendo número...</div>
        </div>
    </div>

    <button class="btn-search" onclick="buscarExtintor()">Buscar Extintor</button>

    <!-- Vista Previa de la Oblea -->
    <div id="obleaPreview" class="oblea-preview">
        <div class="oblea-header">VIVATEC - CONTROL DE EXTINTORES</div>
        <div class="oblea-grid">
            <div><span>Cliente:</span> <span id="lblCliente">-</span></div>
            <div><span>Extintor N°:</span> <span id="lblExtintor">-</span></div>
            <div><span>Tipo y Capacidad:</span> <span id="lblTipoCap">-</span></div>
            <div><span>Marca:</span> <span id="lblMarca">-</span></div>
            <div><span>Venc. Carga:</span> <span id="lblVencCarga">-</span></div>
            <div><span>Venc. P.H.:</span> <span id="lblVencPH">-</span></div>
            <div><span>N° DPS:</span> <span id="lblDps">-</span></div>
            <div><span>Puesto / Ubicación:</span> <span id="lblUbicacion">-</span></div>
        </div>
        <button class="btn-print" onclick="window.print()">Imprimir Oblea</button>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    // Cargar la lista de clientes al abrir la página
    window.onload = function() {
        fetch(URL_API + "?accion=obtenerClientes")
            .then(response => response.json())
            .then(data => {
                let select = document.getElementById("clienteSelect");
                if(data.clientes) {
                    data.clientes.forEach(cliente => {
                        let opt = document.createElement("option");
                        opt.value = cliente;
                        opt.textContent = cliente;
                        select.appendChild(opt);
                    });
                }
            })
            .catch(err => console.error("Error al cargar clientes:", err));
    };

    // Función que procesa la foto de la cámara y extrae el número DPS
    function leerTextoDPS(event) {
        let file = event.target.files[0];
        if (!file) return;

        let loadingDiv = document.getElementById("loadingScan");
        loadingDiv.style.display = "block";

        Tesseract.recognize(
            file,
            'eng',
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            loadingDiv.style.display = "none";
            let textoLimpiado = text.replace(/[^0-9]/g, '').trim();
            if (textoLimpiado) {
                document.getElementById("nroDpsInput").value = textoLimpiado;
            } else {
                alert("No se pudo leer con claridad. Probá enfocar bien el número o tipearlo a mano.");
            }
        }).catch(err => {
            loadingDiv.style.display = "none";
            console.error(err);
            alert("Error al procesar la imagen.");
        });
    }

    function buscarExtintor() {
        let cliente = document.getElementById("clienteSelect").value.trim();
        let nroExtintor = document.getElementById("nroExtintorInput").value.trim();
        let nroDps = document.getElementById("nroDpsInput").value.trim();

        if (!cliente && !nroExtintor && !nroDps) {
            alert("Por favor, completá al menos un campo de búsqueda.");
            return;
        }

        let url = `${URL_API}?accion=buscarParaImpresion&cliente=${encodeURIComponent(cliente)}&extintor=${encodeURIComponent(nroExtintor)}&dps=${encodeURIComponent(nroDps)}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.encontrado) {
                    document.getElementById("lblCliente").textContent = data.extintor.cliente || cliente || "N/D";
                    document.getElementById("lblExtintor").textContent = data.extintor.extintor;
                    document.getElementById("lblTipoCap").textContent = `${data.extintor.tipo} - ${data.extintor.capacidad}`;
                    document.getElementById("lblMarca").textContent = data.extintor.marca;
                    document.getElementById("lblVencCarga").textContent = data.extintor.vencCarga;
                    document.getElementById("lblVencPH").textContent = data.extintor.vencPH;
                    document.getElementById("lblDps").textContent = data.extintor.nroDps;
                    document.getElementById("lblUbicacion").textContent = `${data.extintor.puesto} (${data.extintor.ubicacion})`;

                    document.getElementById("obleaPreview").style.display = "block";
                } else {
                    alert("No se encontró ningún extintor con los datos indicados.");
                    document.getElementById("obleaPreview").style.display = "none";
                }
            })
            .catch(err => {
                console.error("Error en la búsqueda:", err);
                alert("Error al comunicarse con la base de datos.");
            });
    }
</script>

</body>
</html>
