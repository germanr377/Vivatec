<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Gestión e Impresión de Obleas</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <!-- Módulo de escáner cámara -->
    <script src="escaner.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        
        .search-row { display: flex; gap: 15px; }
        .search-row .form-group { flex: 1; }
        
        .input-with-cam { position: relative; display: flex; align-items: center; }
        .input-with-cam input { padding-right: 50px; }
        .btn-cam-icon { position: absolute; right: 5px; background: #3498db; border: none; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 18px; }
        
        /* Visor de Cámara */
        #visorCamara { display: none; margin-top: 15px; padding: 15px; background: #222; border-radius: 8px; text-align: center; }
        .marco-video { position: relative; width: 100%; height: 140px; overflow: hidden; border: 3px solid #3498db; border-radius: 6px; background: #000; }
        #videoEnVivo { width: 100%; height: 100%; object-fit: cover; }
        .laser { position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: rgba(255,0,0,0.8); box-shadow: 0 0 10px red; transform: translateY(-50%); animation: parpadeo 1.5s infinite; }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .controles-visor { margin-top: 15px; }
        .btn-cerrar { background: #e74c3c; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; }
        #estadoLectura { color: #2ecc71; font-weight: bold; margin-top: 10px; font-size: 14px; }

        .btn-search { background: #2980b9; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        
        /* Formulario Editable y Preview */
        .oblea-preview { margin-top: 30px; border: 2px dashed #3498db; padding: 20px; border-radius: 6px; background: #fafbfc; display: none; }
        .oblea-header { font-size: 18px; font-weight: bold; text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-bottom: 15px; }
        .oblea-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        /* Botones de acción */
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #d35400; flex: 1; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-print { background: #27ae60; flex: 1; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: #7f8c8d; flex: 1; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        @media print {
            body * { visibility: hidden; }
            .oblea-preview, .oblea-preview * { visibility: visible; }
            .oblea-preview { position: absolute; left: 0; top: 0; width: 100%; border: none; background: white; }
            .action-buttons, input, select { border: none; background: transparent; }
            .action-buttons, .container > *:not(.oblea-preview) { display: none; }
        }
        @media (max-width: 600px) { 
            .oblea-grid { grid-template-columns: 1fr; } 
            .search-row { flex-direction: column; gap: 0; } 
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Vivatec - Impresión de Obleas</h2>

    <div class="form-group">
        <label for="clienteSelect">Cliente (Opcional):</label>
        <select id="clienteSelect">
            <option value="">-- Todos los clientes / No filtrar --</option>
        </select>
    </div>

    <!-- Visor de cámara -->
    <div id="visorCamara">
        <div class="marco-video">
            <video id="videoEnVivo" autoplay playsinline muted></video>
            <div class="laser"></div>
        </div>
        <div id="estadoLectura">Buscando número automáticamente... Mantené firme.</div>
        <div class="controles-visor">
            <button class="btn-cerrar" onclick="apagarCamara()">❌ Cancelar Escaneo</button>
        </div>
    </div>

    <div class="search-row">
        <div class="form-group">
            <label for="nroExtintorInput">N° de Extintor:</label>
            <input type="text" id="nroExtintorInput" placeholder="Ej: 6389130">
        </div>
        <div class="form-group">
            <label for="nroDpsInput">N° de DPS:</label>
            <div class="input-with-cam">
                <input type="text" id="nroDpsInput" placeholder="Ej: 5503020">
                <button type="button" class="btn-cam-icon" onclick="encenderCamara('nroDpsInput')" title="Abrir visor">📷</button>
            </div>
        </div>
    </div>

    <button class="btn-search" onclick="buscarExtintor()">⚡ Buscar Extintor</button>

    <!-- FORMULARIO EDITABLE -->
    <div id="obleaPreview" class="oblea-preview">
        <div class="oblea-header">DATOS DEL EXTINTOR</div>
        
        <input type="hidden" id="editId">

        <div class="oblea-grid">
            <div class="form-group">
                <label>Cliente:</label>
                <input type="text" id="editCliente">
            </div>
            <div class="form-group">
                <label>Tipo de Oblea:</label>
                <select id="editOblea">
                    <option value="">(En blanco)</option>
                    <option value="Uso Gral">Uso Gral</option>
                    <option value="Vehicular 1K">Vehicular 1K</option>
                    <option value="Vehicular">Vehicular</option>
                </select>
            </div>
            <div class="form-group">
                <label>N° Extintor:</label>
                <input type="text" id="editExtintor">
            </div>
            <div class="form-group">
                <label>Tipo:</label>
                <input type="text" id="editTipo">
            </div>
            <div class="form-group">
                <label>Capacidad (Kg/Lt):</label>
                <input type="text" id="editCapacidad">
            </div>
            <div class="form-group">
                <label>Año Fabricación:</label>
                <input type="number" id="editAFabricacion">
            </div>
            <div class="form-group">
                <label>Marca:</label>
                <input type="text" id="editMarca">
            </div>
            <div class="form-group">
                <label>Venc. Prueba Hidráulica:</label>
                <input type="date" id="editVencPH">
            </div>
            <div class="form-group">
                <label>Vencimiento Carga:</label>
                <input type="date" id="editVencCarga">
            </div>
            <div class="form-group">
                <label>N° DPS:</label>
                <input type="text" id="editDps">
            </div>
            <div class="form-group">
                <label>Puesto:</label>
                <input type="number" id="editPuesto">
            </div>
            <div class="form-group">
                <label>Ubicación:</label>
                <input type="text" id="editUbicacion">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-cancel" onclick="volverABuscar()">↩️ Volver</button>
            <button class="btn-save" onclick="guardarCambios()">💾 Guardar Cambios</button>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir Oblea</button>
        </div>
    </div>
</div>

<script>
    // CREDENCIALES CONFIGURADAS CON SUPABASE
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cargar clientes al iniciar
    window.addEventListener("load", async function() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente')
            .not('cliente', 'is', null);

        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("clienteSelect");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }
    });

    // BUSCAR EXTINTOR EN SUPABASE
    async function buscarExtintor() {
        let cliente = document.getElementById("clienteSelect").value.trim();
        let nroExtintor = document.getElementById("nroExtintorInput").value.trim();
        let nroDps = document.getElementById("nroDpsInput").value.trim();

        if (!cliente && !nroExtintor && !nroDps) {
            alert("Por favor, completá al menos un campo de búsqueda.");
            return;
        }

        let query = _supabase.from('extintores').select('*');

        if (cliente) query = query.eq('cliente', cliente);
        if (nroExtintor) query = query.eq('extintor_numero', nroExtintor);
        if (nroDps) query = query.eq('numero_dps', nroDps);

        const { data, error } = await query.order('id', { ascending: false }).limit(1);

        if (error) {
            console.error("Error al buscar:", error);
            alert("Ocurrió un error al consultar Supabase.");
            return;
        }

        if (data && data.length > 0) {
            let ex = data[0];
            document.getElementById("editId").value = ex.id;
            document.getElementById("editCliente").value = ex.cliente || "";
            document.getElementById("editOblea").value = ex.oblea || "";
            document.getElementById("editExtintor").value = ex.extintor_numero || "";
            document.getElementById("editTipo").value = ex.tipo || "";
            document.getElementById("editCapacidad").value = ex.capacidad || "";
            document.getElementById("editAFabricacion").value = ex.ano_fab || "";
            document.getElementById("editMarca").value = ex.marca || "";
            document.getElementById("editVencPH").value = ex.vto_prueb_hidr || "";
            document.getElementById("editVencCarga").value = ex.vto_carga || "";
            document.getElementById("editDps").value = ex.numero_dps || "";
            document.getElementById("editPuesto").value = ex.identificacion_puesto || "";
            document.getElementById("editUbicacion").value = ex.ubicacion || "";

            document.getElementById("obleaPreview").style.display = "block";
        } else {
            alert("No se encontró ningún extintor con los datos indicados.");
            document.getElementById("obleaPreview").style.display = "none";
        }
    }

    // GUARDAR CAMBIOS EN SUPABASE
    async function guardarCambios() {
        let id = document.getElementById("editId").value;
        if (!id) {
            alert("No hay ningún extintor seleccionado.");
            return;
        }

        let valAnoFab = document.getElementById("editAFabricacion").value;
        let valPuesto = document.getElementById("editPuesto").value;

        const actualizacion = {
            cliente: document.getElementById("editCliente").value,
            oblea: document.getElementById("editOblea").value,
            extintor_numero: document.getElementById("editExtintor").value,
            tipo: document.getElementById("editTipo").value,
            capacidad: document.getElementById("editCapacidad").value,
            ano_fab: valAnoFab ? parseInt(valAnoFab, 10) : null,
            marca: document.getElementById("editMarca").value,
            vto_prueb_hidr: document.getElementById("editVencPH").value || null,
            vto_carga: document.getElementById("editVencCarga").value || null,
            numero_dps: document.getElementById("editDps").value,
            identificacion_puesto: valPuesto ? parseInt(valPuesto, 10) : null,
            ubicacion: document.getElementById("editUbicacion").value
        };

        const { error } = await _supabase
            .from('extintores')
            .update(actualizacion)
            .eq('id', id);

        if (error) {
            console.error("Error al actualizar:", error);
            alert("No se pudieron guardar los cambios.");
        } else {
            alert("¡Extintor actualizado instantáneamente en Supabase!");
        }
    }

    // VOLVER (CERRAR EDICIÓN Y LIMPIAR CAMPOS)
    function volverABuscar() {
        // Ocultar el recuadro del extintor
        document.getElementById("obleaPreview").style.display = "none";
        
        // Limpiar los campos de búsqueda
        document.getElementById("clienteSelect").value = "";
        document.getElementById("nroExtintorInput").value = "";
        document.getElementById("nroDpsInput").value = "";
        
        // Subir la pantalla al tope
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
