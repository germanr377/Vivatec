
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Impresión de Obleas</title>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-row {
            display: flex;
            gap: 15px;
        }

        .search-row .form-group {
            flex: 1;
            min-width: 0;
        }

        .input-with-cam {
            display: flex;
            align-items: center;
            position: relative;
        }

        .input-with-cam input {
            padding-right: 45px;
        }

        .btn-cam-icon {
            position: absolute;
            right: 5px;
            background: #3498db;
            border: none;
            color: white;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-cam-icon:hover {
            background: #2980b9;
        }

        /* VISOR COMPACTO */

        #scannerContainer {
            display: none;
            margin: 10px auto;
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #111;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 105px;
            overflow: hidden;
            border-radius: 7px;
            border: 2px solid #3498db;
            box-sizing: border-box;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-guide {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 36px;
            border: 2px dashed #2ecc71;
            border-radius: 5px;
            transform: translateY(-50%);
            pointer-events: none;
            background: rgba(46,204,113,0.06);
        }

        .scanner-controls {
            margin-top: 7px;
        }

        .btn-close-cam {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 9px;
            width: 100%;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        #loadingScan {
            display: none;
            color: #f39c12;
            font-weight: bold;
            font-size: 13px;
            margin-top: 7px;
            text-align: center;
        }

        .btn-search {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-search:hover {
            background-color: #1f618d;
        }

        /* VISTA PREVIA OBLEA */

        .oblea-preview {
            margin-top: 30px;
            border: 2px dashed #3498db;
            padding: 20px;
            border-radius: 6px;
            background: #fafbfc;
            display: none;
        }

        .oblea-header {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .oblea-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }

        .oblea-grid div span {
            font-weight: bold;
        }

        .btn-print {
            background-color: #27ae60;
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-print:hover {
            background-color: #219653;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .oblea-preview, .oblea-preview * {
                visibility: visible;
            }

            .oblea-preview {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
                background: white;
            }

            .btn-print, .container > *:not(.oblea-preview) {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .search-row {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Impresión de Obleas - Vivatec</h2>

    <!-- CLIENTE -->

    <div class="form-group">
        <label for="clienteSelect">Cliente (Opcional):</label>

        <select id="clienteSelect">
            <option value="">-- Todos los clientes / No filtrar --</option>
        </select>
    </div>

    <!-- VISOR DE CAMARA -->

    <div id="scannerContainer">

        <div class="video-wrapper">
            <video id="videoElement" autoplay playsinline></video>
            <div class="scanner-guide"></div>
        </div>

        <div id="loadingScan">
            Preparando lector...
        </div>

        <div class="scanner-controls">
            <button type="button"
                class="btn-close-cam"
                onclick="cerrarCamara()">
                ❌ Cancelar
            </button>
        </div>

    </div>

    <!-- CAMPOS DE BUSQUEDA -->

    <div class="search-row">

        <div class="form-group">
            <label for="nroExtintorInput">N° de Extintor:</label>

            <input
                type="text"
                id="nroExtintorInput"
                placeholder="Ej: 105">
        </div>

        <div class="form-group">
            <label for="nroDpsInput">N° de DPS:</label>

            <div class="input-with-cam">

                <input
                    type="text"
                    id="nroDpsInput"
                    placeholder="Ej: 4521">

                <button
                    type="button"
                    class="btn-cam-icon"
                    onclick="iniciarCamara()"
                    title="Abrir cámara">
                    📷
                </button>

            </div>
        </div>

    </div>

    <button class="btn-search" onclick="buscarExtintor()">
        Buscar Extintor
    </button>

    <!-- VISTA PREVIA OBLEA -->

    <div id="obleaPreview" class="oblea-preview">

        <div class="oblea-header">
            VIVATEC - CONTROL DE EXTINTORES
        </div>

        <div class="oblea-grid">

            <div>
                <span>Cliente:</span>
                <span id="lblCliente">-</span>
            </div>

            <div>
                <span>Extintor N°:</span>
                <span id="lblExtintor">-</span>
            </div>

            <div>
                <span>Tipo y Capacidad:</span>
                <span id="lblTipoCap">-</span>
            </div>

            <div>
                <span>Marca:</span>
                <span id="lblMarca">-</span>
            </div>

            <div>
                <span>Venc. Carga:</span>
                <span id="lblVencCarga">-</span>
            </div>

            <div>
                <span>Venc. P.H.:</span>
                <span id="lblVencPH">-</span>
            </div>

            <div>
                <span>N° DPS:</span>
                <span id="lblDps">-</span>
            </div>

            <div>
                <span>Puesto / Ubicación:</span>
                <span id="lblUbicacion">-</span>
            </div>

        </div>

        <button class="btn-print" onclick="window.print()">
            Imprimir Oblea
        </button>

    </div>

</div>

<script>

// ========================================
// CONFIGURACION
// ========================================

const URL_API = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

let mediaStream = null;
let workerOCR = null;
let workerOCRPromise = null;

let temporizadorOCR = null;
let leyendo = false;
let iniciandoCamara = false;

let ultimoNumero = "";
let lecturasIguales = 0;
let sesionCamara = 0;


// ========================================
// PREPARAR OCR ANTICIPADAMENTE
// ========================================

async function prepararOCR() {

    if (workerOCR) {
        return workerOCR;
    }

    // Evitar crear varios lectores simultáneamente

    if (!workerOCRPromise) {

        workerOCRPromise = (async () => {

            const worker = await Tesseract.createWorker("eng");

            await worker.setParameters({

                tessedit_char_whitelist: "0123456789",
                tessedit_pageseg_mode: "7"

            });

            workerOCR = worker;

            console.log("Lector OCR preparado.");

            return worker;

        })().catch(err => {

            workerOCRPromise = null;
            throw err;

        });

    }

    return workerOCRPromise;

}


// ========================================
// CARGAR CLIENTES Y PREPARAR LECTOR
// ========================================

window.addEventListener("load", function() {

    // Preparar OCR mientras el usuario utiliza la página

    prepararOCR().catch(err => {
        console.error("Error preparando OCR:", err);
    });

    // Cargar clientes

    fetch(URL_API + "?accion=obtenerClientes")

        .then(response => response.json())

        .then(data => {

            let select = document.getElementById("clienteSelect");

            if (data.clientes) {

                data.clientes.forEach(cliente => {

                    let opt = document.createElement("option");

                    opt.value = cliente;
                    opt.textContent = cliente;

                    select.appendChild(opt);

                });

            }

        })

        .catch(err => console.error("Error al cargar clientes:", err));

});


// ========================================
// INICIAR CAMARA
// ========================================

async function iniciarCamara() {

    if (mediaStream || iniciandoCamara) return;

    iniciandoCamara = true;

    let container = document.getElementById("scannerContainer");
    let video = document.getElementById("videoElement");
    let loading = document.getElementById("loadingScan");

    container.style.display = "block";

    loading.style.display = "block";
    loading.textContent = "Activando cámara y lector...";

    ultimoNumero = "";
    lecturasIguales = 0;

    const miSesion = ++sesionCamara;

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error("Cámara no disponible. Se necesita HTTPS.");

        }

        // Solicitar cámara y preparar OCR al mismo tiempo

        const promesaOCR = prepararOCR();

        const promesaCamara = navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30 }
            }

        });

        const stream = await promesaCamara;

        // Si el usuario canceló durante el inicio

        if (miSesion !== sesionCamara) {

            stream.getTracks().forEach(track => track.stop());
            return;

        }

        mediaStream = stream;

        video.srcObject = mediaStream;

        await video.play();

        // Esperar al lector si todavía está cargando

        await promesaOCR;

        if (miSesion !== sesionCamara) return;

        loading.textContent = "Enfocá el número dentro del recuadro...";

        // Primera lectura inmediata

        leerAutomaticamente();

    }

    catch (err) {

        console.error("Error al iniciar cámara:", err);

        if (miSesion === sesionCamara) {

            alert("No se pudo iniciar la cámara o el lector OCR.");

            cerrarCamara();

        }

    }

    finally {

        iniciandoCamara = false;

    }

}


// ========================================
// LECTURA AUTOMATICA
// ========================================

async function leerAutomaticamente() {

    if (leyendo || !mediaStream || !workerOCR) return;

    let video = document.getElementById("videoElement");

    if (!video.videoWidth || video.readyState < 2) {

        temporizadorOCR = setTimeout(leerAutomaticamente, 200);
        return;

    }

    leyendo = true;

    const miSesion = sesionCamara;

    try {

        let canvas = document.createElement("canvas");

        // Recortar la zona central donde está el número

        const x = Math.floor(video.videoWidth * 0.10);
        const y = Math.floor(video.videoHeight * 0.35);

        const ancho = Math.floor(video.videoWidth * 0.80);
        const alto = Math.floor(video.videoHeight * 0.30);

        // Limitar tamaño de imagen para acelerar OCR

        const escala = Math.min(1, 1000 / ancho);

        canvas.width = Math.floor(ancho * escala);
        canvas.height = Math.floor(alto * escala);

        let ctx = canvas.getContext("2d");

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        ctx.drawImage(

            video,

            x,
            y,
            ancho,
            alto,

            0,
            0,

            canvas.width,
            canvas.height

        );

        let resultado = await workerOCR.recognize(canvas);

        // Comprobar que la cámara sigue abierta

        if (miSesion !== sesionCamara || !mediaStream) return;

        let confianza = resultado.data.confidence;

        let numeros = resultado.data.text
            .replace(/[^0-9]/g, "")
            .trim();

        // Exigir una lectura con cierta confianza

        if (numeros.length >= 2 && confianza >= 60) {

            if (numeros === ultimoNumero) {

                lecturasIguales++;

            } else {

                ultimoNumero = numeros;
                lecturasIguales = 1;

            }

            console.log(
                "Número detectado:",
                numeros,
                "Confianza:",
                confianza,
                "Lecturas:",
                lecturasIguales
            );

            // DOS LECTURAS IGUALES = NUMERO CONFIRMADO

            if (lecturasIguales >= 2) {

                // Completar automáticamente el campo DPS

                document.getElementById("nroDpsInput").value = numeros;

                // Cerrar cámara y ocultar visor

                cerrarCamara();

                // Dejar el cursor en el campo

                document.getElementById("nroDpsInput").focus();

            }

        } else {

            ultimoNumero = "";
            lecturasIguales = 0;

        }

    }

    catch (err) {

        console.error("Error en lectura OCR:", err);

    }

    finally {

        leyendo = false;

        // Programar siguiente lectura sin acumular intervalos

        if (mediaStream && miSesion === sesionCamara) {

            temporizadorOCR = setTimeout(
                leerAutomaticamente,
                250
            );

        }

    }

}


// ========================================
// CERRAR CAMARA
// ========================================

function cerrarCamara() {

    // Invalidar cualquier lectura pendiente

    sesionCamara++;

    if (temporizadorOCR) {

        clearTimeout(temporizadorOCR);
        temporizadorOCR = null;

    }

    leyendo = false;

    ultimoNumero = "";
    lecturasIguales = 0;

    if (mediaStream) {

        mediaStream.getTracks().forEach(track => track.stop());

        mediaStream = null;

    }

    document.getElementById("videoElement").srcObject = null;

    // Desaparecer completamente el visor

    document.getElementById("scannerContainer").style.display = "none";

    document.getElementById("loadingScan").style.display = "none";

}


// ========================================
// BUSCAR EXTINTOR
// ========================================

function buscarExtintor() {

    let cliente = document.getElementById("clienteSelect").value.trim();

    let nroExtintor = document.getElementById("nroExtintorInput").value.trim();

    let nroDps = document.getElementById("nroDpsInput").value.trim();

    if (!cliente && !nroExtintor && !nroDps) {

        alert("Por favor, completá al menos un campo de búsqueda.");

        return;

    }

    let url = `${URL_API}?accion=buscarParaImpresion&cliente=${encodeURIComponent(cliente)}&extintor=${encodeURIComponent(nroExtintor)}&dps=${encodeURIComponent(nroDps)}`;

    fetch(url)

        .then(response => response.json())

        .then(data => {

            if (data.encontrado) {

                document.getElementById("lblCliente").textContent =
                    data.extintor.cliente || cliente || "N/D";

                document.getElementById("lblExtintor").textContent =
                    data.extintor.extintor;

                document.getElementById("lblTipoCap").textContent =
                    `${data.extintor.tipo} - ${data.extintor.capacidad}`;

                document.getElementById("lblMarca").textContent =
                    data.extintor.marca;

                document.getElementById("lblVencCarga").textContent =
                    data.extintor.vencCarga;

                document.getElementById("lblVencPH").textContent =
                    data.extintor.vencPH;

                document.getElementById("lblDps").textContent =
                    data.extintor.nroDps;

                document.getElementById("lblUbicacion").textContent =
                    `${data.extintor.puesto} (${data.extintor.ubicacion})`;

                document.getElementById("obleaPreview").style.display = "block";

            }

            else {

                alert("No se encontró ningún extintor con los datos indicados.");

                document.getElementById("obleaPreview").style.display = "none";

            }

        })

        .catch(err => {

            console.error("Error en la búsqueda:", err);

            alert("Error al comunicarse con la base de datos.");

        });

}

</script>

</body>
</html>
