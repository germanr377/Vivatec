<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión e Impresión de Obleas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 550px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        
        /* Tamaños personalizados adaptados a la cantidad de caracteres */
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:read-only { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; }
        
        .input-corto-4 { width: 90px; }   /* Para Mes y Año de Vencimiento (máx 4) */
        .input-mediano-6 { width: 120px; } /* Para Año Fab y Capacidad (máx 6) */
        .input-largo-10 { width: 180px; }  /* Para Nº de Extintor y Buscador (máx 10) */
        .input-estandar { width: 100%; max-width: 200px; } /* Para el resto */

        .btn { padding: 10px; font-size: 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn-buscar { background-color: #007bff; color: white; width: auto; padding: 8px 18px; margin-top: 0; }
        .btn-guardar { background-color: #28a745; color: white; max-width: 250px; }
        .btn-imprimir { background-color: #17a2b8; color: white; display: none; margin-top: 15px; max-width: 250px; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 4px; font-weight: bold; text-align: center; display: none; font-size: 14px; }
        .alert-info { background-color: #d1ecf1; color: #0c5460; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-danger { background-color: #f8d7da; color: #721c24; }
