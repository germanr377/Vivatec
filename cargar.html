<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Gestión y Carga de Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; transition: background 0.3s; }
        
        /* DISEÑO COMPACTO POR FILAS */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; } 
        
        .oblea-preview { margin-top: 20px; border: 2px dashed #27ae60; padding: 20px; border-radius: 6px; background: #f9fff9; transition: all 0.3s; }
        .oblea-header { font-size: 18px; font-weight: bold; text-align: center; color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 8px; margin-bottom: 15px; }

        /* Estilos dinámicos del contenedor */
        .modo-existente { border-color: #d35400 !important; background-color: #fdfefe !important; }
        .modo-existente .oblea-header { color: #d35400; border-bottom-color: #d35400; }

        /* MODO RECARGA (Fondo Amarillo) */
        .modo-recarga { border-color: #f1c40f !important; background-color: #fef9e7 !important; }
        .modo-recarga .oblea-header { color: #b7950b; border-bottom-color: #f1c40f; }

        /* Avisos flotantes */
        .aviso-nuevo { font-size: 11px; font-weight: bold; color: #e67e22; margin-top: 3px; display: none; }

        /* Botones de acción */
        .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
        .btn-base { flex: 1; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; min-width: 120px; text-align: center; }
        
        .btn-buscar { background: #2980b9; }
        .btn-buscar:hover { background: #1f618d; }

        /* Botón Recarga (Amarillo) */
        .btn-recarga { background: #f1c40f; color: #2c3e50; }
        .btn-recarga:hover { background: #d4ac0d; }

        .btn-save { background: #27ae60; }
        .btn-save:hover { background: #219653; }
        .btn-save.success { background: #2980b9 !important; }
        .btn-save.existente-btn { background: #d35400 !important; }

        .btn-delete { background: #c0392b; }
        .btn-delete:hover { background: #962d22; }

        .btn-clean { background: #7f8c8d; }
        .btn-clean:hover { background: #626567; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vivatec - Panel de Gestión de Extintores</h2>

    <div id="contenedorPrincipal" class="oblea-preview">
        <div id="tituloForm" class="oblea-header">PANEL DE CONTROL DE EQUIPOS</div>

        <!-- ID oculto para saber si estamos editando un registro existente -->
        <input type="hidden" id="registroId">

        <!-- FILA 1: Cliente, N° Extintor, DPS -->
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>Cliente:</label>
                <input type="text" id="nuevoCliente" list="listaClientes" placeholder="Escribí o seleccioná cliente..." oninput="verificarClienteNuevo()">
                <datalist id="listaClientes"></datalist>
                <div id="lblNuevoCliente" class="aviso-nuevo">✨ Nuevo Cliente</div>
            </div>
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>N° Extintor:</label>
                <input type="text" id="nuevoExtintor" placeholder="Ej: 6389130" oninput="verificarExtintorNuevo()" onblur="verificarDuplicado()">
                <div id="lblNuevoExtintor" class="aviso-nuevo">✨ Nuevo Extintor</div>
            </div>
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>N° DPS:</label>
                <input type="text" id="nuevoDps" placeholder="Ej: 5503020" oninput="verificarDpsNuevo()" onblur="verificarDuplicado()">
                <div id="lblNuevoDps" class="aviso-nuevo">✨ Nuevo DPS</div>
            </div>
        </div>

        <!-- FILA 2: Tipo de Oblea, Marca, Tipo, Agente Extintor, Capacidad -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>Tipo Oblea:</label>
                <select id="nuevoOblea">
                    <option value="Uso Gral" selected>Uso Gral</option>
                    <option value="Vehicular 1K">Vehicular 1K</option>
                    <option value="Vehicular">Vehicular</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Marca:</label>
                <input type="text" id="nuevoMarca" placeholder="Ej: Horizonte">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Tipo (A, ABC, BC, K):</label>
                <input type="text" id="nuevoTipo" placeholder="Ej: ABC" oninput="autocompletarAgente()" onblur="validarTipo(this)">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Agente Extintor:</label>
                <input type="text" id="nuevoAgente" placeholder="Ej: PQS">
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Capacidad:</label>
                <input type="text" id="nuevoCapacidad" placeholder="Ej: 10">
            </div>
        </div>

        <!-- FILA 3: Año Fab, Vencimientos y Ubicación -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Año Fab.:</label>
                <input type="number" id="nuevoAFabricacion" placeholder="2024">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. P.H. (MM/AAAA):</label>
                <input type="text" id="nuevoVencPH" placeholder="MM/AAAA" onblur="validarFormatoMesAnio(this)">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. Carga (MM/AAAA):</label>
                <input type="text" id="nuevoVencCarga" placeholder="MM/AAAA" onblur="validarFormatoMesAnio(this)">
            </div>
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Puesto:</label>
                <input type="number" id="nuevoPuesto" placeholder="Ej: 1">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Ubicación:</label>
                <input type="text" id="nuevoUbicacion" placeholder="Ej: Pasillo Principal">
            </div>
        </div>

        <!-- BOTONERA DE ACCIÓN UNIFICADA -->
        <div class="action-buttons">
            <button class="btn-base btn-buscar" onclick="buscarExtintor()">🔍 Buscar</button>
            <button class="btn-base btn-recarga" onclick="aplicarRecarga()">⚡ Recarga</button>
            <button id="btnGuardar" class="btn-base btn-save" onclick="guardarOActualizar()">💾 Guardar / Actualizar</button>
            <button class="btn-base btn-delete" onclick="eliminarExtintor()">🗑️ Eliminar</button>
            <button class="btn-base btn-clean" onclick="limpiarFormulario()">🧹 Limpiar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listaClientesExistentes = [];
    let listaExtintoresExistentes = [];
    let listaDpsExistentes = [];

    window.addEventListener("load", async function() {
        await cargarListasGlobales();
    });

    async function cargarListasGlobales() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente, extintor_numero, numero_dps');

        if (!error && data) {
            listaClientesExistentes = [...new Set(data.map(item => item.cliente?.trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
            listaExtintoresExistentes = data.map(item => String(item.extintor_numero).trim()).filter(Boolean);
            listaDpsExistentes = data.map(item => String(item.numero_dps).trim()).filter(Boolean);

            let datalist = document.getElementById("listaClientes");
            datalist.innerHTML = "";
            listaClientesExistentes.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                datalist.appendChild(opt);
            });
        }
    }

    // FUNCIÓN DEL BOTÓN RECARGA (Fondo Amarillo + Mes Actual / Próximo Año)
    function aplicarRecarga() {
        let ahora = new Date();
        let mesActual = String(ahora.getMonth() + 1).padStart(2, '0');
        let proximoAnio = ahora.getFullYear() + 1;

        // Setea el vencimiento de carga al mes actual y próximo año (MM/AAAA)
        document.getElementById("nuevoVencCarga").value = `${mesActual}/${proximoAnio}`;

        // Pone todo el contenedor con fondo amarillo
        let contenedor = document.getElementById("contenedorPrincipal");
        contenedor.classList.remove("modo-existente");
        contenedor.classList.add("modo-recarga");
        document.getElementById("tituloForm").textContent = "⚡ MODO RECARGA ACTIVADO";
    }

    function verificarClienteNuevo() {
        let val = document.getElementById("nuevoCliente").value.trim();
        let aviso = document.getElementById("lblNuevoCliente");
        
        if (!val) {
            aviso.style.display = "none";
            return;
        }

        let encontrado = listaClientesExistentes.some(c => c.toLowerCase() === val.toLowerCase());
        aviso.style.display = !encontrado ? "block" : "none";
    }

    function verificarExtintorNuevo() {
        let val = document.getElementById("nuevoExtintor").value.trim();
        let aviso = document.getElementById("lblNuevoExtintor");
        aviso.style.display = (val && !listaExtintoresExistentes.includes(val)) ? "block" : "none";
    }

    function verificarDpsNuevo() {
        let val = document.getElementById("nuevoDps").value.trim();
        let aviso = document.getElementById("lblNuevoDps");
        aviso.style.display = (val && !listaDpsExistentes.includes(val)) ? "block" : "none";
    }

    function validarTipo(input) {
        let valor = input.value.trim().toUpperCase();
        let permitidos = ["A", "ABC", "BC", "K"];
        if (valor && !permitidos.includes(valor)) {
            alert("⚠️ Tipo inválido. Los tipos permitidos son: A, ABC, BC o K.");
            input.value = "";
            document.getElementById("nuevoAgente").value = "";
            input.focus();
        }
    }

    function validarFormatoMesAnio(input) {
        let val = input.value.trim();
        if (!val) return;

        let regex = /^(0[1-9]|1[0-2])\/\d{4}$/;

        if (!regex.test(val)) {
            alert("⚠️ Formato incorrecto. Debe ingresar el mes y año en formato MM/AAAA (Ej: 08/2029).");
            input.value = "";
            input.focus();
        }
    }

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) return `${partes[1]}/${partes[0]}`;
        return fechaSQL;
    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length === 2) return `${partes[1]}-${partes[0].padStart(2, '0')}-01`;
        return null;
    }

    function autocompletarAgente() {
        let tipo = document.getElementById("nuevoTipo").value.trim().toUpperCase();
        let agenteInput = document.getElementById("nuevoAgente");
        if (tipo === "ABC") agenteInput.value = "PQS";
        else if (tipo === "BC") agenteInput.value = "CO2";
        else if (tipo === "A") agenteInput.value = "AFFF";
        else if (tipo === "K") agenteInput.value = "K";
    }

    async function buscarExtintor() {
        let extintorNum = document.getElementById("nuevoExtintor").value.trim();
        let dpsNum = document.getElementById("nuevoDps").value.trim();
        let clienteFiltro = document.getElementById("nuevoCliente").value.trim();

        if (!extintorNum && !dpsNum) {
            alert("Por favor, ingresá al menos un N° de Extintor o N° de DPS para buscar.");
            return;
        }

        try {
            let query = _supabase.from('extintores').select('*');
            if (extintorNum) query = query.eq('extintor_numero', extintorNum);
            if (dpsNum) query = query.eq('numero_dps', dpsNum);
            if (clienteFiltro) query = query.eq('cliente', clienteFiltro);

            const { data, error } = await query;
            if (error) throw error;

            if (!data || data.length === 0) {
                alert("No se encontró ningún equipo con los datos indicados.");
                return;
            }

            let registroACargar = data[0];

            if (data.length > 1 && !clienteFiltro) {
                let mensaje = "Se encontraron varios registros con ese número. Elegí el cliente:\n";
                data.forEach((item, index) => {
                    mensaje += `[${index + 1}] Cliente: ${item.cliente} (Extintor: ${item.extintor_numero}, DPS: ${item.numero_dps || '-'})\n`;
                });
                let seleccion = prompt(mensaje + "\nIngresá el número de opción:");
                let idx = parseInt(seleccion) - 1;
                if (isNaN(idx) || !data[idx]) {
                    alert("Selección inválida.");
                    return;
                }
                registroACargar = data[idx];
            }

            cargarDatosEnFormulario(registroACargar);

        } catch (err) {
            console.error("Error al buscar:", err);
            alert("Ocurrió un error al realizar la búsqueda.");
        }
    }

    function cargarDatosEnFormulario(ex) {
        document.getElementById("registroId").value = ex.id;
        document.getElementById("nuevoCliente").value = ex.cliente || "";
        document.getElementById("nuevoExtintor").value = ex.extintor_numero || "";
        document.getElementById("nuevoDps").value = ex.numero_dps || "";
        document.getElementById("nuevoOblea").value = ex.oblea || "Uso Gral";
        document.getElementById("nuevoMarca").value = ex.marca || "";
        document.getElementById("nuevoTipo").value = ex.tipo || "";
        document.getElementById("nuevoAgente").value = ex.agente_extintor || "";
        document.getElementById("nuevoCapacidad").value = ex.capacidad || "";
        document.getElementById("nuevoAFabricacion").value = ex.ano_fab || "";
        document.getElementById("nuevoVencPH").value = formatearFechaWeb(ex.vto_prueb_hidr);
        document.getElementById("nuevoVencCarga").value = formatearFechaWeb(ex.vto_carga);
        document.getElementById("nuevoPuesto").value = ex.identificacion_puesto || "";
        document.getElementById("nuevoUbicacion").value = ex.ubicacion || "";

        let contenedor = document.getElementById("contenedorPrincipal");
        contenedor.classList.remove("modo-recarga");
        contenedor.classList.add("modo-existente");
        document.getElementById("tituloForm").textContent = "⚠️ EDITANDO / ACTUALIZANDO EQUIPO EXISTENTE";
        
        let btn = document.getElementById("btnGuardar");
        btn.textContent = "🔄 Actualizar Extintor";
        btn.classList.add("existente-btn");

        verificarClienteNuevo();
        verificarExtintorNuevo();
        verificarDpsNuevo();
    }

    async function verificarDuplicado() {
        let clienteActual = document.getElementById("nuevoCliente").value.trim();
        let extintorNum = document.getElementById("nuevoExtintor").value.trim();
        let dpsNum = document.getElementById("nuevoDps").value.trim();

        if (!extintorNum && !dpsNum) return;

        try {
            let query = _supabase.from('extintores').select('*');
            if (extintorNum && dpsNum) query = query.or(`extintor_numero.eq.${extintorNum},numero_dps.eq.${dpsNum}`);
            else if (extintorNum) query = query.eq('extintor_numero', extintorNum);
            else query = query.eq('numero_dps', dpsNum);

            const { data, error } = await query;
            if (error) throw error;

            if (data && data.length > 0) {
                let matchMismoCliente = data.find(item => item.cliente && item.cliente.toLowerCase() === clienteActual.toLowerCase());

                if (matchMismoCliente) {
                    cargarDatosEnFormulario(matchMismoCliente);
                } else if (clienteActual) {
                    let otroCliente = data[0].cliente || "Otro cliente";
                    alert(`ℹ️ Aviso: Este número ya está registrado bajo el cliente "${otroCliente}". Podés guardarlo igual ya que es de otro cliente.`);
                    document.getElementById("registroId").value = "";
                }
            }
        } catch (err) {
            console.error("Error al verificar duplicado:", err);
        }
    }

    async function guardarOActualizar() {
        let cliente = document.getElementById("nuevoCliente").value.trim();
        let extintorNumero = document.getElementById("nuevoExtintor").value.trim();
        let idExistente = document.getElementById("registroId").value;

        if (!cliente || !extintorNumero) {
            alert("Por lo menos debés completar el Cliente y el N° de Extintor.");
            return;
        }

        let valAnoFab = document.getElementById("nuevoAFabricacion").value;
        let valPuesto = document.getElementById("nuevoPuesto").value;

        const datosRegistro = {
            cliente: cliente,
            oblea: document.getElementById("nuevoOblea").value,
            extintor_numero: extintorNumero,
            tipo: document.getElementById("nuevoTipo").value.trim().toUpperCase(),
            agente_extintor: document.getElementById("nuevoAgente").value.trim().toUpperCase(),
            capacidad: document.getElementById("nuevoCapacidad").value.trim(),
            ano_fab: valAnoFab ? parseInt(valAnoFab, 10) : null,
            marca: document.getElementById("nuevoMarca").value.trim().toUpperCase(),
            vto_prueb_hidr: formatearFechaSQL(document.getElementById("nuevoVencPH").value),
            vto_carga: formatearFechaSQL(document.getElementById("nuevoVencCarga").value),
            numero_dps: document.getElementById("nuevoDps").value.trim(),
            identificacion_puesto: valPuesto ? parseInt(valPuesto, 10) : null,
            ubicacion: document.getElementById("nuevoUbicacion").value.trim()
        };

        let resultado;
        if (idExistente) {
            resultado = await _supabase.from('extintores').update(datosRegistro).eq('id', idExistente);
        } else {
            resultado = await _supabase.from('extintores').insert([datosRegistro]);
        }

        if (resultado.error) {
            console.error("Error al guardar:", resultado.error);
            alert("Hubo un error al guardar el extintor en la base de datos.");
        } else {
            await cargarListasGlobales();

            const btn = document.getElementById("btnGuardar");
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "✅ ¡Operación Exitosa!";
            btn.classList.add("success");

            setTimeout(() => {
                btn.innerHTML = "💾 Guardar / Actualizar";
                btn.classList.remove("success", "existente-btn");
                limpiarFormulario();
            }, 2000);
        }
    }

    async function eliminarExtintor() {
        let idExistente = document.getElementById("registroId").value;
        let extintorNum = document.getElementById("nuevoExtintor").value.trim();
        let cliente = document.getElementById("nuevoCliente").value.trim();

        if (!idExistente) {
            alert("⚠️ Primero debés buscar y cargar un extintor en pantalla para poder eliminarlo.");
            return;
        }

        let confirmar = confirm(`¿Estás 100% seguro de que querés ELIMINAR el extintor N° ${extintorNum} del cliente "${cliente}" de la base de datos?\n\nEsta acción no se puede deshacer.`);
        
        if (!confirmar) return;

        try {
            const { error } = await _supabase
                .from('extintores')
                .delete()
                .eq('id', idExistente);

            if (error) throw error;

            await cargarListasGlobales();
            alert("🗑️ El extintor fue eliminado correctamente de la base de datos.");
            limpiarFormulario();

        } catch (err) {
            console.error("Error al eliminar:", err);
            alert("Ocurrió un error al intentar eliminar el registro.");
        }
    }

    function limpiarFormulario() {
        document.getElementById("registroId").value = "";
        document.getElementById("nuevoExtintor").value = "";
        document.getElementById("nuevoDps").value = "";
        document.getElementById("nuevoOblea").value = "Uso Gral";
        document.getElementById("nuevoMarca").value = "";
        document.getElementById("nuevoTipo").value = "";
        document.getElementById("nuevoAgente").value = "";
        document.getElementById("nuevoCapacidad").value = "";
        document.getElementById("nuevoAFabricacion").value = "";
        document.getElementById("nuevoVencPH").value = "";
        document.getElementById("nuevoVencCarga").value = "";
        document.getElementById("nuevoPuesto").value = "";
        document.getElementById("nuevoUbicacion").value = "";
        document.getElementById("lblNuevoCliente").style.display = "none";
        document.getElementById("lblNuevoExtintor").style.display = "none";
        document.getElementById("lblNuevoDps").style.display = "none";
        
        let contenedor = document.getElementById("contenedorPrincipal");
        contenedor.classList.remove("modo-existente");
        contenedor.classList.remove("modo-recarga");
        document.getElementById("tituloForm").textContent = "PANEL DE CONTROL DE EQUIPOS";
        
        let btn = document.getElementById("btnGuardar");
        btn.textContent = "💾 Guardar / Actualizar";
        btn.classList.remove("existente-btn");
        
        verificarClienteNuevo();
        verificarExtintorNuevo();
        verificarDpsNuevo();
    }
</script>

</body>
</html>
