<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Carga de Nuevos Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; transition: background 0.3s; }
        
        /* DISEÑO COMPACTO POR FILAS */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; } 
        
        .oblea-preview { margin-top: 20px; border: 2px dashed #27ae60; padding: 20px; border-radius: 6px; background: #f9fff9; transition: all 0.3s; }
        .oblea-header { font-size: 18px; font-weight: bold; text-align: center; color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 8px; margin-bottom: 15px; }

        /* Estilo cuando detecta que es del MISMO cliente (modo actualización) */
        .modo-existente { border-color: #d35400 !important; background-color: #fdfefe !important; }
        .modo-existente .oblea-header { color: #d35400; border-bottom-color: #d35400; }

        /* Botón de Guardar */
        .action-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .btn-save { background: #27ae60; flex: 1; padding: 14px; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .btn-save:hover { background: #219653; }
        .btn-save.success { background: #2980b9 !important; }
        .btn-save.existente-btn { background: #d35400 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vivatec - Registro y Actualización de Extintores</h2>

    <div id="contenedorPrincipal" class="oblea-preview">
        <div id="tituloForm" class="oblea-header">DATOS DEL NUEVO EQUIPO</div>

        <!-- Campo oculto para almacenar el ID si es actualización del mismo cliente -->
        <input type="hidden" id="registroId">

        <!-- FILA 1: Cliente, N° Extintor, DPS -->
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>Cliente:</label>
                <input type="text" id="nuevoCliente" placeholder="Ej: Aceros Borroni S.A.">
            </div>
            <div class="form-group" style="flex: none; width: 15ch;">
                <label>N° Extintor:</label>
                <input type="text" id="nuevoExtintor" placeholder="Ej: 6389130" onblur="verificarDuplicado()">
            </div>
            <div class="form-group" style="flex: none; width: 15ch;">
                <label>N° DPS:</label>
                <input type="text" id="nuevoDps" placeholder="Ej: 5503020" onblur="verificarDuplicado()">
            </div>
        </div>

        <!-- FILA 2: Tipo de Oblea, Marca, Tipo, Agente Extintor, Capacidad -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>Tipo Oblea:</label>
                <select id="nuevoOblea">
                    <option value="">(En blanco)</option>
                    <option value="Uso Gral">Uso Gral</option>
                    <option value="Vehicular 1K">Vehicular 1K</option>
                    <option value="Vehicular">Vehicular</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Marca:</label>
                <input type="text" id="nuevoMarca" placeholder="Ej: Horizonte">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Tipo:</label>
                <select id="nuevoTipo" onchange="autocompletarAgente()">
                    <option value="">-- Seleccionar --</option>
                    <option value="A">A</option>
                    <option value="ABC">ABC</option>
                    <option value="BC">BC</option>
                    <option value="K">K</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Agente Extintor:</label>
                <input type="text" id="nuevoAgente" placeholder="Se llena solo" readonly style="background-color: #f1f2f6;">
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Capacidad:</label>
                <input type="text" id="nuevoCapacidad" placeholder="Ej: 10">
            </div>
        </div>

        <!-- FILA 3: Año Fab, Vencimientos y Ubicación -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Año Fab.:</label>
                <input type="number" id="nuevoAFabricacion" placeholder="2024">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. P.H. (MM/AAAA):</label>
                <input type="text" id="nuevoVencPH" placeholder="MM/AAAA">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. Carga (MM/AAAA):</label>
                <input type="text" id="nuevoVencCarga" placeholder="MM/AAAA">
            </div>
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Puesto:</label>
                <input type="number" id="nuevoPuesto" placeholder="Ej: 1">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Ubicación:</label>
                <input type="text" id="nuevoUbicacion" placeholder="Ej: Pasillo Principal">
            </div>
        </div>

        <div class="action-buttons">
            <button id="btnGuardar" class="btn-save" onclick="guardarOActualizar()">💾 Guardar Nuevo Extintor</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) {
            return `${partes[1]}/${partes[0]}`;
        }
        return fechaSQL;
    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        let partes = fechaWeb.trim().split("/");
        if (partes.length === 2) {
            let mes = partes[0].padStart(2, '0');
            let anio = partes[1];
            return `${anio}-${mes}-01`;
        }
        return null;
    }

    // AUTOCOMPLETAR AGENTE EXTINTOR SEGÚN EL TIPO SELECCIONADO
    function autocompletarAgente() {
        let tipo = document.getElementById("nuevoTipo").value;
        let agenteInput = document.getElementById("nuevoAgente");

        if (tipo === "ABC") {
            agenteInput.value = "PQS";
        } else if (tipo === "BC") {
            agenteInput.value = "CO2";
        } else if (tipo === "A") {
            agenteInput.value = "AFFF";
        } else if (tipo === "K") {
            agenteInput.value = "K";
        } else {
            agenteInput.value = "";
        }
    }

    // VERIFICACIÓN INTELIGENTE POR CLIENTE
    async function verificarDuplicado() {
        let clienteActual = document.getElementById("nuevoCliente").value.trim();
        let extintorNum = document.getElementById("nuevoExtintor").value.trim();
        let dpsNum = document.getElementById("nuevoDps").value.trim();

        if (!extintorNum && !dpsNum) return;

        try {
            let query = _supabase.from('extintores').select('*');
            
            if (extintorNum && dpsNum) {
                query = query.or(`extintor_numero.eq.${extintorNum},numero_dps.eq.${dpsNum}`);
            } else if (extintorNum) {
                query = query.eq('extintor_numero', extintorNum);
            } else {
                query = query.eq('numero_dps', dpsNum);
            }

            const { data, error } = await query;
            if (error) throw error;

            if (data && data.length > 0) {
                let matchMismoCliente = data.find(item => item.cliente && item.cliente.toLowerCase() === clienteActual.toLowerCase());

                if (matchMismoCliente) {
                    let ex = matchMismoCliente;
                    document.getElementById("registroId").value = ex.id;
                    document.getElementById("nuevoExtintor").value = ex.extintor_numero || "";
                    document.getElementById("nuevoDps").value = ex.numero_dps || "";
                    document.getElementById("nuevoOblea").value = ex.oblea || "";
                    document.getElementById("nuevoMarca").value = ex.marca || "";
                    document.getElementById("nuevoTipo").value = ex.tipo || "";
                    autocompletarAgente(); // Actualiza el agente según el tipo cargado
                    document.getElementById("nuevoCapacidad").value = ex.capacidad || "";
                    document.getElementById("nuevoAFabricacion").value = ex.ano_fab || "";
                    document.getElementById("nuevoVencPH").value = formatearFechaWeb(ex.vto_prueb_hidr);
                    document.getElementById("nuevoVencCarga").value = formatearFechaWeb(ex.vto_carga);
                    document.getElementById("nuevoPuesto").value = ex.identificacion_puesto || "";
                    document.getElementById("nuevoUbicacion").value = ex.ubicacion || "";

                    document.getElementById("contenedorPrincipal").classList.add("modo-existente");
                    document.getElementById("tituloForm").textContent = "⚠️ EQUIPO EXISTENTE EN ESTE CLIENTE (Se actualizará)";
                    
                    let btn = document.getElementById("btnGuardar");
                    btn.textContent = "🔄 Actualizar Extintor del Cliente";
                    btn.classList.add("existente-btn");

                } else {
                    let otroCliente = data[0].cliente || "Otro cliente";
                    alert(`ℹ️ Aviso: Este número de extintor o DPS ya se encuentra registrado bajo el cliente "${otroCliente}".\n\nPodes continuar guardándolo sin problemas ya que pertenece a un cliente diferente.`);
                    document.getElementById("registroId").value = "";
                }
            }
        } catch (err) {
            console.error("Error al verificar duplicado:", err);
        }
    }

    // GUARDAR O ACTUALIZAR
    async function guardarOActualizar() {
        let cliente = document.getElementById("nuevoCliente").value.trim();
        let extintorNumero = document.getElementById("nuevoExtintor").value.trim();
        let idExistente = document.getElementById("registroId").value;

        if (!cliente || !extintorNumero) {
            alert("Por lo menos debés completar el Cliente y el N° de Extintor.");
            return;
        }

        let valAnoFab = document.getElementById("nuevoAFabricacion").value;
        let valPuesto = document.getElementById("nuevoPuesto").value;

        const datosRegistro = {
            cliente: cliente,
            oblea: document.getElementById("nuevoOblea").value,
            extintor_numero: extintorNumero,
            tipo: document.getElementById("nuevoTipo").value,
            agente_extintor: document.getElementById("nuevoAgente").value.trim().toUpperCase(),
            capacidad: document.getElementById("nuevoCapacidad").value.trim(),
            ano_fab: valAnoFab ? parseInt(valAnoFab, 10) : null,
            marca: document.getElementById("nuevoMarca").value.trim().toUpperCase(),
            
            vto_prueb_hidr: formatearFechaSQL(document.getElementById("nuevoVencPH").value),
            vto_carga: formatearFechaSQL(document.getElementById("nuevoVencCarga").value),
            
            numero_dps: document.getElementById("nuevoDps").value.trim(),
            identificacion_puesto: valPuesto ? parseInt(valPuesto, 10) : null,
            ubicacion: document.getElementById("nuevoUbicacion").value.trim()
        };

        let resultado;

        if (idExistente) {
            resultado = await _supabase
                .from('extintores')
                .update(datosRegistro)
                .eq('id', idExistente);
        } else {
            resultado = await _supabase
                .from('extintores')
                .insert([datosRegistro]);
        }

        if (resultado.error) {
            console.error("Error al guardar:", resultado.error);
            alert("Hubo un error al guardar el extintor en la base de datos.");
        } else {
            const btn = document.getElementById("btnGuardar");
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "✅ ¡Operación Exitosa!";
            btn.classList.add("success");

            setTimeout(() => {
                btn.innerHTML = "💾 Guardar Nuevo Extintor";
                btn.classList.remove("success", "existente-btn");
                document.getElementById("contenedorPrincipal").classList.remove("modo-existente");
                document.getElementById("tituloForm").textContent = "DATOS DEL NUEVO EQUIPO";
                limpiarFormulario();
            }, 2000);
        }
    }

    function limpiarFormulario() {
        document.getElementById("registroId").value = "";
        document.getElementById("nuevoExtintor").value = "";
        document.getElementById("nuevoDps").value = "";
        document.getElementById("nuevoMarca").value = "";
        document.getElementById("nuevoTipo").value = "";
        document.getElementById("nuevoAgente").value = "";
        document.getElementById("nuevoCapacidad").value = "";
        document.getElementById("nuevoAFabricacion").value = "";
        document.getElementById("nuevoVencPH").value = "";
        document.getElementById("nuevoVencCarga").value = "";
        document.getElementById("nuevoPuesto").value = "";
        document.getElementById("nuevoUbicacion").value = "";
    }
</script>

</body>
</html>
