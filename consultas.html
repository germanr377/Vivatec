<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Consultas</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Menú y Configuración Compartida -->
    <script src="menu.js"></script>
    <script src="configuracion.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }

        .modo-consulta-bar {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #eef3f8;
            border: 1px solid #d5e0eb;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .modo-titulo { font-weight: bold; font-size: 13px; color: #2c3e50; }
        .modo-opcion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #34495e;
        }
        .modo-opcion input[type="radio"] {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
        }

        .filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; position: relative; }
        label { font-weight: bold; margin-bottom: 4px; color: #555; font-size: 12px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; transition: background 0.3s, border-color 0.3s; background: #fff; height: 38px; }

        .botones-grid { display: flex; gap: 8px; grid-column: span 2; }
        .btn-consultar { background: #2980b9; color: white; border: none; padding: 9px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 38px; flex: 1; }
        .btn-consultar:hover { background: #1f618d; }

        .btn-limpiar { background: #7f8c8d; color: white; border: none; padding: 9px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 38px; flex: 1; }
        .btn-limpiar:hover { background: #626567; }

        .acciones-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .badge-total { background: #2980b9; color: white; padding: 5px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }

        .btn-eliminar { background: #c0392b; color: white; border: none; padding: 9px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; display: none; }
        .btn-eliminar:hover { background: #962d22; }

        .table-container { max-height: 500px; overflow-y: auto; overflow-x: auto; border: 1px solid #ddd; border-radius: 4px; }
        table { width: auto; min-width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #cfd8dc; padding: 4px 6px; text-align: center; font-size: 12px; }
        th { background-color: #2c3e50; color: white; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
        thead tr:nth-child(2) th { top: 25px; z-index: 2; }
        th:hover { background-color: #34495e; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .sin-resultados { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }

        /* Rectángulos superiores para agrupar Agente Extintor y Capacidad */
        .th-grupo-agente {
            background-color: #1f3a52 !important;
            border: 2px solid #90caf9 !important;
            cursor: default !important;
            padding: 3px 6px;
            letter-spacing: 0.4px;
        }
        .th-grupo-agente:hover { background-color: #1f3a52 !important; }

        .th-grupo-cap {
            background-color: #24473b !important;
            border: 2px solid #80cbc4 !important;
            cursor: default !important;
            padding: 3px 6px;
            letter-spacing: 0.4px;
        }
        .th-grupo-cap:hover { background-color: #24473b !important; }

        /* Columnas bien compactas */
        .col-mini { width: 1%; white-space: nowrap; padding-left: 5px; padding-right: 5px; }
        .col-fecha { width: 1%; white-space: nowrap; padding-left: 5px; padding-right: 5px; }
        .col-texto { text-align: left; max-width: 210px; white-space: normal; word-break: break-word; }
        .col-texto-corto { white-space: nowrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Consultas</h2>

    <!-- SELECTOR DE MODO DE INFORME / CONSULTA -->
    <div class="modo-consulta-bar">
        <span class="modo-titulo">Ver informe por:</span>
        <label class="modo-opcion">
            <input type="radio" name="modoConsulta" id="modoExtintor" value="extintor" checked onchange="cambiarModoConsulta()">
            <span>Extintor</span>
        </label>
        <label class="modo-opcion">
            <input type="radio" name="modoConsulta" id="modoCliente" value="cliente" onchange="cambiarModoConsulta()">
            <span>Cliente</span>
        </label>
    </div>

    <!-- FILTROS DE BÚSQUEDA -->
    <div class="filtros-grid">
        <div class="form-group">
            <label>Cliente:</label>
            <input type="text" id="filtroCliente" autocomplete="off">
        </div>
        <div class="form-group">
            <label>N° Extintor:</label>
            <input type="text" id="filtroExtintor">
        </div>
        <div class="form-group">
            <label>N° DPS:</label>
            <input type="text" id="filtroDps">
        </div>
        <div class="form-group">
            <label>Tipo:</label>
            <input type="text" id="filtroTipo">
        </div>
        <div class="form-group">
            <label>Ag. Extin.:</label>
            <input type="text" id="filtroAgente">
        </div>
        <div class="form-group">
            <label>Capacidad:</label>
            <input type="text" id="filtroCapacidad">
        </div>
        <div class="form-group">
            <label>Marca:</label>
            <input type="text" id="filtroMarca">
        </div>
        <div class="form-group">
            <label>Año Fab.:</label>
            <input type="text" id="filtroAnioFab">
        </div>
        <div class="form-group">
            <label>Puesto:</label>
            <input type="text" id="filtroPuesto">
        </div>
        <div class="form-group">
            <label>Ubicación:</label>
            <input type="text" id="filtroUbicacion">
        </div>
        <div class="form-group">
            <label>Vto. P.H. Desde:</label>
            <input type="text" id="ph-desde">
        </div>
        <div class="form-group">
            <label>Vto. P.H. Hasta:</label>
            <input type="text" id="ph-hasta">
        </div>
        <div class="form-group">
            <label>Vto. Carga Desde:</label>
            <input type="text" id="carga-desde">
        </div>
        <div class="form-group">
            <label>Vto. Carga Hasta:</label>
            <input type="text" id="carga-hasta">
        </div>

        <!-- BOTONES DE ACCIÓN DE FILTRO -->
        <div class="botones-grid">
            <button class="btn-consultar" onclick="realizarConsulta()">🔍 Buscar</button>
            <button class="btn-limpiar" onclick="limpiarFiltros()">🧹 Limpiar</button>
        </div>
    </div>

    <!-- BARRA DE ACCIONES (Contador de registros y Borrado masivo) -->
    <div class="acciones-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="badgeTotal" class="badge-total">0 registros encontrados</span>
            <span id="contadorSeleccionados" style="font-weight: bold; color: #555; font-size: 13px;"></span>
        </div>
        <button id="btnEliminarSeleccionados" class="btn-eliminar" onclick="eliminarSeleccionados()">🗑️ Eliminar Registros Tildados</button>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <div class="table-container">
        <table id="tabla-resultados">
            <thead>
                <tr>
                    <th class="col-mini"><input type="checkbox" id="checkTodos" onclick="toggleSeleccionarTodos(this)"></th>
                    <th onclick="ordenarTabla('cliente')">Cliente ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('oblea')">Oblea ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('extintor_numero')">Ext. N° ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('tipo')">Tipo ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('agente_extintor')">Ag. Extin. ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('capacidad')">Cap. ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('ano_fab')">A. Fab ↕</th>
                    <th onclick="ordenarTabla('marca')">Marca ↕</th>
                    <th class="col-fecha" onclick="ordenarTabla('vto_prueb_hidr')">Vto. PH ↕</th>
                    <th class="col-fecha" onclick="ordenarTabla('vto_carga')">Vto. Carga ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('numero_dps')">DPS ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('identificacion_puesto')">Puesto ↕</th>
                    <th onclick="ordenarTabla('ubicacion')">Ubicación ↕</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="14" class="sin-resultados">Seleccioná los filtros y hacé clic en Buscar.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CAMPOS_HISTORIAL = [
        "cliente",
        "extintor_numero",
        "numero_dps",
        "oblea",
        "marca",
        "tipo",
        "agente_extintor",
        "capacidad",
        "ano_fab",
        "vto_prueb_hidr",
        "vto_carga",
        "identificacion_puesto",
        "ubicacion"
    ];

    const SELECTOR_FILTROS = ".filtros-grid input, .filtros-grid select";

    let resultadosGlobales = [];
    let clientesInfoPorNombre = {};
    let resumenClientesGlobal = [];
    let agentesDetectadosGlobal = [];
    let capacidadesDetectadasGlobal = [];
    let ordenActual = { columna: 'vto_carga', ascendente: true };
    let ordenClienteActual = { columna: 'cliente', ascendente: true };
    let consultaEjecutada = false;
    let controladorCliente = null;

    function obtenerModoActual() {
        const marcado = document.querySelector('input[name="modoConsulta"]:checked');
        return marcado ? marcado.value : 'extintor';
    }

    function escaparTexto(valor) {
        return String(valor ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function sincronizarEstilosFiltros() {
        document.querySelectorAll(SELECTOR_FILTROS).forEach(el => {
            Configuracion.aplicarEstiloFiltro(el);
        });
    }

    // TRADUCTOR DE FECHAS: Supabase (AAAA-MM-DD) -> Pantalla (DD/MM/AAAA)
    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        const partes = String(fechaSQL).split("T")[0].split("-");
        return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaSQL;
    }

    // CONVERTIR DD/MM/AA o DD/MM/AAAA A AAAA-MM-DD PARA CONSULTAR EN SUPABASE
    function convertirFechaParaSQL(fechaWeb) {
        if (!fechaWeb || fechaWeb.trim() === "") return null;
        const partes = fechaWeb.trim().split("/");
        if (partes.length === 3) {
            const dia = partes[0].padStart(2, '0');
            const mes = partes[1].padStart(2, '0');
            const anioRaw = partes[2].trim();
            if (anioRaw.length === 2 && !isNaN(anioRaw)) {
                return `20${anioRaw}-${mes}-${dia}`;
            }
            if (anioRaw.length === 4 && !isNaN(anioRaw)) {
                return `${anioRaw}-${mes}-${dia}`;
            }
        }
        return null;
    }

    function normalizarFechaSQL(valor) {
        if (!valor) return null;
        return String(valor).split("T")[0];
    }

    function estaEnRango(fechaSQL, desdeSQL, hastaSQL) {
        const f = normalizarFechaSQL(fechaSQL);
        if (desdeSQL && hastaSQL) return Boolean(f && f >= desdeSQL && f <= hastaSQL);
        if (desdeSQL) return Boolean(f && f >= desdeSQL);
        if (hastaSQL) return Boolean(f && f <= hastaSQL);
        return Boolean(f);
    }

    async function registrarEliminacionEnHistorial(registroExtintor) {
        const payloadHistorial = {
            extintor_id: registroExtintor.id,
            fecha_revision: new Date().toISOString(),
            accion: "ELIMINADO"
        };

        CAMPOS_HISTORIAL.forEach(campo => {
            payloadHistorial[campo] = registroExtintor[campo] ?? null;
        });

        let { error } = await _supabase
            .from('historial_revisiones')
            .insert([payloadHistorial]);

        if (error && /accion/i.test(error.message || "")) {
            delete payloadHistorial.accion;
            const retry = await _supabase
                .from('historial_revisiones')
                .insert([payloadHistorial]);
            error = retry.error;
        }

        return { error };
    }

    window.addEventListener("load", async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }

        Configuracion.activarFechas("#ph-desde, #ph-hasta, #carga-desde, #carga-hasta");
        Configuracion.activarFiltros(SELECTOR_FILTROS);

        const inputCliente = document.getElementById("filtroCliente");
        controladorCliente = Configuracion.configurarBuscadorCliente({
            input: inputCliente,
            clientes: [],
            onSeleccionar: (c) => {
                inputCliente.value = c.nombre;
                sincronizarEstilosFiltros();
            },
            onRechazarNoRegistrado: () => {
                // En consultas se permite búsqueda parcial sin borrar el texto
            }
        });

        // Permitir disparar búsqueda con Enter en los filtros
        document.querySelectorAll(".filtros-grid input").forEach(input => {
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.defaultPrevented) {
                    e.preventDefault();
                    realizarConsulta();
                }
            });
        });

        // Cargar clientes desde la tabla maestra para el predictivo y dirección
        const { data, error } = await _supabase
            .from('clientes')
            .select('*')
            .order('nombre_cliente', { ascending: true });

        if (!error && data) {
            clientesInfoPorNombre = {};
            const listaClientes = [];

            data.forEach(c => {
                if (!c.nombre_cliente) return;
                const nombre = c.nombre_cliente.trim();
                const razon = c.razon_social ? c.razon_social.trim() : "";
                const clave = Configuracion.normalizar(nombre);
                const direccion = c.direccion || c.domicilio || "-";

                clientesInfoPorNombre[clave] = {
                    nombre_cliente: nombre,
                    razon_social: razon,
                    direccion
                };

                listaClientes.push({ nombre, razon });
            });

            controladorCliente.actualizarClientes(listaClientes);
        }
    });

    function cambiarModoConsulta() {
        if (!consultaEjecutada) {
            renderizarEncabezadoInicial();
            return;
        }
        renderizarSegunModo();
    }

    function renderizarEncabezadoInicial() {
        const modo = obtenerModoActual();
        const thead = document.querySelector('#tabla-resultados thead');
        const tbody = document.querySelector('#tabla-resultados tbody');

        if (modo === 'cliente') {
            thead.innerHTML = `
                <tr>
                    <th rowspan="2" onclick="ordenarClientes('cliente')">Cliente ↕</th>
                    <th rowspan="2" onclick="ordenarClientes('direccion')">Dirección ↕</th>
                    <th rowspan="2" class="col-mini" onclick="ordenarClientes('recargas')">Recarga ↕</th>
                    <th rowspan="2" class="col-mini" onclick="ordenarClientes('pruebas_hidraulicas')">PH ↕</th>
                    <th colspan="1" class="th-grupo-agente">Ag. Ext</th>
                    <th colspan="1" class="th-grupo-cap">Cap.</th>
                </tr>
                <tr>
                    <th class="col-mini">-</th>
                    <th class="col-mini">-</th>
                </tr>
            `;
            tbody.innerHTML = `<tr><td colspan="6" class="sin-resultados">Seleccioná los filtros y hacé clic en Buscar.</td></tr>`;
            document.getElementById('btnEliminarSeleccionados').style.display = 'none';
            document.getElementById('contadorSeleccionados').textContent = '';
        } else {
            thead.innerHTML = `
                <tr>
                    <th class="col-mini"><input type="checkbox" id="checkTodos" onclick="toggleSeleccionarTodos(this)"></th>
                    <th onclick="ordenarTabla('cliente')">Cliente ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('oblea')">Oblea ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('extintor_numero')">Ext. N° ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('tipo')">Tipo ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('agente_extintor')">Ag. Extin. ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('capacidad')">Cap. ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('ano_fab')">A. Fab ↕</th>
                    <th onclick="ordenarTabla('marca')">Marca ↕</th>
                    <th class="col-fecha" onclick="ordenarTabla('vto_prueb_hidr')">Vto. PH ↕</th>
                    <th class="col-fecha" onclick="ordenarTabla('vto_carga')">Vto. Carga ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('numero_dps')">DPS ↕</th>
                    <th class="col-mini" onclick="ordenarTabla('identificacion_puesto')">Puesto ↕</th>
                    <th onclick="ordenarTabla('ubicacion')">Ubicación ↕</th>
                </tr>
            `;
            tbody.innerHTML = `<tr><td colspan="14" class="sin-resultados">Seleccioná los filtros y hacé clic en Buscar.</td></tr>`;
        }
    }

    function limpiarFiltros() {
        document.querySelectorAll(SELECTOR_FILTROS).forEach(el => {
            el.value = "";
        });
        sincronizarEstilosFiltros();
        controladorCliente?.cerrar();

        resultadosGlobales = [];
        resumenClientesGlobal = [];
        agentesDetectadosGlobal = [];
        capacidadesDetectadasGlobal = [];
        consultaEjecutada = false;

        document.getElementById('badgeTotal').textContent = "0 registros encontrados";
        const checkTodos = document.getElementById('checkTodos');
        if (checkTodos) checkTodos.checked = false;
        actualizarContadorSeleccionados();
        renderizarEncabezadoInicial();
    }

    async function realizarConsulta() {
        controladorCliente?.cerrar();

        const cliente = document.getElementById('filtroCliente').value.trim();
        const extintor = document.getElementById('filtroExtintor').value.trim();
        const dps = document.getElementById('filtroDps').value.trim();
        const tipo = document.getElementById('filtroTipo').value.trim();
        const agente = document.getElementById('filtroAgente').value.trim();
        const capacidad = document.getElementById('filtroCapacidad').value.trim();
        const marca = document.getElementById('filtroMarca').value.trim();
        const anioFab = document.getElementById('filtroAnioFab').value.trim();
        const puesto = document.getElementById('filtroPuesto').value.trim();
        const ubicacion = document.getElementById('filtroUbicacion').value.trim();

        const phDesde = convertirFechaParaSQL(document.getElementById('ph-desde').value);
        const phHasta = convertirFechaParaSQL(document.getElementById('ph-hasta').value);
        const cargaDesde = convertirFechaParaSQL(document.getElementById('carga-desde').value);
        const cargaHasta = convertirFechaParaSQL(document.getElementById('carga-hasta').value);

        const modo = obtenerModoActual();
        const colspanActual = modo === 'cliente' ? 6 : 14;
        const tbody = document.querySelector('#tabla-resultados tbody');
        tbody.innerHTML = `<tr><td colspan="${colspanActual}" class="sin-resultados">Buscando datos en Supabase...</td></tr>`;

        try {
            let query = _supabase.from('extintores').select('*');

            if (cliente) query = query.ilike('cliente', `%${cliente}%`);
            if (extintor) query = query.eq('extintor_numero', extintor);
            if (dps) query = query.eq('numero_dps', dps);
            if (tipo) query = query.ilike('tipo', `%${tipo}%`);
            if (agente) query = query.ilike('agente_extintor', `%${agente}%`);
            if (capacidad) query = query.eq('capacidad', capacidad);
            if (marca) query = query.ilike('marca', `%${marca}%`);
            if (anioFab) query = query.eq('ano_fab', parseInt(anioFab, 10));
            if (puesto) query = query.eq('identificacion_puesto', puesto);
            if (ubicacion) query = query.ilike('ubicacion', `%${ubicacion}%`);

            if (phDesde) query = query.gte('vto_prueb_hidr', phDesde);
            if (phHasta) query = query.lte('vto_prueb_hidr', phHasta);
            if (cargaDesde) query = query.gte('vto_carga', cargaDesde);
            if (cargaHasta) query = query.lte('vto_carga', cargaHasta);

            const { data, error } = await query.order('vto_carga', { ascending: true });

            if (error) throw error;

            resultadosGlobales = data || [];
            consultaEjecutada = true;
            construirResumenClientes(resultadosGlobales, { phDesde, phHasta, cargaDesde, cargaHasta });
            renderizarSegunModo();

        } catch (error) {
            console.error("Error al consultar Supabase:", error);
            tbody.innerHTML = `<tr><td colspan="${colspanActual}" class="sin-resultados">Error al conectar con la base de datos.</td></tr>`;
            document.getElementById('badgeTotal').textContent = "0 registros encontrados";
        }
    }

    function ordenarCapacidades(a, b) {
        const numA = parseFloat(String(a).replace(',', '.'));
        const numB = parseFloat(String(b).replace(',', '.'));
        if (!isNaN(numA) && !isNaN(numB) && numA !== numB) {
            return numA - numB;
        }
        return String(a).localeCompare(String(b), 'es');
    }

    function construirResumenClientes(datos, rangos) {
        const mapaClientes = new Map();
        const setAgentes = new Set();
        const setCapacidades = new Set();

        datos.forEach(fila => {
            const nombreCliente = (fila.cliente || "Sin cliente").trim();
            const claveCliente = Configuracion.normalizar(nombreCliente);
            const agenteRaw = fila.agente_extintor !== null && fila.agente_extintor !== undefined
                ? String(fila.agente_extintor).trim()
                : "";
            const capRaw = fila.capacidad !== null && fila.capacidad !== undefined
                ? String(fila.capacidad).trim()
                : "";

            if (!mapaClientes.has(claveCliente)) {
                const infoMaestro = clientesInfoPorNombre[claveCliente];
                mapaClientes.set(claveCliente, {
                    cliente: nombreCliente,
                    direccion: infoMaestro ? infoMaestro.direccion : "-",
                    recargas: 0,
                    pruebas_hidraulicas: 0,
                    porAgente: {},
                    porCapacidad: {}
                });
            }

            const item = mapaClientes.get(claveCliente);
            const necesitaRecarga = estaEnRango(fila.vto_carga, rangos.cargaDesde, rangos.cargaHasta);
            const necesitaPH = estaEnRango(fila.vto_prueb_hidr, rangos.phDesde, rangos.phHasta);

            if (capRaw) {
                setCapacidades.add(capRaw);
                item.porCapacidad[capRaw] = (item.porCapacidad[capRaw] || 0) + 1;
            }

            if (necesitaRecarga) {
                item.recargas += 1;
                if (agenteRaw) {
                    setAgentes.add(agenteRaw);
                    item.porAgente[agenteRaw] = (item.porAgente[agenteRaw] || 0) + 1;
                }
            }

            if (necesitaPH) {
                item.pruebas_hidraulicas += 1;
            }
        });

        agentesDetectadosGlobal = Array.from(setAgentes).sort((a, b) => a.localeCompare(b, 'es'));
        capacidadesDetectadasGlobal = Array.from(setCapacidades).sort(ordenarCapacidades);
        resumenClientesGlobal = Array.from(mapaClientes.values());

        resumenClientesGlobal.forEach(item => {
            agentesDetectadosGlobal.forEach(ag => {
                if (typeof item.porAgente[ag] !== "number") item.porAgente[ag] = 0;
            });
            capacidadesDetectadasGlobal.forEach(cap => {
                if (typeof item.porCapacidad[cap] !== "number") item.porCapacidad[cap] = 0;
            });
        });

        ordenarArrayClientes(resumenClientesGlobal, ordenClienteActual.columna, ordenClienteActual.ascendente);
    }

    function renderizarSegunModo() {
        const modo = obtenerModoActual();
        if (modo === 'cliente') {
            mostrarResultadosPorCliente(resumenClientesGlobal, agentesDetectadosGlobal, capacidadesDetectadasGlobal);
        } else {
            mostrarResultados(resultadosGlobales);
        }
    }

    function mostrarResultadosPorCliente(filasCliente, agentes, capacidades) {
        const thead = document.querySelector('#tabla-resultados thead');
        const tbody = document.querySelector('#tabla-resultados tbody');

        document.getElementById('btnEliminarSeleccionados').style.display = 'none';
        document.getElementById('contadorSeleccionados').textContent = '';
        document.getElementById('badgeTotal').textContent = `${filasCliente.length} cliente(s) encontrado(s)`;

        const colspanAgentes = agentes.length > 0 ? agentes.length : 1;
        const colspanCaps = capacidades.length > 0 ? capacidades.length : 1;

        const thSubAgentes = agentes.length > 0
            ? agentes.map(ag =>
                `<th class="col-mini" onclick="ordenarClientes('agente:${escaparTexto(ag)}')">${escaparTexto(ag)} ↕</th>`
              ).join("")
            : `<th class="col-mini">-</th>`;

        const thSubCaps = capacidades.length > 0
            ? capacidades.map(cap =>
                `<th class="col-mini" onclick="ordenarClientes('cap:${escaparTexto(cap)}')">${escaparTexto(cap)} ↕</th>`
              ).join("")
            : `<th class="col-mini">-</th>`;

        thead.innerHTML = `
            <tr>
                <th rowspan="2" onclick="ordenarClientes('cliente')">Cliente ↕</th>
                <th rowspan="2" onclick="ordenarClientes('direccion')">Dirección ↕</th>
                <th rowspan="2" class="col-mini" onclick="ordenarClientes('recargas')">Recarga ↕</th>
                <th rowspan="2" class="col-mini" onclick="ordenarClientes('pruebas_hidraulicas')">PH ↕</th>
                <th colspan="${colspanAgentes}" class="th-grupo-agente">Ag. Ext</th>
                <th colspan="${colspanCaps}" class="th-grupo-cap">Cap.</th>
            </tr>
            <tr>
                ${thSubAgentes}
                ${thSubCaps}
            </tr>
        `;

        const totalColumnas = 4 + colspanAgentes + colspanCaps;
        tbody.innerHTML = "";

        if (!filasCliente || filasCliente.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${totalColumnas}" class="sin-resultados">No se encontraron registros con los filtros seleccionados.</td></tr>`;
            return;
        }

        filasCliente.forEach(fila => {
            const celdasAgentes = agentes.length > 0
                ? agentes.map(ag => `<td class="col-mini">${fila.porAgente[ag] || 0}</td>`).join("")
                : `<td class="col-mini">0</td>`;

            const celdasCaps = capacidades.length > 0
                ? capacidades.map(cap => `<td class="col-mini">${fila.porCapacidad[cap] || 0}</td>`).join("")
                : `<td class="col-mini">0</td>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-texto">${escaparTexto(fila.cliente)}</td>
                <td class="col-texto">${escaparTexto(fila.direccion)}</td>
                <td class="col-mini"><strong>${fila.recargas}</strong></td>
                <td class="col-mini"><strong>${fila.pruebas_hidraulicas}</strong></td>
                ${celdasAgentes}
                ${celdasCaps}
            `;
            tbody.appendChild(tr);
        });
    }

    function ordenarArrayClientes(lista, columna, ascendente) {
        lista.sort((a, b) => {
            let valA, valB;

            if (columna.startsWith("agente:")) {
                const ag = columna.replace("agente:", "");
                valA = a.porAgente[ag] || 0;
                valB = b.porAgente[ag] || 0;
                return ascendente ? valA - valB : valB - valA;
            }

            if (columna.startsWith("cap:")) {
                const cap = columna.replace("cap:", "");
                valA = a.porCapacidad[cap] || 0;
                valB = b.porCapacidad[cap] || 0;
                return ascendente ? valA - valB : valB - valA;
            }

            if (columna === "recargas" || columna === "pruebas_hidraulicas") {
                valA = Number(a[columna] || 0);
                valB = Number(b[columna] || 0);
                return ascendente ? valA - valB : valB - valA;
            }

            valA = String(a[columna] ?? "").toLowerCase();
            valB = String(b[columna] ?? "").toLowerCase();
            if (valA < valB) return ascendente ? -1 : 1;
            if (valA > valB) return ascendente ? 1 : -1;
            return 0;
        });
    }

    function ordenarClientes(columna) {
        if (ordenClienteActual.columna === columna) {
            ordenClienteActual.ascendente = !ordenClienteActual.ascendente;
        } else {
            ordenClienteActual.columna = columna;
            ordenClienteActual.ascendente = true;
        }
        ordenarArrayClientes(resumenClientesGlobal, ordenClienteActual.columna, ordenClienteActual.ascendente);
        mostrarResultadosPorCliente(resumenClientesGlobal, agentesDetectadosGlobal, capacidadesDetectadasGlobal);
    }

    function mostrarResultados(datos) {
        const thead = document.querySelector('#tabla-resultados thead');
        thead.innerHTML = `
            <tr>
                <th class="col-mini"><input type="checkbox" id="checkTodos" onclick="toggleSeleccionarTodos(this)"></th>
                <th onclick="ordenarTabla('cliente')">Cliente ↕</th>
                <th class="col-mini" onclick="ordenarTabla('oblea')">Oblea ↕</th>
                <th class="col-mini" onclick="ordenarTabla('extintor_numero')">Ext. N° ↕</th>
                <th class="col-mini" onclick="ordenarTabla('tipo')">Tipo ↕</th>
                <th class="col-mini" onclick="ordenarTabla('agente_extintor')">Ag. Extin. ↕</th>
                <th class="col-mini" onclick="ordenarTabla('capacidad')">Cap. ↕</th>
                <th class="col-mini" onclick="ordenarTabla('ano_fab')">A. Fab ↕</th>
                <th onclick="ordenarTabla('marca')">Marca ↕</th>
                <th class="col-fecha" onclick="ordenarTabla('vto_prueb_hidr')">Vto. PH ↕</th>
                <th class="col-fecha" onclick="ordenarTabla('vto_carga')">Vto. Carga ↕</th>
                <th class="col-mini" onclick="ordenarTabla('numero_dps')">DPS ↕</th>
                <th class="col-mini" onclick="ordenarTabla('identificacion_puesto')">Puesto ↕</th>
                <th onclick="ordenarTabla('ubicacion')">Ubicación ↕</th>
            </tr>
        `;

        const tbody = document.querySelector('#tabla-resultados tbody');
        tbody.innerHTML = "";
        document.getElementById('checkTodos').checked = false;
        actualizarContadorSeleccionados();

        document.getElementById('badgeTotal').textContent = `${datos.length} registro(s) encontrado(s)`;

        if (datos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="14" class="sin-resultados">No se encontraron registros con los filtros seleccionados.</td></tr>`;
            return;
        }

        datos.forEach(fila => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-mini"><input type="checkbox" class="check-registro" value="${escaparTexto(fila.id)}" onclick="actualizarContadorSeleccionados()"></td>
                <td class="col-texto">${escaparTexto(fila.cliente || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.oblea || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.extintor_numero || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.tipo || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.agente_extintor || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.capacidad || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.ano_fab || "-")}</td>
                <td class="col-texto-corto">${escaparTexto(fila.marca || "-")}</td>
                <td class="col-fecha">${escaparTexto(formatearFechaWeb(fila.vto_prueb_hidr))}</td>
                <td class="col-fecha">${escaparTexto(formatearFechaWeb(fila.vto_carga))}</td>
                <td class="col-mini">${escaparTexto(fila.numero_dps || "-")}</td>
                <td class="col-mini">${escaparTexto(fila.identificacion_puesto !== null && fila.identificacion_puesto !== undefined ? fila.identificacion_puesto : "-")}</td>
                <td class="col-texto">${escaparTexto(fila.ubicacion || "-")}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function toggleSeleccionarTodos(source) {
        document.querySelectorAll('.check-registro').forEach(cb => cb.checked = source.checked);
        actualizarContadorSeleccionados();
    }

    function actualizarContadorSeleccionados() {
        const seleccionados = document.querySelectorAll('.check-registro:checked');
        const btnEliminar = document.getElementById('btnEliminarSeleccionados');
        const spanContador = document.getElementById('contadorSeleccionados');

        if (seleccionados.length > 0 && obtenerModoActual() === 'extintor') {
            btnEliminar.style.display = 'block';
            spanContador.textContent = `${seleccionados.length} registro(s) tildado(s)`;
        } else {
            btnEliminar.style.display = 'none';
            spanContador.textContent = '';
        }
    }

    async function eliminarSeleccionados() {
        const seleccionados = document.querySelectorAll('.check-registro:checked');
        if (seleccionados.length === 0) return;

        const idsAEliminar = Array.from(seleccionados).map(cb => String(cb.value));

        const confirmar = confirm(`⚠️ ¿Estás 100% seguro de que querés ELIMINAR los ${idsAEliminar.length} registros seleccionados de la base de datos?\n\nEsta acción no se puede deshacer.`);
        if (!confirmar) return;

        try {
            const registrosAEliminar = resultadosGlobales.filter(r => idsAEliminar.includes(String(r.id)));
            let fallosHistorial = 0;

            for (const reg of registrosAEliminar) {
                const resHist = await registrarEliminacionEnHistorial(reg);
                if (resHist.error) {
                    console.error("Error al registrar eliminación en historial_revisiones:", resHist.error);
                    fallosHistorial++;
                }
            }

            const { error } = await _supabase
                .from('extintores')
                .delete()
                .in('id', idsAEliminar);

            if (error) throw error;

            if (fallosHistorial > 0) {
                alert(`🗑️ Los registros seleccionados fueron eliminados, aunque hubo ${fallosHistorial} aviso(s) al registrar en el historial.`);
            } else {
                alert("🗑️ Los registros seleccionados fueron eliminados y registrados en el historial correctamente.");
            }
            realizarConsulta();

        } catch (err) {
            console.error("Error al eliminar registros:", err);
            alert("Hubo un error al intentar eliminar los registros en Supabase.");
        }
    }

    function ordenarTabla(columna) {
        if (ordenActual.columna === columna) {
            ordenActual.ascendente = !ordenActual.ascendente;
        } else {
            ordenActual.columna = columna;
            ordenActual.ascendente = true;
        }

        resultadosGlobales.sort((a, b) => {
            const valA = a[columna] !== null && a[columna] !== undefined ? String(a[columna]).toLowerCase() : "";
            const valB = b[columna] !== null && b[columna] !== undefined ? String(b[columna]).toLowerCase() : "";

            const numA = parseFloat(valA);
            const numB = parseFloat(valB);

            if (!isNaN(numA) && !isNaN(numB)) {
                return ordenActual.ascendente ? numA - numB : numB - numA;
            }

            if (valA < valB) return ordenActual.ascendente ? -1 : 1;
            if (valA > valB) return ordenActual.ascendente ? 1 : -1;
            return 0;
        });

        mostrarResultados(resultadosGlobales);
    }
</script>
