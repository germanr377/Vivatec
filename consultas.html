<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Consultas de Fechas</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        .filtros-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .form-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        
        .btn-consultar { background: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .sin-resultados { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Consulta de Registros por Fecha</h2>

    <!-- FILTROS DE FECHA -->
    <div class="filtros-row">
        <div class="form-group">
            <label for="fecha-desde">Desde:</label>
            <input type="date" id="fecha-desde">
        </div>
        <div class="form-group">
            <label for="fecha-hasta">Hasta:</label>
            <input type="date" id="fecha-hasta">
        </div>
        <button class="btn-consultar" onclick="consultarFechas()">🔍 Consultar</button>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <table id="tabla-resultados">
        <thead>
            <tr>
                <th>Oblea</th>
                <th>Extintor N°</th>
                <th>Capacidad</th>
                <th>Ag. Extin.</th>
                <th>Vencimiento</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="5" class="sin-resultados">Seleccioná un rango de fechas y hacé clic en Consultar.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // CREDENCIALES DE SUPABASE
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function consultarFechas() {
        let desde = document.getElementById('fecha-desde').value;
        let hasta = document.getElementById('fecha-hasta').value;

        let tbody = document.querySelector('#tabla-resultados tbody');
        
        if (!desde || !hasta) {
            alert("Por favor, seleccioná ambas fechas.");
            return;
        }

        tbody.innerHTML = `<tr><td colspan="5" class="sin-resultados">Buscando datos en Supabase...</td></tr>`;

        try {
            const { data, error } = await _supabase
                .from('extintores')
                .select('oblea, extintor_numero, capacidad, agente_extintor, vto_carga')
                .gte('vto_carga', desde)
                .lte('vto_carga', hasta)
                .order('vto_carga', { ascending: true });

            if (error) {
                throw error;
            }

            tbody.innerHTML = "";

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="sin-resultados">No se encontraron registros en ese período.</td></tr>`;
                return;
            }

            data.forEach(fila => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${fila.oblea || "-"}</td>
                    <td>${fila.extintor_numero || "-"}</td>
                    <td>${fila.capacidad || "-"}</td>
                    <td>${fila.agente_extintor || "-"}</td>
                    <td>${fila.vto_carga || "-"}</td>
                `;
                tbody.appendChild(tr);
            });

        } catch (error) {
            console.error("Error al consultar Supabase:", error);
            tbody.innerHTML = `<tr><td colspan="5" class="sin-resultados">Error al conectar con la base de datos.</td></tr>`;
        }
    }
</script>

</body>
</html>
