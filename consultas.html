<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Consultas Generales</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Panel de filtros */
        .filtros-panel { background: #ecf0f1; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { flex: 1; min-width: 200px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        
        .btn-search { background: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }
        .btn-limpiar { background: #7f8c8d; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 42px; }

        /* Tabla de resultados */
        .tabla-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-nuevo { background: #2ecc71; color: white; }
        
        #mensajeEstado { margin-top: 15px; font-weight: bold; color: #e67e22; text-align: center; }

        @media (max-width: 768px) { .filtros-panel { flex-direction: column; } .form-group, .btn-search, .btn-limpiar { width: 100%; } }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Consultas de Extintores - Vivatec</h2>

    <!-- FILTROS DE BÚSQUEDA Y ORDEN -->
    <div class="filtros-panel">
        <div class="form-group">
            <label for="filtroCliente">Cliente:</label>
            <select id="filtroCliente">
                <option value="">-- Todos los clientes --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="filtroExtintor">N° Extintor:</label>
            <input type="text" id="filtroExtintor" placeholder="Buscar exacto...">
        </div>
        <div class="form-group">
            <label for="filtroDps">N° DPS:</label>
            <input type="text" id="filtroDps" placeholder="Buscar exacto...">
        </div>
        <div class="form-group">
            <label for="ordenarPor">Ordenar por:</label>
            <select id="ordenarPor" onchange="realizarConsulta()">
                <option value="id_desc">Más recientes (Ingreso)</option>
                <option value="vto_carga_asc">Próximo Venc. Carga (Más cercano)</option>
                <option value="vto_ph_asc">Próximo Venc. P.H. (Más cercano)</option>
                <option value="extintor_asc">N° Extintor (Menor a mayor)</option>
                <option value="cliente_asc">Cliente (A - Z)</option>
            </select>
        </div>
        <button class="btn-search" onclick="realizarConsulta()">🔍 Consultar</button>
        <button class="btn-limpiar" onclick="limpiarFiltros()">🧹 Limpiar</button>
    </div>

    <div id="mensajeEstado">Utilizá los filtros para buscar registros.</div>

    <!-- TABLA DE RESULTADOS -->
    <div class="tabla-container">
        <table id="tablaResultados">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Extintor N°</th>
                    <th>DPS</th>
                    <th>Tipo / Cap.</th>
                    <th>Marca</th>
                    <th>Venc. Carga</th>
                    <th>Venc. PH</th>
                    <th>Ubicación</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <!-- Las filas se llenarán acá dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // CREDENCIALES CONFIGURADAS CON SUPABASE
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // TRADUCTOR DE FECHAS: AAAA-MM-DD a DD/MM/AAAA
    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) {
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        return fechaSQL;
    }

    // CARGAR CLIENTES AL INICIAR
    window.addEventListener("load", async function() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente')
            .not('cliente', 'is', null);

        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("filtroCliente");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }
        realizarConsulta();
    });

    // EJECUTAR LA CONSULTA CON ORDENAMIENTO
    async function realizarConsulta() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        const extintor = document.getElementById("filtroExtintor").value.trim();
        const dps = document.getElementById("filtroDps").value.trim();
        const ordenSeleccionado = document.getElementById("ordenarPor").value;
        const tbody = document.getElementById("cuerpoTabla");
        const mensaje = document.getElementById("mensajeEstado");

        mensaje.textContent = "Buscando datos...";
        tbody.innerHTML = "";

        let query = _supabase.from('extintores').select('*');

        // Aplicar filtros
        if (cliente) query = query.eq('cliente', cliente);
        if (extintor) query = query.eq('extintor_numero', extintor);
        if (dps) query = query.eq('numero_dps', dps);

        // Aplicar orden dinámico según lo que elegiste en el selector
        if (ordenSeleccionado === "id_desc") {
            query = query.order('id', { ascending: false });
        } else if (ordenSeleccionado === "vto_carga_asc") {
            query = query.order('vto_carga', { ascending: true, nullsFirst: false });
        } else if (ordenSeleccionado === "vto_ph_asc") {
            query = query.order('vto_prueb_hidr', { ascending: true, nullsFirst: false });
        } else if (ordenSeleccionado === "extintor_asc") {
            query = query.order('extintor_numero', { ascending: true });
        } else if (ordenSeleccionado === "cliente_asc") {
            query = query.order('cliente', { ascending: true });
        }

        const { data, error } = await query.limit(200);

        if (error) {
            console.error("Error al consultar:", error);
            mensaje.textContent = "Ocurrió un error al consultar la base de datos.";
            return;
        }

        if (data.length === 0) {
            mensaje.textContent = "No se encontraron resultados para esta búsqueda.";
            return;
        }

        mensaje.textContent = `Se encontraron ${data.length} registros (mostrando hasta 200).`;

        // Poblar la tabla
        data.forEach(ex => {
            let tr = document.createElement("tr");

            let formatoDps = ex.numero_dps;
            if (formatoDps === "NUEVO") {
                formatoDps = `<span class="badge badge-nuevo">NUEVO</span>`;
            }

            tr.innerHTML = `
                <td><strong>${ex.cliente || "-"}</strong></td>
                <td>${ex.extintor_numero || "-"}</td>
                <td>${formatoDps || "-"}</td>
                <td>${ex.tipo || "-"} ${ex.capacidad ? `(${ex.capacidad})` : ""}</td>
                <td>${ex.marca || "-"}</td>
                <td>${formatearFechaWeb(ex.vto_carga)}</td>
                <td>${formatearFechaWeb(ex.vto_prueb_hidr)}</td>
                <td>${ex.identificacion_puesto || "-"} / ${ex.ubicacion || "-"}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // LIMPIAR FILTROS
    function limpiarFiltros() {
        document.getElementById("filtroCliente").value = "";
        document.getElementById("filtroExtintor").value = "";
        document.getElementById("filtroDps").value = "";
        document.getElementById("ordenarPor").value = "id_desc";
        realizarConsulta();
    }
</script>

</body>
</html>
