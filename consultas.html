<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Consultas de Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        .filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 4px; color: #555; font-size: 12px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; transition: background 0.3s, border-color 0.3s; }
        
        /* AMARILLO MÁS INTENSO Y VISIBLE PARA CAMPOS ACTIVOS */
        .filtro-activo { background-color: #fff176 !important; border-color: #fbc02d !important; font-weight: bold; }

        .botones-grid { display: flex; gap: 8px; grid-column: span 2; }
        .btn-consultar { background: #2980b9; color: white; border: none; padding: 9px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 38px; flex: 1; }
        .btn-consultar:hover { background: #1f618d; }

        .btn-limpiar { background: #7f8c8d; color: white; border: none; padding: 9px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; height: 38px; flex: 1; }
        .btn-limpiar:hover { background: #626567; }

        .acciones-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .badge-total { background: #2980b9; color: white; padding: 5px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        
        .btn-eliminar { background: #c0392b; color: white; border: none; padding: 9px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; display: none; }
        .btn-eliminar:hover { background: #962d22; }

        .table-container { max-height: 500px; overflow-y: auto; overflow-x: auto; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: center; font-size: 12px; }
        th { background-color: #2c3e50; color: white; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 1; }
        th:hover { background-color: #34495e; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .sin-resultados { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Panel de Consultas y Gestión de Extintores</h2>

    <!-- FILTROS DE BÚSQUEDA -->
    <div class="filtros-grid">
        <div class="form-group">
            <label>Cliente:</label>
            <select id="filtroCliente" onchange="verificarCampo(this)">
                <option value="">-- Todos --</option>
            </select>
        </div>
        <div class="form-group">
            <label>N° Extintor:</label>
            <input type="text" id="filtroExtintor" placeholder="Ej: 6389130" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>N° DPS:</label>
            <input type="text" id="filtroDps" placeholder="Ej: 5503020" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Tipo:</label>
            <input type="text" id="filtroTipo" placeholder="Ej: ABC" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Capacidad:</label>
            <input type="text" id="filtroCapacidad" placeholder="Ej: 10" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Marca:</label>
            <input type="text" id="filtroMarca" placeholder="Ej: Horizonte" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Año Fab.:</label>
            <input type="text" id="filtroAnioFab" placeholder="Ej: 2024" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Puesto:</label>
            <input type="text" id="filtroPuesto" placeholder="Ej: 1" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Ubicación:</label>
            <input type="text" id="filtroUbicacion" placeholder="Ej: Pasillo" oninput="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Vto. P.H. Desde (Mes):</label>
            <input type="month" id="ph-desde" onchange="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Vto. P.H. Hasta (Mes):</label>
            <input type="month" id="ph-hasta" onchange="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Vto. Carga Desde (Mes):</label>
            <input type="month" id="carga-desde" onchange="verificarCampo(this)">
        </div>
        <div class="form-group">
            <label>Vto. Carga Hasta (Mes):</label>
            <input type="month" id="carga-hasta" onchange="verificarCampo(this)">
        </div>
        
        <!-- BOTONES DE ACCIÓN DE FILTRO -->
        <div class="botones-grid">
            <button class="btn-consultar" onclick="realizarConsulta()">🔍 Buscar</button>
            <button class="btn-limpiar" onclick="limpiarFiltros()">🧹 Limpiar</button>
        </div>
    </div>

    <!-- BARRA DE ACCIONES (Contador de registros y Borrado masivo) -->
    <div class="acciones-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="badgeTotal" class="badge-total">0 registros encontrados</span>
            <span id="contadorSeleccionados" style="font-weight: bold; color: #555; font-size: 13px;"></span>
        </div>
        <button id="btnEliminarSeleccionados" class="btn-eliminar" onclick="eliminarSeleccionados()">🗑️ Eliminar Registros Tildados</button>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <div class="table-container">
        <table id="tabla-resultados">
            <thead>
                <tr>
                    <th style="width: 30px;"><input type="checkbox" id="checkTodos" onclick="toggleSeleccionarTodos(this)"></th>
                    <th onclick="ordenarTabla('cliente')">Cliente ↕</th>
                    <th onclick="ordenarTabla('oblea')">Oblea ↕</th>
                    <th onclick="ordenarTabla('extintor_numero')">Extintor N° ↕</th>
                    <th onclick="ordenarTabla('tipo')">Tipo ↕</th>
                    <th onclick="ordenarTabla('capacidad')">Capacidad ↕</th>
                    <th onclick="ordenarTabla('ano_fab')">A. Fab ↕</th>
                    <th onclick="ordenarTabla('marca')">Marca ↕</th>
                    <th onclick="ordenarTabla('vto_prueb_hidr')">Vto. P.H. ↕</th>
                    <th onclick="ordenarTabla('vto_carga')">Vto. Carga ↕</th>
                    <th onclick="ordenarTabla('numero_dps')">DPS ↕</th>
                    <th onclick="ordenarTabla('identificacion_puesto')">Puesto ↕</th>
                    <th onclick="ordenarTabla('ubicacion')">Ubicación ↕</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="13" class="sin-resultados">Seleccioná los filtros y hacé clic en Buscar.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let resultadosGlobales = [];
    let ordenActual = { columna: 'vto_carga', ascendente: true };

    // TRADUCTOR DE FECHAS: Supabase (AAAA-MM-DD) -> Pantalla (DD/MM/AAAA)
    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) {
            return `${partes[2]}/${partes[1]}/${partes[0]}`; // Retorna DD/MM/AAAA
        }
        return fechaSQL;
    }

    window.addEventListener("load", async function() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('cliente')
            .not('cliente', 'is', null);

        if (!error && data) {
            const clientesUnicos = [...new Set(data.map(item => item.cliente).filter(Boolean))].sort();
            let select = document.getElementById("filtroCliente");
            clientesUnicos.forEach(cliente => {
                let opt = document.createElement("option");
                opt.value = cliente;
                opt.textContent = cliente;
                select.appendChild(opt);
            });
        }
    });

    // Pinta con un amarillo bien visible el campo si tiene contenido
    function verificarCampo(input) {
        if (input.value && input.value.trim() !== "") {
            input.classList.add("filtro-activo");
        } else {
            input.classList.remove("filtro-activo");
        }
    }

    // Botón Limpiar: Pone todo en cero/vacío y resetea la tabla
    function limpiarFiltros() {
        const inputs = document.querySelectorAll('.filtros-grid input, .filtros-grid select');
        inputs.forEach(el => {
            el.value = "";
            el.classList.remove("filtro-activo");
        });

        resultadosGlobales = [];
        let tbody = document.querySelector('#tabla-resultados tbody');
        tbody.innerHTML = `<tr><td colspan="13" class="sin-resultados">Seleccioná los filtros y hacé clic en Buscar.</td></tr>`;
        document.getElementById('badgeTotal').textContent = "0 registros encontrados";
        document.getElementById('checkTodos').checked = false;
        actualizarContadorSeleccionados();
    }

    async function realizarConsulta() {
        let cliente = document.getElementById('filtroCliente').value.trim();
        let extintor = document.getElementById('filtroExtintor').value.trim();
        let dps = document.getElementById('filtroDps').value.trim();
        let tipo = document.getElementById('filtroTipo').value.trim();
        let capacidad = document.getElementById('filtroCapacidad').value.trim();
        let marca = document.getElementById('filtroMarca').value.trim();
        let anioFab = document.getElementById('filtroAnioFab').value.trim();
        let puesto = document.getElementById('filtroPuesto').value.trim();
        let ubicacion = document.getElementById('filtroUbicacion').value.trim();
        
        let phDesde = document.getElementById('ph-desde').value;     // Formato: AAAA-MM
        let phHasta = document.getElementById('ph-hasta').value;     // Formato: AAAA-MM
        let cargaDesde = document.getElementById('carga-desde').value; // Formato: AAAA-MM
        let cargaHasta = document.getElementById('carga-hasta').value; // Formato: AAAA-MM

        let tbody = document.querySelector('#tabla-resultados tbody');
        tbody.innerHTML = `<tr><td colspan="13" class="sin-resultados">Buscando datos en Supabase...</td></tr>`;

        try {
            let query = _supabase.from('extintores').select('*');

            if (cliente) query = query.eq('cliente', cliente);
            if (extintor) query = query.eq('extintor_numero', extintor);
            if (dps) query = query.eq('numero_dps', dps);
            if (tipo) query = query.ilike('tipo', `%${tipo}%`);
            if (capacidad) query = query.eq('capacidad', capacidad);
            if (marca) query = query.ilike('marca', `%${marca}%`);
            if (anioFab) query = query.eq('ano_fab', parseInt(anioFab));
            if (puesto) query = query.eq('identificacion_puesto', parseInt(puesto));
            if (ubicacion) query = query.ilike('ubicacion', `%${ubicacion}%`);

            // Adaptación de rangos de meses para consultar correctamente contra la base de datos (YYYY-MM-01)
            if (phDesde) query = query.gte('vto_prueb_hidr', `${phDesde}-01`);
            if (phHasta) query = query.lte('vto_prueb_hidr', `${phHasta}-01`);
            if (cargaDesde) query = query.gte('vto_carga', `${cargaDesde}-01`);
            if (cargaHasta) query = query.lte('vto_carga', `${cargaHasta}-01`);

            const { data, error } = await query.order('vto_carga', { ascending: true });

            if (error) throw error;

            resultadosGlobales = data || [];
            mostrarResultados(resultadosGlobales);

        } catch (error) {
            console.error("Error al consultar Supabase:", error);
            tbody.innerHTML = `<tr><td colspan="13" class="sin-resultados">Error al conectar con la base de datos.</td></tr>`;
            document.getElementById('badgeTotal').textContent = "0 registros encontrados";
        }
    }

    function mostrarResultados(datos) {
        let tbody = document.querySelector('#tabla-resultados tbody');
        tbody.innerHTML = "";
        document.getElementById('checkTodos').checked = false;
        actualizarContadorSeleccionados();

        // Actualizar el contador de registros encontrados
        document.getElementById('badgeTotal').textContent = `${datos.length} registro(s) encontrado(s)`;

        if (datos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="13" class="sin-resultados">No se encontraron registros con los filtros seleccionados.</td></tr>`;
            return;
        }

        datos.forEach(fila => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="check-registro" value="${fila.id}" onclick="actualizarContadorSeleccionados()"></td>
                <td>${fila.cliente || "-"}</td>
                <td>${fila.oblea || "-"}</td>
                <td>${fila.extintor_numero || "-"}</td>
                <td>${fila.tipo || "-"}</td>
                <td>${fila.capacidad || "-"}</td>
                <td>${fila.ano_fab || "-"}</td>
                <td>${fila.marca || "-"}</td>
                <td>${formatearFechaWeb(fila.vto_prueb_hidr)}</td>
                <td>${formatearFechaWeb(fila.vto_carga)}</td>
                <td>${fila.numero_dps || "-"}</td>
                <td>${fila.identificacion_puesto !== null && fila.identificacion_puesto !== undefined ? fila.identificacion_puesto : "-"}</td>
                <td>${fila.ubicacion || "-"}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function toggleSeleccionarTodos(source) {
        checkboxes = document.querySelectorAll('.check-registro');
        checkboxes.forEach(cb => cb.checked = source.checked);
        actualizarContadorSeleccionados();
    }

    function actualizarContadorSeleccionados() {
        let seleccionados = document.querySelectorAll('.check-registro:checked');
        let btnEliminar = document.getElementById('btnEliminarSeleccionados');
        let spanContador = document.getElementById('contadorSeleccionados');

        if (seleccionados.length > 0) {
            btnEliminar.style.display = 'block';
            spanContador.textContent = `${seleccionados.length} registro(s) tildado(s)`;
        } else {
            btnEliminar.style.display = 'none';
            spanContador.textContent = '';
        }
    }

    async function eliminarSeleccionados() {
        let seleccionados = document.querySelectorAll('.check-registro:checked');
        if (seleccionados.length === 0) return;

        let idsAEliminar = Array.from(seleccionados).map(cb => cb.value);

        let confirmar = confirm(`⚠️ ¿Estás 100% seguro de que querés ELIMINAR los ${idsAEliminar.length} registros seleccionados de la base de datos?\n\nEsta acción no se puede deshacer.`);
        if (!confirmar) return;

        try {
            const { error } = await _supabase
                .from('extintores')
                .delete()
                .in('id', idsAEliminar);

            if (error) throw error;

            alert("🗑️ Los registros seleccionados fueron eliminados correctamente.");
            realizarConsulta();

        } catch (err) {
            console.error("Error al eliminar registros:", err);
            alert("Hubo un error al intentar eliminar los registros en Supabase.");
        }
    }

    function ordenarTabla(columna) {
        if (ordenActual.columna === columna) {
            ordenActual.ascendente = !ordenActual.ascendente;
        } else {
            ordenActual.columna = columna;
            ordenActual.ascendente = true;
        }

        resultadosGlobales.sort((a, b) => {
            let valA = a[columna] !== null && a[columna] !== undefined ? String(a[columna]).toLowerCase() : "";
            let valB = b[columna] !== null && b[columna] !== undefined ? String(b[columna]).toLowerCase() : "";

            let numA = parseFloat(valA);
            let numB = parseFloat(valB);
            
            if (!isNaN(numA) && !isNaN(numB)) {
                return ordenActual.ascendente ? numA - numB : numB - numA;
            }

            if (valA < valB) return ordenActual.ascendente ? -1 : 1;
            if (valA > valB) return ordenActual.ascendente ? 1 : -1;
            return 0;
        });

        mostrarResultados(resultadosGlobales);
    }
</script>

</body>
</html>
