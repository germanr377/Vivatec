<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Extintores</title>
    
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e4e4e7;
            width: 100%;
            max-width: 600px;
        }

        h2 { margin-top: 0; color: #18181b; }

        /* Formulario a dos columnas */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Hacer que algunos elementos ocupen las dos columnas si es necesario */
        .col-completa { grid-column: 1 / -1; }

        .campo {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85em;
            font-weight: 600;
            color: #3f3f46;
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
        }

        button {
            grid-column: 1 / -1;
            padding: 12px;
            background-color: #ef4444; /* Rojo */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover { background-color: #dc2626; }

        #mensaje {
            grid-column: 1 / -1;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            min-height: 20px;
        }

        @media (max-width: 500px) {
            form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Alta de Extintor</h2>
        <form id="form-extintores">
            
            <div class="campo col-completa">
                <label>Cliente</label>
                <input type="text" id="cliente">
            </div>

            <div class="campo">
                <label>N° Extintor</label>
                <input type="text" id="extintor_numero">
            </div>

            <div class="campo">
                <label>Tipo Oblea</label>
                <input type="text" id="oblea">
            </div>

            <div class="campo">
                <label>Tipo</label>
                <input type="text" id="tipo">
            </div>

            <div class="campo">
                <label>Agente Extintor</label>
                <input type="text" id="agente_extintor">
            </div>

            <div class="campo">
                <label>Capacidad</label>
                <input type="text" id="capacidad">
            </div>

            <div class="campo">
                <label>Año Fab.</label>
                <input type="number" id="ano_fab">
            </div>

            <div class="campo col-completa">
                <label>Marca</label>
                <input type="text" id="marca">
            </div>

            <div class="campo">
                <label>Vto Carga</label>
                <input type="date" id="vto_carga">
            </div>

            <div class="campo">
                <label>Vto P.H.</label>
                <input type="date" id="vto_prueb_hidr">
            </div>

            <div class="campo">
                <label>Puesto</label>
                <input type="text" id="numero_dps">
            </div>

            <div class="campo">
                <label>Identif. puesto</label>
                <input type="number" id="identificacion_puesto">
            </div>

            <div class="campo col-completa">
                <label>Ubicación</label>
                <input type="text" id="ubicacion">
            </div>

            <button type="submit">Guardar Registro</button>
            <div id="mensaje"></div>
        </form>
    </div>

    <script>
        // 1. Configuración de Supabase
        // Reemplazá con tu ANON KEY pública de Supabase
        const SUPABASE_URL = 'https://cpgdqzrvtensoruahgxn.supabase.co';
        const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI'; 
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Función auxiliar para manejar los campos vacíos
        // Si el campo está vacío, devuelve null en lugar de un texto vacío
        function obtenerValor(id, esNumero = false) {
            const valor = document.getElementById(id).value.trim();
            if (valor === '') return null;
            return esNumero ? parseInt(valor) : valor;
        }

        // 3. Manejo del envío del formulario
        document.getElementById('form-extintores').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            
            mensaje.textContent = 'Guardando datos...';
            mensaje.style.color = '#666';

            // Armar el objeto mapeando los inputs a las columnas de la base de datos
            const nuevoRegistro = {
                cliente: obtenerValor('cliente'),
                extintor_numero: obtenerValor('extintor_numero'),
                oblea: obtenerValor('oblea'),
                tipo: obtenerValor('tipo'),
                agente_extintor: obtenerValor('agente_extintor'),
                capacidad: obtenerValor('capacidad'),
                ano_fab: obtenerValor('ano_fab', true),
                marca: obtenerValor('marca'),
                vto_carga: obtenerValor('vto_carga'),
                vto_prueb_hidr: obtenerValor('vto_prueb_hidr'),
                numero_dps: obtenerValor('numero_dps'),
                identificacion_puesto: obtenerValor('identificacion_puesto', true),
                ubicacion: obtenerValor('ubicacion')
            };

            // Enviar a Supabase
            const { error } = await supabase
                .from('extintores')
                .insert([nuevoRegistro]);

            if (error) {
                console.error(error);
                mensaje.textContent = 'Error al guardar: ' + error.message;
                mensaje.style.color = 'red';
            } else {
                mensaje.textContent = '¡Registro guardado correctamente!';
                mensaje.style.color = 'green';
                e.target.reset(); // Limpia el formulario
                
                setTimeout(() => { mensaje.textContent = ''; }, 4000);
            }
        });
    </script>
</body>
</html>
