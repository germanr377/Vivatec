<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVATEC - Gestión de Extintores</title>
    
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1000px;
            margin-inline: auto;
        }

        /* Cabecera */
        header {
            background: #18181b;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Contenedor principal con CSS Grid */
        main {
            display: grid;
            grid-template-columns: 300px 1fr; /* Formulario a la izquierda, tabla a la derecha */
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
        }

        /* Tarjetas (Formulario y Tabla) */
        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e4e4e7;
        }

        /* Estilos del Formulario */
        form { display: grid; gap: 15px; }
        label { font-size: 0.9em; font-weight: 600; color: #3f3f46; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px;
            background-color: #ef4444; /* Rojo para VIVATEC / Extintores */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #dc2626; }
        
        button.btn-baja {
            background-color: #3f3f46;
            padding: 5px 10px;
            font-size: 0.85em;
        }
        button.btn-baja:hover { background-color: #18181b; }

        #mensaje { font-size: 0.85em; font-weight: bold; margin: 0; text-align: center; height: 15px; }

        /* Estilos de la Tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e4e4e7;
            font-size: 0.9em;
        }
        th { background-color: #f8fafc; font-weight: 600; color: #3f3f46; }
        tr:hover { background-color: #fafafa; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin: 0;">VIVATEC - Gestión de Extintores</h2>
    </header>

    <main>
        <!-- Panel Izquierdo: Alta de Extintor -->
        <div class="panel">
            <h3 style="margin-top: 0;">Alta de Equipo</h3>
            <form id="formulario-carga">
                <div>
                    <label for="numero_serie">Nº de Serie o Puesto:</label>
                    <input type="text" id="numero_serie" required placeholder="Ej: EXT-001">
                </div>

                <div>
                    <label for="tipo_extintor">Tipo:</label>
                    <select id="tipo_extintor" required>
                        <option value="ABC 5kg">Polvo ABC - 5kg</option>
                        <option value="ABC 10kg">Polvo ABC - 10kg</option>
                        <option value="CO2 3.5kg">CO2 - 3.5kg</option>
                        <option value="Agua 10L">Agua - 10L</option>
                    </select>
                </div>

                <div>
                    <label for="fecha_vencimiento">Vencimiento Carga:</label>
                    <input type="date" id="fecha_vencimiento" required>
                </div>

                <button type="submit">Registrar Extintor</button>
                <p id="mensaje"></p>
            </form>
        </div>

        <!-- Panel Derecho: Inventario y Bajas -->
        <div class="panel">
            <h3 style="margin-top: 0;">Inventario Activo</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nº Serie</th>
                        <th>Tipo</th>
                        <th>Vencimiento</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-extintores">
                    <!-- Los datos se inyectarán aquí con JavaScript -->
                    <tr><td colspan="4" style="text-align:center; color:#666;">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // 1. Configuración de Supabase
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
        const SUPABASE_ANON_KEY = 'tu-anon-key-publica';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Nombre de la tabla en tu base de datos
        const TABLA = 'extintores'; 

        // 2. Función para leer y mostrar los extintores
        async function cargarExtintores() {
            const tbody = document.getElementById('tabla-extintores');
            
            // Consultar datos a Supabase ordenados por fecha de creación descendente
            const { data, error } = await supabase
                .from(TABLA)
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error al cargar:", error);
                tbody.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Error al cargar datos</td></tr>`;
                return;
            }

            tbody.innerHTML = ''; // Limpiar tabla

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#666;">No hay extintores registrados.</td></tr>`;
                return;
            }

            // Generar las filas de la tabla dinámicamente
            data.forEach(extintor => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${extintor.numero_serie}</strong></td>
                    <td>${extintor.tipo_extintor}</td>
                    <td>${extintor.fecha_vencimiento}</td>
                    <td>
                        <button class="btn-baja" onclick="darDeBaja(${extintor.id})">Baja / Borrar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Función para dar de baja (eliminar) un extintor
        async function darDeBaja(id) {
            if (!confirm('¿Estás seguro de que deseas dar de baja este extintor? Esta acción no se puede deshacer.')) return;

            const { error } = await supabase
                .from(TABLA)
                .delete()
                .eq('id', id);

            if (error) {
                alert("Error al dar de baja: " + error.message);
                console.error(error);
            } else {
                cargarExtintores(); // Recargar la tabla automáticamente
            }
        }

        // 4. Manejar el evento de Alta (Submit del formulario)
        document.getElementById('formulario-carga').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = 'Guardando...';
            mensaje.style.color = '#666';

            const nuevoExtintor = {
                numero_serie: document.getElementById('numero_serie').value,
                tipo_extintor: document.getElementById('tipo_extintor').value,
                fecha_vencimiento: document.getElementById('fecha_vencimiento').value
            };

            const { error } = await supabase
                .from(TABLA)
                .insert([nuevoExtintor]);

            if (error) {
                mensaje.textContent = 'Error: ' + error.message;
                mensaje.style.color = 'red';
            } else {
                mensaje.textContent = 'Guardado exitosamente';
                mensaje.style.color = 'green';
                evento.target.reset(); // Limpiar formulario
                cargarExtintores();    // Actualizar tabla instantáneamente
                setTimeout(() => { mensaje.textContent = ''; }, 3000);
            }
        });

        // 5. Cargar los datos al abrir la página por primera vez
        document.addEventListener('DOMContentLoaded', cargarExtintores);

    </script>
</body>
</html>
