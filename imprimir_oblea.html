<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Imprimir Oblea (Uso Gral)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #000; }
        
        /* Panel de control superior (solo visible en pantalla) */
        .control-panel { max-width: 500px; margin: 0 auto 20px auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); text-align: center; }
        .control-panel label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; color: #333; }
        .control-panel input[type="range"] { width: 100%; cursor: pointer; }
        .btn-accion { background: #2980b9; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn-accion:hover { background: #1f618d; }
        .btn-volver { background: #7f8c8d; }
        .btn-volver:hover { background: #626567; }

        /* Contenedor de la Oblea (Uso Gral) */
        .oblea-container {
            width: 420px;
            border: 2px dashed #b2bec3;
            background: #fff;
            margin: auto;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            font-size: 12px;
        }

        .header-oblea {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        /* LÍNEA 1 */
        .linea-uno {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
        }

        .campo-item {
            text-align: center;
            flex: 1;
        }

        /* Etiquetas guía que SOLO se ven en pantalla para orientar */
        .etiqueta-guia {
            display: block;
            font-size: 8.5px;
            color: #d35400;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .valor-dato {
            font-size: 11px;
            color: #000;
        }

        /* BLOQUE DISTANCIA A */
        .bloque-distancia-a {
            margin-top: 30px; /* Ajustable con el slider */
        }

        /* NUEVO DISEÑO: Bloque de Vencimiento con recuadro y cajitas más juntas */
        .bloque-vencimiento-caja {
            border: 1.5px dashed #ccc;
            padding: 6px;
            background: #fafafa;
            text-align: center;
            width: 180px;
            margin: auto;
        }

        .vencimiento-titulo {
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 4px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 3px;
        }

        .vencimiento-grid {
            display: flex;
            justify-content: center;
            gap: 8px; /* Mantiene Mes y Año bien cerquita */
        }

        .venc-caja {
            border: 1px solid #bbb;
            padding: 3px 6px;
            background: #fff;
            text-align: center;
            min-width: 50px;
        }

        /* CONFIGURACIÓN DE IMPRESIÓN (Rota 90 grados y oculta guías) */
        @media print {
            body { background: #fff; padding: 0; }
            .no-print { display: none !important; }
            .etiqueta-guia { display: none !important; } 
            
            .oblea-container { 
                border: none; 
                margin: 0; 
                padding: 0; 
                width: 100%; 
                box-shadow: none; 
                background: transparent !important; 
                /* Rota todo el contenido 90 grados al imprimir */
                transform: rotate(90deg);
                transform-origin: top left;
                position: absolute;
                top: 0;
                left: 100%;
            }
            
            .linea-uno { border-bottom: none; }
            .bloque-vencimiento-caja { border: none; background: transparent !important; }
            .vencimiento-titulo { border-bottom: none; }
            .venc-caja { border: none; background: transparent !important; padding: 0; }
            .valor-dato, .venc-caja .valor-dato { font-size: 13px; font-weight: bold; color: #c0392b; } 
        }
    </style>
</head>
<body>

<div class="control-panel no-print">
    <h3>🖨️ Calibración Oblea - Uso Gral</h3>
    <div style="margin-bottom: 12px;">
        <label for="sliderDistancia">Distancia A (Espacio vertical): <span id="valDistancia">30</span>px</label>
        <input type="range" id="sliderDistancia" min="5" max="150" value="30" oninput="cambiarDistanciaA(this.value)">
    </div>
    <div>
        <button class="btn-accion" onclick="window.print()">🖨️ Imprimir Oblea</button>
        <button class="btn-accion btn-volver" onclick="window.location.href='gestion.html'">⬅️ Volver a Gestión</button>
    </div>
</div>

<div class="oblea-container" id="obleaCard">
    <div class="header-oblea no-print">
        VIVATEC - VISTA PREVIA (USO GENERAL)
    </div>

    <!-- LÍNEA 1: Extintor N°, Año Fab, Vto PH, Capacidad, Agente -->
    <div class="linea-uno">
        <div class="campo-item">
            <span class="etiqueta-guia">Extintor N°</span>
            <span id="lblExtintor" class="valor-dato">-</span>
        </div>
        <div class="campo-item">
            <span class="etiqueta-guia">Año Fab.</span>
            <span id="lblAnoFab" class="valor-dato">-</span>
        </div>
        <div class="campo-item">
            <span class="etiqueta-guia">Vto. P.H.</span>
            <span id="lblVtoPh" class="valor-dato">-</span>
        </div>
        <div class="campo-item">
            <span class="etiqueta-guia">Capacidad</span>
            <span id="lblCapacidad" class="valor-dato">-</span>
        </div>
        <div class="campo-item">
            <span class="etiqueta-guia">Agente</span>
            <span id="lblAgente" class="valor-dato">-</span>
        </div>
    </div>

    <!-- DISTANCIA A (Controlada por el slider) -->
    <div id="espacioA" class="bloque-distancia-a">
        <!-- BLOQUE VENCIMIENTO -->
        <div class="bloque-vencimiento-caja">
            <div class="vencimiento-titulo">
                <span class="etiqueta-guia">Vencimiento</span>
                <span style="font-size: 9px; display:none;" class="impresion-solo">VENCIMIENTO</span>
            </div>
            <div class="vencimiento-grid">
                <div class="venc-caja">
                    <span class="etiqueta-guia">Mes</span>
                    <span id="lblMesVto" class="valor-dato" style="font-size: 15px; color: #c0392b; font-weight: bold;">-</span>
                </div>
                <div class="venc-caja">
                    <span class="etiqueta-guia">Año</span>
                    <span id="lblAnioVto" class="valor-dato" style="font-size: 15px; color: #c0392b; font-weight: bold;">-</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function cambiarDistanciaA(valor) {
        document.getElementById("valDistancia").textContent = valor;
        document.getElementById("espacioA").style.marginTop = valor + "px";
    }

    window.addEventListener("load", async function() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const idRegistro = urlParams.get('id');

        if (!idRegistro) {
            alert("⚠️ No se especificó el ID del equipo para imprimir.");
            window.location.href = "gestion.html";
            return;
        }

        try {
            const { data, error } = await _supabase
                .from('extintores')
                .select('*')
                .eq('id', idRegistro)
                .single();

            if (error || !data) {
                alert("⚠️ No se encontró el registro en la base de datos.");
                window.location.href = "gestion.html";
                return;
            }

            document.getElementById("lblExtintor").textContent = data.extintor_numero || "-";
            document.getElementById("lblAnoFab").textContent = data.ano_fab || "-";
            document.getElementById("lblVtoPh").textContent = formatearFechaWeb(data.vto_prueb_hidr);
            document.getElementById("lblCapacidad").textContent = data.capacidad ? data.capacidad + " kg" : "-";
            document.getElementById("lblAgente").textContent = data.agente_extintor || "-";

            if (data.vto_carga) {
                let partes = data.vto_carga.split("-");
                if (partes.length === 3) {
                    document.getElementById("lblAnioVto").textContent = partes[0]; 
                    document.getElementById("lblMesVto").textContent = partes[1];   
                }
            }

        } catch (err) {
            console.error("Error al cargar datos de oblea:", err);
            alert("Ocurrió un error al obtener los datos del equipo.");
        }
    });

    function formatearFechaWeb(fechaSQL) {
        if (!fechaSQL) return "-";
        let partes = fechaSQL.split("-");
        if (partes.length === 3) return `${partes[1]}/${partes[0]}`; 
        return fechaSQL;
    }
</script>
</body>
</html>
