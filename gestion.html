<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Gestión y Carga de Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="menu.js"></script>
   
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; transition: background 0.3s; }
       
        /* DISEÑO COMPACTO POR FILAS */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; }
       
        .oblea-preview { margin-top: 20px; border: 2px dashed #27ae60; padding: 20px; border-radius: 6px; background: #f9fff9; transition: all 0.3s; }
        .oblea-header { font-size: 18px; font-weight: bold; text-align: center; color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 8px; margin-bottom: 15px; }

        /* Estilos dinámicos del contenedor */
        .modo-existente { border-color: #d35400 !important; background-color: #fdfefe !important; }
        .modo-existente .oblea-header { color: #d35400; border-bottom-color: #d35400; }

    /* MODO RECARGA (Fondo Amarillo Intenso) */
        .modo-recarga { border-color: #fbc02d !important; background-color: #fff176 !important; }
        .modo-recarga .oblea-header { color: #7d6608; border-bottom-color: #fbc02d; }

        /* Predictivo de clientes */
        .sugerencias-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #bbb;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 210px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
        }
        .sugerencia-item {
            padding: 9px 12px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .sugerencia-item:last-child { border-bottom: none; }
        .sugerencia-item:hover, .sugerencia-item.activa {
            background: #e8f4fd;
            color: #1f618d;
            font-weight: bold;
        }
        .sugerencia-sub {
            font-size: 12px;
            color: #666;
            font-weight: normal;
        }

   /* Avisos flotantes / inline */
        .aviso-nuevo { font-size: 11px; font-weight: bold; color: #e67e22; margin-top: 3px; display: none; }
        .aviso-duplicado-inline {
            display: none;
            background: #eef6fc;
            border-left: 4px solid #2980b9;
            color: #1f4e78;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: bold;
        }


        <!-- FILA 1: Cliente (Predictivo con Enter), N° Extintor, DPS -->
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>Cliente *:</label>
                <input type="text" id="nuevoCliente"  autocomplete="off" required>
                <div id="sugerenciasClientes" class="sugerencias-lista"></div>
            </div>
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>N° Extintor:</label>
                <input type="text" id="nuevoExtintor" oninput="verificarExtintorNuevo()" onblur="verificarDuplicado()">
                <div id="lblNuevoExtintor" class="aviso-nuevo">✨ Nuevo Extintor</div>
            </div>
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>N° DPS:</label>
                <input type="text" id="nuevoDps" oninput="verificarDpsNuevo()" onblur="verificarDuplicado()">
                <div id="lblNuevoDps" class="aviso-nuevo">✨ Nuevo DPS</div>
            </div>
        </div>

        <!-- Aviso no bloqueante para duplicados de otro cliente -->
        <div id="avisoDuplicadoCliente" class="aviso-duplicado-inline"></div>

<!-- FILA 2: Tipo de Oblea, Marca, Tipo, Agente Extintor, Capacidad -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>Tipo Oblea:</label>
                <select id="nuevoOblea">
                    <option value="Uso Gral" selected>Uso Gral</option>
                    <option value="Vehicular 1K">Vehicular 1K</option>
                    <option value="Vehicular">Vehicular</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Marca:</label>
                <input type="text" id="nuevoMarca">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Tipo (A, AB, ABC, BC, K):</label>
                <input type="text" id="nuevoTipo"  oninput="autocompletarAgente()" onblur="validarTipo(this)">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Agente Extintor:</label>
                <input type="text" id="nuevoAgente" >
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Capacidad:</label>
                <input type="text" id="nuevoCapacidad" >
            </div>
        </div>

  <!-- FILA 3: Año Fab, Vencimientos y Ubicación -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Año Fab.:</label>
                <input type="number" id="nuevoAFabricacion">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. P.H. (MM/AA):</label>
                <input type="text" id="nuevoVencPH"  maxlength="5" oninput="formatearEntradaMesAnio(this)" onblur="validarFormatoMesAnio(this)">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. Carga (MM/AA):</label>
                <input type="text" id="nuevoVencCarga"  maxlength="5" oninput="formatearEntradaMesAnio(this)" onblur="validarFormatoMesAnio(this)">
            </div>
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Puesto:</label>
                <input type="number" id="nuevoPuesto" >
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Ubicación:</label>
                <input type="text" id="nuevoUbicacion" >
            </div>
        </div>

<!-- BOTONERIA DE ACCIÓN UNIFICADA -->
        <div class="action-buttons">
            <button class="btn-base btn-buscar" onclick="buscarExtintor()">🔍 Buscar</button>
            <button class="btn-base btn-recarga" onclick="aplicarRecarga()">⚡ Recarga</button>
            <button class="btn-base btn-print" onclick="imprimirOblea()">🖨️ Imprimir Oblea</button>
            <button id="btnGuardar" class="btn-base btn-save" onclick="guardarOActualizar()">💾 Guardar / Actualizar</button>
            <button class="btn-base btn-delete" onclick="eliminarExtintor()">🗑️ Eliminar</button>
            <button class="btn-base btn-clean" onclick="limpiarFormulario()">🧹 Limpiar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listaClientesOficiales = [];
    let sugerenciasFiltradas = [];
    let indiceSugerenciaActiva = 0;

    let listaExtintoresExistentes = [];
    let listaDpsExistentes = [];
    let enModoRecarga = false;
    let ultimaConsultaDuplicado = "";

window.addEventListener("load", async function() {
        // 🔒 CONTROL DE SEGURIDAD: Validación de sesión activa
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }

        configurarPredictivoClientes();
        configurarBusquedaPorEnter();
        await cargarClientesEnPredictivo();
        await cargarListasGlobales();
    });

    // Buscar al presionar Enter en N° Extintor o N° DPS
    function configurarBusquedaPorEnter() {
        ["nuevoExtintor", "nuevoDps"].forEach(id => {
            const input = document.getElementById(id);
            if (!input) return;
            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    buscarExtintor();
                }
            });
        });
    }

  // LLENAR EL LISTADO PREDICTIVO EXCLUSIVAMENTE CON LA TABLA CLIENTES
    async function cargarClientesEnPredictivo() {
        const { data, error } = await _supabase
            .from('clientes')
            .select('nombre_cliente, razon_social')
            .order('nombre_cliente', { ascending: true });

        const inputCliente = document.getElementById("nuevoCliente");
        listaClientesOficiales = [];

        if (error) {
            console.error("Error al cargar clientes:", error);
            inputCliente.placeholder = "Error al cargar clientes";
            alert("⚠️ Error al obtener el directorio de clientes.");
            return;
        }

        inputCliente.placeholder = "Escribí o elegí un cliente oficial...";

        if (data) {
            data.forEach(c => {
                if (!c.nombre_cliente) return;
                listaClientesOficiales.push({
                    nombre: c.nombre_cliente.trim(),
                    razon: c.razon_social ? c.razon_social.trim() : ""
                });
            });
        }
    }

function configurarPredictivoClientes() {
        const input = document.getElementById("nuevoCliente");
        const listaDiv = document.getElementById("sugerenciasClientes");

        input.addEventListener("input", () => {
            ultimaConsultaDuplicado = "";
            mostrarSugerenciasClientes(input.value);
        });

        input.addEventListener("focus", () => {
            if (input.value.trim() !== "") {
                mostrarSugerenciasClientes(input.value);
            }
        });

        input.addEventListener("keydown", (e) => {
            const visible = listaDiv.style.display === "block";

            if (e.key === "ArrowDown" && visible && sugerenciasFiltradas.length > 0) {
                e.preventDefault();
                indiceSugerenciaActiva = (indiceSugerenciaActiva + 1) % sugerenciasFiltradas.length;
                actualizarResaltadoSugerencia();
            } else if (e.key === "ArrowUp" && visible && sugerenciasFiltradas.length > 0) {
                e.preventDefault();
                indiceSugerenciaActiva = (indiceSugerenciaActiva - 1 + sugerenciasFiltradas.length) % sugerenciasFiltradas.length;
                actualizarResaltadoSugerencia();
            } else if (e.key === "Enter") {
                if (visible && sugerenciasFiltradas.length > 0) {
                    e.preventDefault();
                    const elegido = sugerenciasFiltradas[indiceSugerenciaActiva] || sugerenciasFiltradas[0];
                    seleccionarClientePredictivo(elegido.nombre);
                }
            } else if (e.key === "Escape") {
                cerrarSugerenciasClientes();
            }
        });


input.addEventListener("blur", () => {
            setTimeout(() => {
                cerrarSugerenciasClientes();
                validarClienteOficialSinBucle();
            }, 150);
        });
    }

    function mostrarSugerenciasClientes(texto) {
        const listaDiv = document.getElementById("sugerenciasClientes");
        const filtro = (texto || "").trim().toLowerCase();

        if (!filtro) {
            cerrarSugerenciasClientes();
            return;
        }

        // Prioriza los que empiezan con lo escrito y luego los que lo contienen
        const empiezanCon = listaClientesOficiales.filter(c =>
            c.nombre.toLowerCase().startsWith(filtro)
        );
        const contienen = listaClientesOficiales.filter(c =>
            !c.nombre.toLowerCase().startsWith(filtro) &&
            (c.nombre.toLowerCase().includes(filtro) || c.razon.toLowerCase().includes(filtro))
        );

        sugerenciasFiltradas = [...empiezanCon, ...contienen].slice(0, 15);
        indiceSugerenciaActiva = 0;

        if (sugerenciasFiltradas.length === 0) {
            cerrarSugerenciasClientes();
            return;
        }

        listaDiv.innerHTML = "";
        sugerenciasFiltradas.forEach((c, idx) => {
            const item = document.createElement("div");

item.className = "sugerencia-item" + (idx === 0 ? " activa" : "");
            item.innerHTML = `${c.nombre}` + (c.razon ? ` <span class="sugerencia-sub">(${c.razon})</span>` : "");
            item.addEventListener("mousedown", (e) => {
                e.preventDefault();
                seleccionarClientePredictivo(c.nombre);
            });
            listaDiv.appendChild(item);
        });

        listaDiv.style.display = "block";
    }

    function actualizarResaltadoSugerencia() {
        const items = document.querySelectorAll("#sugerenciasClientes .sugerencia-item");
        items.forEach((el, idx) => {
            el.classList.toggle("activa", idx === indiceSugerenciaActiva);
            if (idx === indiceSugerenciaActiva) {
                el.scrollIntoView({ block: "nearest" });
            }
        });
    }

    function seleccionarClientePredictivo(nombreCliente) {
        const input = document.getElementById("nuevoCliente");
        input.value = nombreCliente;
        cerrarSugerenciasClientes();
        ultimaConsultaDuplicado = "";
        verificarDuplicado();
        document.getElementById("nuevoExtintor").focus();
    }

    function cerrarSugerenciasClientes() {
        const listaDiv = document.getElementById("sugerenciasClientes");
        listaDiv.style.display = "none";
        sugerenciasFiltradas = [];
        indiceSugerenciaActiva = 0;
    }

// Valida que el cliente escrito exista en la lista oficial y devuelve su nombre exacto (o null si no existe)
    function obtenerClienteOficialValido(texto) {
        let limpio = (texto || "").trim().toLowerCase();
        if (!limpio) return null;
        const encontrado = listaClientesOficiales.find(c => c.nombre.toLowerCase() === limpio);
        return encontrado ? encontrado.nombre : null;
    }
function validarClienteOficialSinBucle() {
        const inputCliente = document.getElementById("nuevoCliente");
        const valorActual = inputCliente.value.trim();
        if (!valorActual) return true;

        const clienteExacto = obtenerClienteOficialValido(valorActual);
        if (clienteExacto) {
            inputCliente.value = clienteExacto;
            return true;
        }
        return false;
    }

    async function cargarListasGlobales() {
        const { data, error } = await _supabase
            .from('extintores')
            .select('extintor_numero, numero_dps');

        if (!error && data) {
            listaExtintoresExistentes = data.map(item => String(item.extintor_numero).trim()).filter(Boolean);
            listaDpsExistentes = data.map(item => String(item.numero_dps).trim()).filter(Boolean);
        }
    }

 // Convierte un texto MM/AA o fecha AAAA-MM-DD a objeto Date del último día del mes
    function obtenerUltimoDiaDeFecha(valor) {
        if (!valor) return null;
        let limpio = String(valor).trim();

        if (/^\d{4}-\d{2}-\d{2}$/.test(limpio)) {
            let [anioStr, mesStr] = limpio.split("-");
            let anio = parseInt(anioStr, 10);
            let mes = parseInt(mesStr, 10);
            return new Date(anio, mes, 0);
        }

        let match = limpio.match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
        if (match) {
            let mes = parseInt(match[1], 10);
            let anio = 2000 + parseInt(match[2], 10);
            return new Date(anio, mes, 0);
        }

        return null;
    }

    // Formatea un Date al último día de su mes en formato MM/AA
    function formatearMesAnioDesdeDate(fecha) {
        let ultimoDiaMes = new Date(fecha.getFullYear(), fecha.getMonth() + 1, 0);
        let mesStr = String(ultimoDiaMes.getMonth() + 1).padStart(2, '0');
        let anioCortoStr = String(ultimoDiaMes.getFullYear()).slice(-2);
        return `${mesStr}/${anioCortoStr}`;
    }

// BOTÓN RECARGA:
    // 1. Nuevo vto carga = mismo mes en curso, último día del mes, 1 año después de la fecha actual.
    // 2. Si el nuevo vto carga es mayor al vto actual de PH, el nuevo vto PH = vto carga + 4 años (último día del mes).
    function aplicarRecarga() {
        let ahora = new Date();
        let anioCarga = ahora.getFullYear() + 1;
        let mesCarga = ahora.getMonth() + 1;
        let fechaNuevaCarga = new Date(anioCarga, mesCarga, 0);

        document.getElementById("nuevoVencCarga").value = formatearMesAnioDesdeDate(fechaNuevaCarga);

        let vencPhActualTexto = document.getElementById("nuevoVencPH").value.trim();
        let fechaPhActual = obtenerUltimoDiaDeFecha(vencPhActualTexto);

        if (!fechaPhActual || fechaNuevaCarga.getTime() > fechaPhActual.getTime()) {
            let fechaNuevoPh = new Date(anioCarga + 4, mesCarga, 0);
            document.getElementById("nuevoVencPH").value = formatearMesAnioDesdeDate(fechaNuevoPh);
        }

let nuevoDps = prompt("Ingrese el nuevo N° de DPS para esta recarga:");
        if (nuevoDps !== null && nuevoDps.trim() !== "") {
            document.getElementById("nuevoDps").value = nuevoDps.trim();
            verificarDpsNuevo();
        }

        let contenedor = document.getElementById("contenedorPrincipal");
        contenedor.classList.remove("modo-existente");
        contenedor.classList.add("modo-recarga");
        document.getElementById("tituloForm").textContent = "⚡ MODO RECARGA ACTIVADO";
       
        enModoRecarga = true;
    }

    // REDIRECCIÓN AL MÓDULO DE IMPRESIÓN VALIDANDO TIPO OBLEA
    function imprimirOblea() {
        let id = document.getElementById("registroId").value;
        let tipoOblea = document.getElementById("nuevoOblea").value.trim();

        if (!id) {
            alert("⚠️ Primero debés buscar, cargar o guardar un extintor para poder imprimir su oblea.");
            return;
        }

        if (!tipoOblea) {
            alert("⚠️ Es obligatorio contar con un 'Tipo Oblea' seleccionado para realizar la impresión.");
            document.getElementById("nuevoOblea").focus();
            return;
        }

        window.location.href = `imprimir_oblea.html?id=${id}`;
    }
function verificarExtintorNuevo() {
        ultimaConsultaDuplicado = "";
        let val = document.getElementById("nuevoExtintor").value.trim();
        let aviso = document.getElementById("lblNuevoExtintor");
        aviso.style.display = (val && !listaExtintoresExistentes.includes(val)) ? "block" : "none";
    }

    function verificarDpsNuevo() {
        ultimaConsultaDuplicado = "";
        let val = document.getElementById("nuevoDps").value.trim();
        let aviso = document.getElementById("lblNuevoDps");
        aviso.style.display = (val && !listaDpsExistentes.includes(val)) ? "block" : "none";
    }

    function validarTipo(input) {
        let valor = input.value.trim().toUpperCase();
        let permitidos = ["A","AB", "ABC", "BC", "K"];
        if (valor && !permitidos.includes(valor)) {
            alert("⚠️ Tipo inválido. Los tipos permitidos son: A, AB, ABC, BC o K.");
            input.value = "";
            document.getElementById("nuevoAgente").value = "";
            input.focus();
        }
    }
