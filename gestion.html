<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Gestión y Carga de Extintores</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="menu.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; transition: background 0.3s; }
        input:disabled { background: #e9ecef; color: #555; cursor: not-allowed; }
        
        /* DISEÑO COMPACTO POR FILAS */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; } 
        
        .oblea-preview { margin-top: 20px; border: 2px dashed #27ae60; padding: 20px; border-radius: 6px; background: #fff; transition: all 0.3s; }
        .oblea-header { font-size: 18px; font-weight: bold; text-align: center; color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 8px; margin-bottom: 15px; }

        /* Estilos dinámicos del contenedor */
        .modo-existente { border-color: #d35400 !important; background-color: #fff !important; }
        .modo-existente .oblea-header { color: #d35400; border-bottom-color: #d35400; }

        /* MODO CAMBIOS SIN GRABAR (Fondo Naranja) */
        .modo-sin-grabar { border-color: #e67e22 !important; background-color: #fdebd0 !important; }
        .modo-sin-grabar .oblea-header { color: #a04000; border-bottom-color: #e67e22; }

        /* MODO RECARGA (Fondo Amarillo Intenso) */
        .modo-recarga { border-color: #fbc02d !important; background-color: #fff176 !important; }
        .modo-recarga .oblea-header { color: #7d6608; border-bottom-color: #fbc02d; }

        /* Predictivo de clientes, marcas y ubicaciones */
        .sugerencias-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #bbb;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 210px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
        }
        .sugerencia-item {
            padding: 9px 12px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .sugerencia-item:last-child { border-bottom: none; }
        .sugerencia-item:hover, .sugerencia-item.activa {
            background: #e8f4fd;
            color: #1f618d;
            font-weight: bold;
        }
        .sugerencia-sub {
            font-size: 12px;
            color: #666;
            font-weight: normal;
        }

        /* Avisos flotantes / inline */
        .aviso-nuevo { font-size: 11px; font-weight: bold; color: #e67e22; margin-top: 3px; display: none; }
        .aviso-duplicado-inline {
            display: none;
            background: #eef6fc;
            border-left: 4px solid #2980b9;
            color: #1f4e78;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Botones de acción */
        .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
        .btn-base { flex: 1; padding: 12px; border: none; color: white; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; min-width: 120px; text-align: center; }
        
        .btn-buscar { background: #2980b9; }
        .btn-buscar:hover { background: #1f618d; }

        /* Botón Recarga (Amarillo) */
        .btn-recarga { background: #f1c40f; color: #2c3e50; }
        .btn-recarga:hover { background: #d4ac0d; }

        /* Botón Reemplazar Extintor */
        .btn-reemplazar { background: #8e44ad; }
        .btn-reemplazar:hover { background: #732d91; }

        /* Botón Imprimir Oblea (Teal) */
        .btn-print { background: #16a085; }
        .btn-print:hover { background: #138d75; }

        .btn-save { background: #27ae60; }
        .btn-save:hover { background: #219653; }
        .btn-save.success { background: #2980b9 !important; }
        .btn-save.existente-btn { background: #d35400 !important; }

        .btn-delete { background: #c0392b; }
        .btn-delete:hover { background: #962d22; }

        .btn-clean { background: #7f8c8d; }
        .btn-clean:hover { background: #626567; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vivatec - Panel de Gestión de Extintores</h2>

    <div id="contenedorPrincipal" class="oblea-preview">
        <div id="tituloForm" class="oblea-header">PANEL DE CONTROL DE EQUIPOS</div>

        <!-- ID oculto para saber si estamos editando un registro existente -->
        <input type="hidden" id="registroId">

        <!-- FILA 1: Cliente (Predictivo con Enter), N° Extintor, DPS -->
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>Cliente *:</label>
                <input type="text" id="nuevoCliente" autocomplete="off" required>
                <div id="sugerenciasClientes" class="sugerencias-lista"></div>
            </div>
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>N° Extintor:</label>
                <input type="text" id="nuevoExtintor" oninput="verificarExtintorNuevo()" onblur="verificarDuplicado()">
                <div id="lblNuevoExtintor" class="aviso-nuevo">✨ Nuevo Extintor</div>
            </div>
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>N° DPS:</label>
                <input type="text" id="nuevoDps" oninput="verificarDpsNuevo()" onblur="verificarDuplicado()">
                <div id="lblNuevoDps" class="aviso-nuevo">✨ Nuevo DPS</div>
            </div>
        </div>

        <!-- Aviso no bloqueante para duplicados de otro cliente -->
        <div id="avisoDuplicadoCliente" class="aviso-duplicado-inline"></div>

        <!-- FILA 2: Tipo de Oblea, Marca, Tipo, Agente Extintor, Capacidad -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 16ch;">
                <label>Tipo Oblea:</label>
                <select id="nuevoOblea">
                    <option value="" selected></option>
                    <option value="general">General</option>
                    <option value="vehicular">Vehicular</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Marca:</label>
                <input type="text" id="nuevoMarca" autocomplete="off">
                <div id="sugerenciasMarcas" class="sugerencias-lista"></div>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Tipo (A, AB, ABC, BC, K):</label>
                <input type="text" id="nuevoTipo" oninput="autocompletarAgente()" onblur="validarTipo(this)">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Agente Extintor:</label>
                <input type="text" id="nuevoAgente">
            </div>
            <div class="form-group" style="flex: none; width: 12ch;">
                <label>Capacidad:</label>
                <input type="text" id="nuevoCapacidad">
            </div>
        </div>

        <!-- FILA 3: Año Fab, Vencimientos y Ubicación/Dominio -->
        <div class="form-row">
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Año Fab.:</label>
                <input type="number" id="nuevoAFabricacion">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. P.H. (MM/AA):</label>
                <input type="text" id="nuevoVencPH" maxlength="5" oninput="formatearEntradaMesAnio(this)" onblur="validarFormatoMesAnio(this)">
            </div>
            <div class="form-group" style="flex: none; width: 14ch;">
                <label>Venc. Carga (MM/AA):</label>
                <input type="text" id="nuevoVencCarga" maxlength="5" oninput="formatearEntradaMesAnio(this)" onblur="validarFormatoMesAnio(this)">
            </div>
            <div class="form-group" style="flex: none; width: 10ch;">
                <label>Puesto:</label>
                <input type="number" id="nuevoPuesto">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Ubicación/Dominio:</label>
                <input type="text" id="nuevoUbicacion" autocomplete="off">
                <div id="sugerenciasUbicaciones" class="sugerencias-lista"></div>
            </div>
        </div>

        <!-- BOTONERIA DE ACCIÓN UNIFICADA -->
        <div class="action-buttons">
            <button class="btn-base btn-buscar" onclick="buscarExtintor()">🔍 Buscar</button>
            <button class="btn-base btn-recarga" onclick="aplicarRecarga()">⚡ Recarga</button>
            <button class="btn-base btn-reemplazar" onclick="iniciarReemplazoExtintor()">🔄 Reemplazar Extintor</button>
            <button class="btn-base btn-print" onclick="imprimirOblea()">🖨️ Imprimir Oblea</button>
            <button id="btnGuardar" class="btn-base btn-save" onclick="guardarOActualizar()">💾 Grabar</button>
            <button class="btn-base btn-delete" onclick="eliminarExtintor()">🗑️ Eliminar</button>
            <button class="btn-base btn-clean" onclick="limpiarFormulario()">🧹 Limpiar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CAMPOS_HISTORIAL = [
        "cliente",
        "extintor_numero",
        "numero_dps",
        "oblea",
        "marca",
        "tipo",
        "agente_extintor",
        "capacidad",
        "ano_fab",
        "vto_prueb_hidr",
        "vto_carga",
        "identificacion_puesto",
        "ubicacion"
    ];

    let listaClientesOficiales = [];
    let listaMarcasExistentes = [];
    let listaExtintoresExistentes = [];
    let listaDpsExistentes = [];

    let enModoRecarga = false;
    let guardandoEnCurso = false;
    let ultimaConsultaDuplicado = "";
    let registroOriginalCargado = null;
    let idExtintorAReemplazar = null;
    let snapshotExtintorAReemplazar = null;
    let timerPredictivoUbicacion = null;

    const controladoresPredictivos = {};

    function normalizarOblea(valor) {
        if (!valor) return null;
        const t = String(valor).trim().toLowerCase();
        if (t === "vehicular" || t.startsWith("vehicular")) return "vehicular";
        if (t === "general" || t.includes("gral")) return "general";
        return null;
    }

    window.addEventListener("load", async function() {
        // 🔒 CONTROL DE SEGURIDAD: Validación de sesión activa
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }

        inicializarPredictivos();
        configurarBusquedaPorEnter();
        configurarAvisoCambiosSinGrabar();
        await cargarClientesEnPredictivo();
        await cargarListasGlobales();
    });

    function normalizarValorComparacion(val) {
        if (val === null || val === undefined || val === "") return null;
        if (typeof val === "number") return Number.isNaN(val) ? null : val;
        return String(val).trim();
    }

    function huboCambiosEnCampos(anterior, actual) {
        if (!anterior) return true;
        return CAMPOS_HISTORIAL.some(campo => {
            return normalizarValorComparacion(anterior[campo]) !== normalizarValorComparacion(actual[campo]);
        });
    }

    function leerValoresActuales() {
        const valAnoFab = document.getElementById("nuevoAFabricacion").value;
        const valPuesto = document.getElementById("nuevoPuesto").value;

        return {
            cliente: document.getElementById("nuevoCliente").value.trim() || null,
            extintor_numero: document.getElementById("nuevoExtintor").value.trim() || null,
            numero_dps: document.getElementById("nuevoDps").value.trim() || null,
            oblea: normalizarOblea(document.getElementById("nuevoOblea").value),
            marca: document.getElementById("nuevoMarca").value.trim().toUpperCase() || null,
            tipo: document.getElementById("nuevoTipo").value.trim().toUpperCase() || null,
            agente_extintor: document.getElementById("nuevoAgente").value.trim().toUpperCase() || null,
            capacidad: document.getElementById("nuevoCapacidad").value.trim() || null,
            ano_fab: valAnoFab ? parseInt(valAnoFab, 10) : null,
            vto_prueb_hidr: formatearFechaSQL(document.getElementById("nuevoVencPH").value),
            vto_carga: formatearFechaSQL(document.getElementById("nuevoVencCarga").value),
            identificacion_puesto: valPuesto ? parseInt(valPuesto, 10) : null,
            ubicacion: document.getElementById("nuevoUbicacion").value.trim() || null
        };
    }

    function marcarFondoSinGrabar(esNuevo = false) {
        const contenedor = document.getElementById("contenedorPrincipal");
        contenedor.classList.remove("modo-existente", "modo-recarga");
        contenedor.classList.add("modo-sin-grabar");
        document.getElementById("tituloForm").textContent = esNuevo 
            ? "🟠 CAMBIOS SIN GRABAR - EXTINTOR NUEVO" 
            : "🟠 CAMBIOS SIN GRABAR";
    }

    function revisarEstadoCambiosMatafuegoCargado() {
        if (guardandoEnCurso || enModoRecarga) return;

        if (idExtintorAReemplazar) {
            marcarFondoSinGrabar(true);
            return;
        }

        const idCargado = document.getElementById("registroId").value.trim();
        const actual = leerValoresActuales();

        if (idCargado && registroOriginalCargado) {
            if (huboCambiosEnCampos(registroOriginalCargado, actual)) {
                marcarFondoSinGrabar(false);
            } else {
                activarEstilosModoExistente();
            }
            return;
        }

        const tieneDatos = CAMPOS_HISTORIAL.some(campo => {
            if (campo === "oblea") return false;
            return normalizarValorComparacion(actual[campo]) !== null;
        });

        if (tieneDatos) {
            marcarFondoSinGrabar(true);
        } else {
            document.getElementById("contenedorPrincipal").classList.remove("modo-sin-grabar");
            document.getElementById("tituloForm").textContent = "PANEL DE CONTROL DE EQUIPOS";
        }
    }

    function configurarAvisoCambiosSinGrabar() {
        const contenedor = document.getElementById("contenedorPrincipal");
        if (!contenedor) return;
        contenedor.addEventListener("input", revisarEstadoCambiosMatafuegoCargado);
        contenedor.addEventListener("change", revisarEstadoCambiosMatafuegoCargado);
    }

    async function registrarEnHistorialRevisiones(extintorId, datosRegistro, accion = null) {
        if (!extintorId) return { error: new Error("Falta extintor_id para historial_revisiones") };

        const payloadHistorial = {
            extintor_id: extintorId,
            fecha_revision: new Date().toISOString()
        };

        if (accion) {
            payloadHistorial.accion = accion;
        }

        CAMPOS_HISTORIAL.forEach(campo => {
            payloadHistorial[campo] = datosRegistro[campo] ?? null;
        });

        let { error } = await _supabase
            .from('historial_revisiones')
            .insert([payloadHistorial]);

        if (error && accion && /accion/i.test(error.message || "")) {
            delete payloadHistorial.accion;
            const retry = await _supabase
                .from('historial_revisiones')
                .insert([payloadHistorial]);
            error = retry.error;
        }

        return { error };
    }

    function configurarBusquedaPorEnter() {
        ["nuevoExtintor", "nuevoDps"].forEach(id => {
            const input = document.getElementById(id);
            if (!input) return;
            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    buscarExtintor();
                }
            });
        });
    }

    function configurarListaPredictiva({
        clave,
        inputId,
        listaId,
        obtenerItems,
        renderItem,
        alSeleccionar,
        alEnterSinLista,
        permitirVacioEnFocus = false
    }) {
        const input = document.getElementById(inputId);
        const listaDiv = document.getElementById(listaId);
        if (!input || !listaDiv) return;

        const estado = { items: [], indice: 0 };

        const cerrar = () => {
            listaDiv.style.display = "none";
            estado.items = [];
            estado.indice = 0;
        };

        const actualizarResaltado = () => {
            const nodos = listaDiv.querySelectorAll(".sugerencia-item");
            nodos.forEach((el, idx) => {
                el.classList.toggle("activa", idx === estado.indice);
                if (idx === estado.indice) {
                    el.scrollIntoView({ block: "nearest" });
                }
            });
        };

        const elegir = async (item) => {
            cerrar();
            if (alSeleccionar) await alSeleccionar(item);
        };

        const abrirConItems = (items) => {
            estado.items = items || [];
            estado.indice = 0;

            if (estado.items.length === 0) {
                cerrar();
                return;
            }

            listaDiv.innerHTML = "";
            estado.items.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "sugerencia-item" + (idx === 0 ? " activa" : "");
                div.innerHTML = renderItem(item);
                div.addEventListener("mousedown", async (e) => {
                    e.preventDefault();
                    await elegir(item);
                });
                listaDiv.appendChild(div);
            });

            listaDiv.style.display = "block";
        };

        const refrescar = async (texto) => {
            const limpio = (texto || "").trim();
            if (!limpio && !permitirVacioEnFocus) {
                cerrar();
                return;
            }
            const items = await obtenerItems(limpio);
            if (input.value.trim() !== limpio) return;
            abrirConItems(items);
        };

        input.addEventListener("input", () => {
            if (clave === "clientes") ultimaConsultaDuplicado = "";
            if (clave === "ubicaciones") {
                clearTimeout(timerPredictivoUbicacion);
                const textoActual = input.value;
                timerPredictivoUbicacion = setTimeout(() => refrescar(textoActual), 180);
            } else {
                refrescar(input.value);
            }
        });

        input.addEventListener("focus", () => {
            if (input.value.trim() !== "" || permitirVacioEnFocus) {
                refrescar(input.value);
            }
        });

        input.addEventListener("keydown", async (e) => {
            const visible = listaDiv.style.display === "block";

            if (e.key === "ArrowDown" && visible && estado.items.length > 0) {
                e.preventDefault();
                estado.indice = (estado.indice + 1) % estado.items.length;
                actualizarResaltado();
            } else if (e.key === "ArrowUp" && visible && estado.items.length > 0) {
                e.preventDefault();
                estado.indice = (estado.indice - 1 + estado.items.length) % estado.items.length;
                actualizarResaltado();
            } else if (e.key === "Enter") {
                if (visible && estado.items.length > 0) {
                    e.preventDefault();
                    if (clave === "ubicaciones") clearTimeout(timerPredictivoUbicacion);
                    await elegir(estado.items[estado.indice] || estado.items[0]);
                } else if (alEnterSinLista) {
                    const manejado = await alEnterSinLista(input.value.trim());
                    if (manejado) e.preventDefault();
                }
            } else if (e.key === "Escape") {
                cerrar();
            }
        });

        input.addEventListener("blur", () => {
            setTimeout(() => {
                cerrar();
                if (clave === "clientes") validarClienteOficialSinBucle();
            }, 150);
        });

        controladoresPredictivos[clave] = { cerrar };
    }

    function cerrarTodosLosPredictivos() {
        Object.values(controladoresPredictivos).forEach(ctrl => ctrl && ctrl.cerrar());
    }

    function filtrarRankeado(lista, matcherInicio, matcherIncluye, limite = 15) {
        const empiezanCon = lista.filter(matcherInicio);
        const contienen = lista.filter(item => !matcherInicio(item) && matcherIncluye(item));
        return [...empiezanCon, ...contienen].slice(0, limite);
    }

    async function buscarSugerenciasUbicacionBD(texto) {
        const filtro = (texto || "").trim();
        if (!filtro) return [];

        const clienteFiltro = obtenerClienteOficialValido(document.getElementById("nuevoCliente").value)
            || document.getElementById("nuevoCliente").value.trim();

        let query = _supabase
            .from('extintores')
            .select('ubicacion, cliente, extintor_numero')
            .ilike('ubicacion', `%${filtro}%`)
            .limit(30);

        if (clienteFiltro) {
            query = query.eq('cliente', clienteFiltro);
        }

        const { data, error } = await query;
        if (error) {
            console.error("Error al consultar ubicaciones:", error);
            return [];
        }

        const mapaUnicos = new Map();
        const lowerFiltro = filtro.toLowerCase();

        (data || []).forEach(row => {
            const ub = row.ubicacion ? String(row.ubicacion).trim() : "";
            if (!ub) return;
            const key = ub.toLowerCase();
            if (!mapaUnicos.has(key)) {
                mapaUnicos.set(key, {
                    ubicacion: ub,
                    cliente: row.cliente ? String(row.cliente).trim() : "",
                    extintor: row.extintor_numero ? String(row.extintor_numero).trim() : ""
                });
            }
        });

        return Array.from(mapaUnicos.values())
            .sort((a, b) => {
                const aStarts = a.ubicacion.toLowerCase().startsWith(lowerFiltro) ? 0 : 1;
                const bStarts = b.ubicacion.toLowerCase().startsWith(lowerFiltro) ? 0 : 1;
                if (aStarts !== bStarts) return aStarts - bStarts;
                return a.ubicacion.localeCompare(b.ubicacion, 'es');
            })
            .slice(0, 15);
    }

    function inicializarPredictivos() {
        configurarListaPredictiva({
            clave: "clientes",
            inputId: "nuevoCliente",
            listaId: "sugerenciasClientes",
            obtenerItems: (texto) => {
                const f = texto.toLowerCase();
                return filtrarRankeado(
                    listaClientesOficiales,
                    c => c.nombre.toLowerCase().startsWith(f),
                    c => c.nombre.toLowerCase().includes(f) || c.razon.toLowerCase().includes(f)
                );
            },
            renderItem: (c) => `${c.nombre}` + (c.razon ? ` <span class="sugerencia-sub">(${c.razon})</span>` : ""),
            alSeleccionar: (c) => {
                const input = document.getElementById("nuevoCliente");
                input.value = c.nombre;
                ultimaConsultaDuplicado = "";
                revisarEstadoCambiosMatafuegoCargado();
                verificarDuplicado();

                    item.cliente ? `Cliente: ${item.cliente}` : "",
                    item.extintor ? `Ext. #${item.extintor}` : ""
                ].filter(Boolean).join(" · ");
                return `${item.ubicacion}` + (detalle ? ` <span class="sugerencia-sub">(${detalle})</span>` : "");
            },
            alSeleccionar: async (item) => {
                document.getElementById("nuevoUbicacion").value = item.ubicacion;

                await buscarExtintor();

            alEnterSinLista: async (texto) => {

                revisarEstadoCambiosMatafuegoCargado();
                await buscarExtintor();
                return true;
            }
        });

    async function cargarListasGlobales() {
        const tamanoPagina = 1000;
        let desde = 0;
        const todos = [];

        while (true) {
            const { data, error } = await _supabase
                .from('extintores')
                .select('extintor_numero, numero_dps, marca')
                .range(desde, desde + tamanoPagina - 1);

            if (error || !data || data.length === 0) break;
            todos.push(...data);
            if (data.length < tamanoPagina) break;
            desde += tamanoPagina;
        }

        listaExtintoresExistentes = todos.map(item => String(item.extintor_numero).trim()).filter(Boolean);
        listaDpsExistentes = todos.map(item => String(item.numero_dps).trim()).filter(Boolean);

        const mapaMarcas = new Map();
        todos.forEach(item => {
            if (!item.marca) return;
            const m = String(item.marca).trim().toUpperCase();
            if (m && !mapaMarcas.has(m.toLowerCase())) {
                mapaMarcas.set(m.toLowerCase(), m);
            }
        });
        listaMarcasExistentes = Array.from(mapaMarcas.values()).sort((a, b) => a.localeCompare(b, 'es'));
    }

    function obtenerUltimoDiaDeFecha(valor) {
        if (!valor) return null;
        const limpio = String(valor).trim();

        if (/^\d{4}-\d{2}-\d{2}$/.test(limpio)) {
            const [anioStr, mesStr] = limpio.split("-");
            return new Date(parseInt(anioStr, 10), parseInt(mesStr, 10), 0);
        }

        const match = limpio.match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
        if (match) {
            return new Date(2000 + parseInt(match[2], 10), parseInt(match[1], 10), 0);
        }

        return null;
    }

        const anioCortoStr = String(ultimoDiaMes.getFullYear()).slice(-2);
        return `${mesStr}/${anioCortoStr}`;
    }

    }

    function formatearFechaSQL(fechaWeb) {
        if (!fechaWeb) return null;
        const partes = fechaWeb.trim().split("/");
        if (partes.length === 2) {
            const mes = partes[0].trim().padStart(2, '0');
            const anioCorto = partes[1].trim();
            if (anioCorto.length === 2 && !isNaN(mes) && !isNaN(anioCorto)) {
                const anioCompleto = 2000 + parseInt(anioCorto, 10);
                const ultimoDia = new Date(anioCompleto, parseInt(mes, 10), 0).getDate();
                return `${anioCompleto}-${mes}-${String(ultimoDia).padStart(2, '0')}`;
            }
        }
        return null;
    }

    async function buscarExtintor() {
        cerrarTodosLosPredictivos();

        const extintorNum = document.getElementById("nuevoExtintor").value.trim();
        const dpsNum = document.getElementById("nuevoDps").value.trim();
        const ubicacionTexto = document.getElementById("nuevoUbicacion").value.trim();
        const clienteFiltro = obtenerClienteOficialValido(document.getElementById("nuevoCliente").value)
            || document.getElementById("nuevoCliente").value.trim();

        if (!extintorNum && !dpsNum && !ubicacionTexto) {
            alert("Por favor, ingresá al menos un N° de Extintor, N° de DPS o Ubicación/Dominio para buscar.");
            return;
        }

        try {
            let query = _supabase.from('extintores').select('*');
            if (extintorNum) query = query.eq('extintor_numero', extintorNum);
            if (dpsNum) query = query.eq('numero_dps', dpsNum);
            if (ubicacionTexto) query = query.ilike('ubicacion', `%${ubicacionTexto}%`);
            if (clienteFiltro) query = query.eq('cliente', clienteFiltro);

            const { data, error } = await query;
            if (error) throw error;

            if (!data || data.length === 0) {
                alert("No se encontró ningún equipo con los datos indicados.");
                revisarEstadoCambiosMatafuegoCargado();
                return;
            }

            let registroACargar = data[0];

            if (data.length > 1) {
                let mensaje = "Se encontraron varios registros. Elegí uno:\n";
                data.forEach((item, index) => {
                    mensaje += `[${index + 1}] Cliente: ${item.cliente} | Ext: ${item.extintor_numero || '-'} | DPS: ${item.numero_dps || '-'} | Ubicación/Dominio: ${item.ubicacion || '-'}\n`;
                });
                const seleccion = prompt(mensaje + "\nIngresá el número de opción:");
                const idx = parseInt(seleccion, 10) - 1;
                if (isNaN(idx) || !data[idx]) {
                    alert("Selección inválida.");
                    return;
                }
                registroACargar = data[idx];
            }

            cargarDatosEnFormulario(registroACargar);
        } catch (err) {
            console.error("Error al buscar:", err);
            alert("Ocurrió un error al realizar la búsqueda.");
        }
    }

    async function verificarDuplicado() {
        if (guardandoEnCurso) return;

        const idActualCargado = document.getElementById("registroId").value.trim();
        const clienteActual = obtenerClienteOficialValido(document.getElementById("nuevoCliente").value)
            || document.getElementById("nuevoCliente").value.trim();
        const extintorNum = document.getElementById("nuevoExtintor").value.trim();
        const dpsNum = document.getElementById("nuevoDps").value.trim();

        if (!extintorNum && !dpsNum) {
            ocultarAvisoDuplicado();
            return;
        }

        const claveActual = `${idActualCargado}|${clienteActual}|${extintorNum}|${dpsNum}`;
        if (claveActual === ultimaConsultaDuplicado) return;
        ultimaConsultaDuplicado = claveActual;

        try {
            let query = _supabase.from('extintores').select('*');
            if (extintorNum && dpsNum) query = query.or(`extintor_numero.eq.${extintorNum},numero_dps.eq.${dpsNum}`);
            else if (extintorNum) query = query.eq('extintor_numero', extintorNum);
            else query = query.eq('numero_dps', dpsNum);

            const { data, error } = await query;
            if (error) throw error;

            if (guardandoEnCurso) return;
            if (
                document.getElementById("nuevoExtintor").value.trim() !== extintorNum ||
                document.getElementById("nuevoDps").value.trim() !== dpsNum
            ) {
                return;
            }

            if (!data || data.length === 0) {
                ocultarAvisoDuplicado();
                return;
            }

            if (idActualCargado) {
                const otroClienteMismoNumero = data.find(item =>
                    String(item.id) !== String(idActualCargado) &&
                    item.cliente &&
                    item.cliente !== clienteActual
                );
                if (otroClienteMismoNumero && clienteActual) {
                    mostrarAvisoDuplicado(`ℹ️ Aviso: Este número ya está registrado bajo el cliente "${otroClienteMismoNumero.cliente}". Podés guardarlo igual ya que es de otro cliente.`);
                } else {
                    ocultarAvisoDuplicado();
                }
                return;
            }

            const matchMismoCliente = data.find(item => item.cliente && item.cliente === clienteActual);

            if (matchMismoCliente && String(matchMismoCliente.id) !== String(idExtintorAReemplazar || "")) {
                ocultarAvisoDuplicado();
                cargarDatosEnFormulario(matchMismoCliente);
            } else if (clienteActual) {
                const otroCliente = data[0].cliente || "Otro cliente";
                document.getElementById("registroId").value = "";
                registroOriginalCargado = null;
                mostrarAvisoDuplicado(`ℹ️ Aviso: Este número ya está registrado bajo el cliente "${otroCliente}". Podés guardarlo igual ya que es de otro cliente.`);
                revisarEstadoCambiosMatafuegoCargado();
            } else {
                ocultarAvisoDuplicado();
            }
        } catch (err) {
            console.error("Error al verificar duplicado:", err);
        }
    }

    async function guardarOActualizar(opciones = {}) {
        if (guardandoEnCurso) return;

        const clienteIngresado = document.getElementById("nuevoCliente").value.trim();
        const cliente = obtenerClienteOficialValido(clienteIngresado);
        const extintorNumero = document.getElementById("nuevoExtintor").value.trim();
        const idExistente = document.getElementById("registroId").value.trim();
        const esAltaNueva = !idExistente;
        const esReemplazo = Boolean(idExtintorAReemplazar);

        if (!cliente || !extintorNumero) {
            alert("⚠️ Por favor, elegí un Cliente válido de la lista oficial y completá el N° de Extintor.");
            document.getElementById("nuevoCliente").focus();
            enModoRecarga = false;
            return;
        }

        document.getElementById("nuevoCliente").value = cliente;

        const valAnoFab = document.getElementById("nuevoAFabricacion").value;
        const valPuesto = document.getElementById("nuevoPuesto").value;

        const datosRegistro = {
            cliente: cliente,
            oblea: normalizarOblea(document.getElementById("nuevoOblea").value),
            extintor_numero: extintorNumero,
            tipo: document.getElementById("nuevoTipo").value.trim().toUpperCase(),
            agente_extintor: document.getElementById("nuevoAgente").value.trim().toUpperCase(),
            capacidad: document.getElementById("nuevoCapacidad").value.trim(),
            ano_fab: valAnoFab ? parseInt(valAnoFab, 10) : null,
            marca: document.getElementById("nuevoMarca").value.trim().toUpperCase(),
            vto_prueb_hidr: formatearFechaSQL(document.getElementById("nuevoVencPH").value),
            vto_carga: formatearFechaSQL(document.getElementById("nuevoVencCarga").value),
            numero_dps: document.getElementById("nuevoDps").value.trim(),
            identificacion_puesto: valPuesto ? parseInt(valPuesto, 10) : null,
            ubicacion: document.getElementById("nuevoUbicacion").value.trim()
        };

        guardandoEnCurso = true;

        try {
            let idAfectado = idExistente ? parseInt(idExistente, 10) : null;
            const eraRecarga = enModoRecarga;
            const accionHistorial = eraRecarga ? "RECARGA" : null;

            if (esReemplazo) {
                const snapshotAnterior = snapshotExtintorAReemplazar || {};
                const histElimRes = await registrarEnHistorialRevisiones(
                    idExtintorAReemplazar,
                    snapshotAnterior,
                    "ELIMINADO"
                );
                if (histElimRes.error) {
                    console.error("Error al registrar reemplazo en historial_revisiones:", histElimRes.error);
                    alert(`⚠️ Error al guardar en historial_revisiones el reemplazo: ${histElimRes.error.message || JSON.stringify(histElimRes.error)}`);
                }

                const { error: delError } = await _supabase
                    .from('extintores')
                    .delete()
                    .eq('id', idExtintorAReemplazar);

                if (delError) {
                    console.error("Error al eliminar extintor anterior en reemplazo:", delError);
                    alert("Hubo un error al eliminar el extintor anterior en la base de datos.");
                    return;
                }
            }

            const resultado = idExistente
                ? await _supabase.from('extintores').update(datosRegistro).eq('id', idExistente).select().single()
                : await _supabase.from('extintores').insert([datosRegistro]).select().single();

            if (resultado.error) {
                console.error("Error al guardar:", resultado.error);
                alert("Hubo un error al guardar el extintor en la base de datos.");
                return;
            }

            const registroGuardado = resultado.data
                ? { ...datosRegistro, ...resultado.data }
                : { ...datosRegistro, id: idAfectado };

            if (registroGuardado.id) {
                idAfectado = registroGuardado.id;
            }

            const debeRegistrarHistorial = !idExistente || eraRecarga || huboCambiosEnCampos(registroOriginalCargado, registroGuardado);

            if (debeRegistrarHistorial && idAfectado) {
                const histRes = await registrarEnHistorialRevisiones(idAfectado, registroGuardado, accionHistorial);
                if (histRes.error) {
                    console.error("Error al guardar en historial_revisiones:", histRes.error);
                    alert("⚠️ El extintor se guardó, pero hubo un error al registrar en historial_revisiones.");
                }
            }

            idExtintorAReemplazar = null;
            snapshotExtintorAReemplazar = null;
            enModoRecarga = false;
            await cargarListasGlobales();

            const btn = document.getElementById("btnGuardar");

            if (esAltaNueva && !opciones.mantenerEnPantalla) {
                limpiarFormulario();
                btn.innerHTML = "✅ ¡Grabado!";
                btn.classList.add("success");
                setTimeout(() => {
                    btn.classList.remove("success");
                    btn.innerHTML = "💾 Grabar";
                }, 1500);
                return;
            }

            document.getElementById("registroId").value = idAfectado || "";
            aplicarDatosEnInputs(registroGuardado);
            document.getElementById("nuevoExtintor").disabled = true;

            registroOriginalCargado = {};
            CAMPOS_HISTORIAL.forEach(campo => {
                registroOriginalCargado[campo] = registroGuardado[campo] ?? null;
            });

            ocultarAvisoDuplicado();
            verificarExtintorNuevo();
            verificarDpsNuevo();
            ultimaConsultaDuplicado = `${registroGuardado.id || ""}|${registroGuardado.cliente || ""}|${registroGuardado.extintor_numero || ""}|${registroGuardado.numero_dps || ""}`;

            activarEstilosModoExistente();
            btn.innerHTML = eraRecarga ? "⚡ ¡Recarga Guardada!" : "✅ ¡Grabado!";
            btn.classList.remove("existente-btn");
            btn.classList.add("success");

            setTimeout(() => {
                btn.classList.remove("success");
                activarEstilosModoExistente();
            }, 1500);
        } finally {
            guardandoEnCurso = false;
        }
    }

    function obtenerSnapshotParaHistorial() {
        if (registroOriginalCargado) {
            const copia = {};
            CAMPOS_HISTORIAL.forEach(campo => {
                copia[campo] = registroOriginalCargado[campo] ?? null;
            });
            return copia;
        }
        return leerValoresActuales();
    }

    async function eliminarExtintor() {
        const idExistente = document.getElementById("registroId").value;
        const extintorNum = document.getElementById("nuevoExtintor").value.trim();
        const cliente = document.getElementById("nuevoCliente").value;

        if (!idExistente) {
            alert("⚠️ Primero debés buscar y cargar un extintor en pantalla para poder eliminarlo.");
            return;
        }

        const confirmar = confirm(`¿Estás 100% seguro de que querés ELIMINAR el extintor N° ${extintorNum} del cliente "${cliente}" de la base de datos?\n\nEsta acción no se puede deshacer.`);
        if (!confirmar) return;

        try {
            const snapshotHistorial = obtenerSnapshotParaHistorial();
            const histRes = await registrarEnHistorialRevisiones(parseInt(idExistente, 10), snapshotHistorial, "ELIMINADO");
            if (histRes.error) {
                console.error("Error al registrar eliminación en historial_revisiones:", histRes.error);
            }

            const { error } = await _supabase
                .from('extintores')
                .delete()
                .eq('id', idExistente);

            if (error) throw error;

            await cargarListasGlobales();
            if (histRes.error) {
                alert("🗑️ El extintor fue eliminado de la base de datos, aunque hubo un aviso al registrar en el historial.");
            } else {
                alert("🗑️ El extintor fue eliminado y registrado en el historial correctamente.");
            }
            limpiarFormulario();
        } catch (err) {
            console.error("Error al eliminar:", err);
            alert("Ocurrió un error al intentar eliminar el registro.");
        }
    }

    function limpiarFormulario() {
        idExtintorAReemplazar = null;
        snapshotExtintorAReemplazar = null;
        document.getElementById("registroId").value = "";
        registroOriginalCargado = null;

        [
            "nuevoCliente", "nuevoDps", "nuevoOblea", "nuevoMarca",
            "nuevoTipo", "nuevoAgente", "nuevoCapacidad", "nuevoAFabricacion",
            "nuevoVencPH", "nuevoVencCarga", "nuevoPuesto", "nuevoUbicacion"
        ].forEach(id => {
            document.getElementById(id).value = "";
        });

        const inputExt = document.getElementById("nuevoExtintor");
        inputExt.value = "";
        inputExt.disabled = false;

        ultimaConsultaDuplicado = "";
        ocultarAvisoDuplicado();
        cerrarTodosLosPredictivos();

        enModoRecarga = false;
        const contenedor = document.getElementById("contenedorPrincipal");
        contenedor.classList.remove("modo-existente", "modo-recarga", "modo-sin-grabar");
        document.getElementById("tituloForm").textContent = "PANEL DE CONTROL DE EQUIPOS";

        const btn = document.getElementById("btnGuardar");
        btn.textContent = "💾 Grabar";
        btn.classList.remove("existente-btn", "success");

        verificarExtintorNuevo();
        verificarDpsNuevo();
    }
</script>
