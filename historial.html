<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - VIVATEC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 1550px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 12px;
            align-items: start;
            margin-bottom: 16px;
        }
        .col-compacta {
            grid-column: span 2;
        }
        .col-cliente {
            grid-column: span 4;
        }
        @media (max-width: 950px) {
            .col-compacta {
                grid-column: span 6;
            }
            .col-cliente {
                grid-column: span 12;
            }
        }
        @media (max-width: 560px) {
            .col-compacta,
            .col-cliente {
                grid-column: span 12;
            }
        }
        .campo-grupo {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #34495e;
            white-space: nowrap;
        }
        input[type="text"] {
            height: 34px;
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            width: 100%;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2980b9;
        }
        .fila-con-mas {
            display: flex;
            gap: 4px;
            align-items: center;
            position: relative;
        }
        .btn-mas {
            height: 34px;
            min-width: 32px;
            border: 1px solid #2980b9;
            background-color: #2980b9;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }
        .btn-mas:hover {
            background-color: #1f6391;
        }
        .extras-vertical {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 5px;
        }
        .extra-item {
            display: flex;
            gap: 4px;
            align-items: center;
            position: relative;
        }
        .btn-quitar {
            height: 32px;
            min-width: 30px;
            border: 1px solid #e74c3c;
            background-color: #fff;
            color: #e74c3c;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
        }
        .btn-quitar:hover {
            background-color: #e74c3c;
            color: #fff;
        }
        .sugerencias-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 36px;
            background: #fff;
            border: 1px solid #2980b9;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 30;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12);
            display: none;
        }
        .sugerencia-item {
            padding: 6px 9px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }
        .sugerencia-item:first-child {
            background-color: #ebf5fb;
            font-weight: bold;
        }
        .sugerencia-item:hover {
            background-color: #d6eaf8;
        }
        .acciones-filtro {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            height: 35px;
            padding: 0 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-buscar {
            background-color: #2980b9;
            color: #fff;
        }
        .btn-limpiar {
            background-color: #95a5a6;
            color: #fff;
        }
        .opcion-check {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 35px;
            padding: 0 12px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #34495e;
            user-select: none;
        }
        .opcion-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
        }
        .estadisticas-bar {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stat-card {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 5px;
            border: 1px solid #d5dce4;
            background-color: #f8fafc;
            font-size: 12px;
            color: #2c3e50;
        }
        .stat-card strong {
            font-size: 14px;
            color: #1f4e78;
        }
        .stat-card.stat-gris strong {
            color: #495057;
        }
        .estado-info {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
        }
        .tabla-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #dce1e7;
            padding: 7px 9px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background-color: #2c3e50;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9fbfd;
        }
        .fila-inicial {
            background-color: #f8f9fa;
        }
        .fila-sin-cambios td {
            background-color: #e9ecef !important;
            color: #495057 !important;
        }
        .fila-eliminada td {
            background-color: #f8d7da !important;
            color: #721c24 !important;
        }
        .celda-cambio {
            background-color: #d4edda !important;
            color: #155724 !important;
            font-weight: bold;
        }
        .badge-nuevo {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 3px;
            background-color: #d4edda;
            color: #155724;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 0.3px;
            vertical-align: middle;
        }
        .badge-sin-cambios {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 3px;
            background-color: #ced4da;
            color: #343a40;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 0.3px;
            vertical-align: middle;
        }
        .badge-eliminado {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 3px;
            background-color: #e2a8ae;
            color: #611219;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 0.3px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="menu-compartido"></div>

        <h1>Historial de Revisiones</h1>

        <div class="filtros-grid">
            <div class="campo-grupo col-cliente">
                <label for="clientePrincipal">Clientes</label>
                <div class="fila-con-mas">
                    <input type="text" id="clientePrincipal" class="input-cliente" autocomplete="off">
                    <button type="button" id="btnMasCliente" class="btn-mas" title="Agregar otro cliente">+</button>
                    <div class="sugerencias-lista"></div>
                </div>
                <div id="clientesExtras" class="extras-vertical"></div>
            </div>

            <div class="campo-grupo col-compacta">
                <label for="fechaDesde">Desde (dd/mm/aaaa)</label>
                <input type="text" id="fechaDesde" class="input-fecha-ddmmaaaa" inputmode="numeric" maxlength="10" autocomplete="off">
            </div>

            <div class="campo-grupo col-compacta">
                <label for="fechaHasta">Hasta (dd/mm/aaaa)</label>
                <input type="text" id="fechaHasta" class="input-fecha-ddmmaaaa" inputmode="numeric" maxlength="10" autocomplete="off">
            </div>

            <div class="campo-grupo col-compacta">
                <label for="extintorPrincipal">N° Extintor</label>
                <div class="fila-con-mas">
                    <input type="text" id="extintorPrincipal" class="input-extintor" autocomplete="off">
                    <button type="button" id="btnMasExtintor" class="btn-mas" title="Agregar otro N° de Extintor">+</button>
                </div>
                <div id="extintoresExtras" class="extras-vertical"></div>
            </div>

            <div class="campo-grupo col-compacta">
                <label for="dpsPrincipal">N° DPS</label>
                <div class="fila-con-mas">
                    <input type="text" id="dpsPrincipal" class="input-dps" autocomplete="off">
                    <button type="button" id="btnMasDps" class="btn-mas" title="Agregar otro N° DPS">+</button>
                </div>
                <div id="dpsExtras" class="extras-vertical"></div>
            </div>
        </div>

        <div class="acciones-filtro">
            <button type="button" id="btnFiltrar" class="btn btn-buscar">Buscar</button>
            <button type="button" id="btnLimpiar" class="btn btn-limpiar">Limpiar filtros</button>
            <label class="opcion-check" for="chkIncluirSinCambios">
                <input type="checkbox" id="chkIncluirSinCambios">
                Incluir extintores sin cambios
            </label>
        </div>

        <div id="panelEstadisticas" class="estadisticas-bar">
            <div class="stat-card">
                <span>Extintores con cambios DPS:</span>
                <strong id="statCambioDps">0</strong>
            </div>
            <div class="stat-card">
                <span>Extintores cambio fecha PH:</span>
                <strong id="statCambioPh">0</strong>
            </div>
            <div class="stat-card stat-gris">
                <span>Extintores sin cambios:</span>
                <strong id="statSinCambios">0</strong>
            </div>
        </div>

        <div id="estadoConsulta" class="estado-info">Preparando consulta...</div>

        <div class="tabla-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>N° Extintor</th>
                        <th>N° DPS</th>
                        <th>Oblea</th>
                        <th>Marca</th>
                        <th>Tipo</th>
                        <th>Agente Extintor</th>
                        <th>Capacidad</th>
                        <th>Año Fab.</th>
                        <th>Vto. Prueba Hidr.</th>
                        <th>Vto. Carga</th>
                        <th>Puesto</th>
                        <th>Ubicación</th>
                    </tr>
                </thead>
                <tbody id="cuerpoHistorial"></tbody>
            </table>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let seriesPorExtintor = [];
        let extintoresActivosSinHistorial = [];
        let listaClientesUnicos = [];
        let huboBusquedaActiva = false;

        const CAMPOS_COMPARABLES = [
            "cliente",
            "extintor_numero",
            "numero_dps",
            "oblea",
            "marca",
            "tipo",
            "agente_extintor",
            "capacidad",
            "ano_fab",
            "vto_prueb_hidr",
            "vto_carga",
            "identificacion_puesto",
            "ubicacion"
        ];

        function obtenerValorFechaCruda(reg) {
            return reg.fecha_revision || reg.fecha || reg.fecha_movimiento || reg.fecha_registro || null;
        }

        function convertirFechaAObjeto(valorFecha) {
            if (!valorFecha) return null;
            if (valorFecha instanceof Date) {
                return isNaN(valorFecha.getTime()) ? null : valorFecha;
            }
            const str = String(valorFecha).trim();

            const matchISO = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
            if (matchISO) {
                const a = parseInt(matchISO[1], 10);
                const m = parseInt(matchISO[2], 10) - 1;
                const d = parseInt(matchISO[3], 10);
                const dt = new Date(a, m, d, 0, 0, 0, 0);
                return isNaN(dt.getTime()) ? null : dt;
            }

            const matchDDMM = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str);
            if (matchDDMM) {
                const d = parseInt(matchDDMM[1], 10);
                const m = parseInt(matchDDMM[2], 10) - 1;
                const a = parseInt(matchDDMM[3], 10);
                const dt = new Date(a, m, d, 0, 0, 0, 0);
                return isNaN(dt.getTime()) ? null : dt;
            }

            const isoNormalizado = str.replace(" ", "T");
            const dt = new Date(isoNormalizado);
            return isNaN(dt.getTime()) ? null : dt;
        }

        function formatearFechaDDMMAAAA(valorFecha) {
            if (valorFecha === null || valorFecha === undefined || String(valorFecha).trim() === "") {
                return "-";
            }
            const fecha = convertirFechaAObjeto(valorFecha);
            if (!fecha) return String(valorFecha);

            const dia = String(fecha.getDate()).padStart(2, "0");
            const mes = String(fecha.getMonth() + 1).padStart(2, "0");
            const anio = fecha.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }

        function formatearFechaHoraDDMMAAAA(valorFecha) {
            if (valorFecha === null || valorFecha === undefined || String(valorFecha).trim() === "") {
                return "-";
            }
            const fecha = convertirFechaAObjeto(valorFecha);
            if (!fecha) return String(valorFecha);

            const dia = String(fecha.getDate()).padStart(2, "0");
            const mes = String(fecha.getMonth() + 1).padStart(2, "0");
            const anio = fecha.getFullYear();
            const horas = String(fecha.getHours()).padStart(2, "0");
            const minutos = String(fecha.getMinutes()).padStart(2, "0");
            return `${dia}/${mes}/${anio} ${horas}:${minutos}`;
        }

        function aplicarMascaraFecha(input) {
            input.addEventListener("input", function() {
                let soloDigitos = this.value.replace(/\D/g, "").slice(0, 8);
                let formateada = "";

                if (soloDigitos.length > 0) {
                    formateada = soloDigitos.slice(0, 2);
                }
                if (soloDigitos.length >= 3) {
                    formateada += "/" + soloDigitos.slice(2, 4);
                }
                if (soloDigitos.length >= 5) {
                    formateada += "/" + soloDigitos.slice(4, 8);
                }

                this.value = formateada;
            });
        }

        function parsearFechaDDMMAAAA(texto, finDeDia = false) {
            const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto.trim());
            if (!match) return null;

            const dia = parseInt(match[1], 10);
            const mes = parseInt(match[2], 10) - 1;
            const anio = parseInt(match[3], 10);

            const fecha = finDeDia
                ? new Date(anio, mes, dia, 23, 59, 59, 999)
                : new Date(anio, mes, dia, 0, 0, 0, 0);

            if (
                fecha.getFullYear() !== anio ||
                fecha.getMonth() !== mes ||
                fecha.getDate() !== dia
            ) {
                return null;
            }
            return fecha;
        }

        function configurarPredictivoCliente(input, contenedorLista) {
            let sugerenciasActuales = [];

            function mostrarSugerencias() {
                const texto = input.value.trim().toLowerCase();
                contenedorLista.innerHTML = "";

                if (!texto) {
                    sugerenciasActuales = [];
                    contenedorLista.style.display = "none";
                    return;
                }

                sugerenciasActuales = listaClientesUnicos.filter(c =>
                    c.toLowerCase().includes(texto)
                );

                if (sugerenciasActuales.length === 0) {
                    contenedorLista.style.display = "none";
                    return;
                }

                sugerenciasActuales.forEach(cli => {
                    const item = document.createElement("div");
                    item.className = "sugerencia-item";
                    item.textContent = cli;
                    item.addEventListener("mousedown", function(e) {
                        e.preventDefault();
                        input.value = cli;
                        contenedorLista.style.display = "none";
                    });
                    contenedorLista.appendChild(item);
                });

                contenedorLista.style.display = "block";
            }

            input.addEventListener("input", mostrarSugerencias);
            input.addEventListener("focus", mostrarSugerencias);

            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    if (sugerenciasActuales.length > 0 && contenedorLista.style.display === "block") {
                        input.value = sugerenciasActuales[0];
                        contenedorLista.style.display = "none";
                    } else {
                        aplicarFiltros();
                    }
                } else if (e.key === "Escape") {
                    contenedorLista.style.display = "none";
                }
            });

            input.addEventListener("blur", function() {
                setTimeout(() => {
                    contenedorLista.style.display = "none";
                }, 150);
            });
        }

        function agregarCuadritoExtra(contenedorId, claseInput, conPredictivo = false) {
            const contenedor = document.getElementById(contenedorId);
            const fila = document.createElement("div");
            fila.className = "extra-item";

            const input = document.createElement("input");
            input.type = "text";
            input.className = claseInput;
            input.autocomplete = "off";

            const btnQuitar = document.createElement("button");
            btnQuitar.type = "button";
            btnQuitar.className = "btn-quitar";
            btnQuitar.textContent = "×";
            btnQuitar.title = "Quitar";
            btnQuitar.addEventListener("click", function() {
                fila.remove();
            });

            fila.appendChild(input);
            fila.appendChild(btnQuitar);

            if (conPredictivo) {
                const listaDiv = document.createElement("div");
                listaDiv.className = "sugerencias-lista";
                fila.appendChild(listaDiv);
                configurarPredictivoCliente(input, listaDiv);
            } else {
                input.addEventListener("keydown", function(e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        aplicarFiltros();
                    }
                });
            }

            contenedor.appendChild(fila);
            input.focus();
        }

        function obtenerValoresMultiples(selector) {
            const valores = [];
            document.querySelectorAll(selector).forEach(inp => {
                const limpio = inp.value.trim().toLowerCase();
                if (limpio !== "") {
                    valores.push(limpio);
                }
            });
            return valores;
        }

        function textoLimpio(valor) {
            if (valor === null || valor === undefined || String(valor).trim() === "") {
                return "-";
            }
            return String(valor).trim();
        }

        function esRegistroEliminado(reg) {
            const accion = String(reg.accion || reg.estado_movimiento || reg.tipo_movimiento || "").trim().toUpperCase();
            return accion === "ELIMINADO" || accion === "BAJA";
        }

        function valorNormalizadoCampo(reg, campo) {
            if (campo === "cliente") {
                return textoLimpio(reg.cliente || reg.nombre_cliente || reg.razon_social);
            }
            if (campo === "extintor_numero") {
                return textoLimpio(reg.extintor_numero || reg.numero_extintor || reg.nro_extintor || reg.extintor);
            }
            if (campo === "numero_dps") {
                return textoLimpio(reg.numero_dps || reg.dps);
            }
            if (campo === "identificacion_puesto") {
                return textoLimpio(reg.identificacion_puesto ?? reg.puesto);
            }
            if (campo === "ubicacion") {
                return textoLimpio(reg.ubicacion);
            }
            if (campo === "vto_prueb_hidr" || campo === "vto_carga") {
                return formatearFechaDDMMAAAA(reg[campo]);
            }
            return textoLimpio(reg[campo]);
        }

        function claveNaturalExtintor(reg) {
            const ext = valorNormalizadoCampo(reg, "extintor_numero");
            const cli = valorNormalizadoCampo(reg, "cliente").toLowerCase();
            if (ext !== "-") {
                return "ext:" + cli + "|" + ext.toLowerCase();
            }
            return null;
        }

        function claveAgrupacionExtintor(reg) {
            if (reg.extintor_id !== undefined && reg.extintor_id !== null && String(reg.extintor_id).trim() !== "") {
                return "id:" + String(reg.extintor_id).trim();
            }
            const claveNat = claveNaturalExtintor(reg);
            if (claveNat) return claveNat;
            return "reg:" + String(reg.id || Math.random());
        }

        function construirSeriesCronologicas(registrosHistorial, registrosExtintores) {
            const grupos = new Map();
            const idsConHistorial = new Set();
            const clavesNaturalesConHistorial = new Set();

            registrosHistorial.forEach((reg, idx) => {
                if (reg.extintor_id !== undefined && reg.extintor_id !== null && String(reg.extintor_id).trim() !== "") {
                    idsConHistorial.add(String(reg.extintor_id).trim());
                }
                const cNat = claveNaturalExtintor(reg);
                if (cNat) clavesNaturalesConHistorial.add(cNat);

                const clave = claveAgrupacionExtintor(reg);
                if (!grupos.has(clave)) {
                    grupos.set(clave, []);
                }
                grupos.get(clave).push({
                    reg,
                    idxOriginal: idx,
                    fechaObj: convertirFechaAObjeto(obtenerValorFechaCruda(reg))
                });
            });

            const series = [];

            grupos.forEach(listaItems => {
                listaItems.sort((a, b) => {
                    const ta = a.fechaObj ? a.fechaObj.getTime() : 0;
                    const tb = b.fechaObj ? b.fechaObj.getTime() : 0;
                    if (ta !== tb) return ta - tb;
                    return a.idxOriginal - b.idxOriginal;
                });

                const eventos = [];

                listaItems.forEach((item, pos) => {
                    const regActual = item.reg;
                    const eliminado = esRegistroEliminado(regActual);

                    if (pos === 0) {
                        eventos.push({
                            registro: regActual,
                            esInicial: !eliminado,
                            esNuevo: !eliminado,
                            esEliminado: eliminado,
                            esCambio: false,
                            camposCambiados: new Set(),
                            fechaObj: item.fechaObj,
                            idxOriginal: item.idxOriginal
                        });
                    } else {
                        const regAnterior = listaItems[pos - 1].reg;
                        const cambiados = new Set();

                        CAMPOS_COMPARABLES.forEach(campo => {
                            const valAnt = valorNormalizadoCampo(regAnterior, campo);
                            const valAct = valorNormalizadoCampo(regActual, campo);
                            if (valAnt !== valAct) {
                                cambiados.add(campo);
                            }
                        });

                        if (eliminado || cambiados.size > 0) {
                            eventos.push({
                                registro: regActual,
                                esInicial: false,
                                esNuevo: false,
                                esEliminado: eliminado,
                                esCambio: !eliminado && cambiados.size > 0,
                                camposCambiados: cambiados,
                                fechaObj: item.fechaObj,
                                idxOriginal: item.idxOriginal
                            });
                        }
                    }
                });

                if (eventos.length > 0) {
                    const ultimoEv = eventos[eventos.length - 1];
                    const tuvoCambiosOEliminacion = eventos.some(ev => ev.esCambio || ev.esEliminado);

                    series.push({
                        eventos,
                        tuvoCambiosOEliminacion,
                        registroReferencia: ultimoEv.registro,
                        fechaUltimaObj: ultimoEv.fechaObj,
                        idxUltimaOriginal: ultimoEv.idxOriginal
                    });
                }
            });

            series.sort((a, b) => {
                const ta = a.fechaUltimaObj ? a.fechaUltimaObj.getTime() : 0;
                const tb = b.fechaUltimaObj ? b.fechaUltimaObj.getTime() : 0;
                if (tb !== ta) return tb - ta;
                return b.idxUltimaOriginal - a.idxUltimaOriginal;
            });

            // Extintores cargados en la tabla maestra que nunca tuvieron registros en historial_revisiones
            const sinHist = [];
            (registrosExtintores || []).forEach(ex => {
                const idStr = ex.id !== undefined && ex.id !== null ? String(ex.id).trim() : "";
                const cNat = claveNaturalExtintor(ex);

                if (idStr && idsConHistorial.has(idStr)) return;
                if (cNat && clavesNaturalesConHistorial.has(cNat)) return;

                sinHist.push(ex);
            });

            sinHist.sort((a, b) => {
                const cliA = valorNormalizadoCampo(a, "cliente");
                const cliB = valorNormalizadoCampo(b, "cliente");
                const cmpCli = cliA.localeCompare(cliB);
                if (cmpCli !== 0) return cmpCli;
                return valorNormalizadoCampo(a, "extintor_numero").localeCompare(
                    valorNormalizadoCampo(b, "extintor_numero"),
                    undefined,
                    { numeric: true }
                );
            });

            extintoresActivosSinHistorial = sinHist;
            return series;
        }

        function dentroDeRangoFecha(fechaObj, fechaDesde, fechaHasta) {
            if (!fechaDesde && !fechaHasta) return true;
            if (!fechaObj) return false;
            const t = fechaObj.getTime();
            if (fechaDesde && t < fechaDesde.getTime()) return false;
            if (fechaHasta && t > fechaHasta.getTime()) return false;
            return true;
        }

        function obtenerBloqueParaSerie(serie, fechaDesde, fechaHasta, incluirSinCambios) {
            const tieneRangoFecha = Boolean(fechaDesde || fechaHasta);

            if (!tieneRangoFecha) {
                if (!serie.tuvoCambiosOEliminacion) {
                    if (!incluirSinCambios) return null;

                    const evUnico = serie.eventos[0];
                    return {
                        esSinCambios: true,
                        cambioDps: false,
                        cambioPh: false,
                        filas: [{
                            registro: evUnico.registro,
                            esInicial: true,
                            esNuevo: evUnico.esNuevo,
                            esEliminado: false,
                            esSinCambios: true,
                            esReferenciaPrevia: false,
                            camposCambiados: new Set()
                        }]
                    };
                }

                let cambioDps = false;
                let cambioPh = false;
                serie.eventos.forEach(ev => {
                    if (ev.esCambio && ev.camposCambiados.has("numero_dps")) cambioDps = true;
                    if (ev.esCambio && ev.camposCambiados.has("vto_prueb_hidr")) cambioPh = true;
                });

                return {
                    esSinCambios: false,
                    cambioDps,
                    cambioPh,
                    filas: serie.eventos.map(ev => ({
                        registro: ev.registro,
                        esInicial: ev.esInicial,
                        esNuevo: ev.esNuevo,
                        esEliminado: ev.esEliminado,
                        esSinCambios: false,
                        esReferenciaPrevia: false,
                        camposCambiados: ev.camposCambiados
                    }))
                };
            }

            const indicesEnRango = [];
            serie.eventos.forEach((ev, idx) => {
                if (dentroDeRangoFecha(ev.fechaObj, fechaDesde, fechaHasta)) {
                    indicesEnRango.push(idx);
                }
            });

            const indicesRelevantes = indicesEnRango.filter(idx => {
                const ev = serie.eventos[idx];
                return ev.esCambio || ev.esEliminado;
            });

            if (indicesRelevantes.length === 0) {
                if (!incluirSinCambios) return null;

                let ultimoEvHastaRango = null;
                serie.eventos.forEach(ev => {
                    if (!fechaHasta || (ev.fechaObj && ev.fechaObj.getTime() <= fechaHasta.getTime())) {
                        ultimoEvHastaRango = ev;
                    }
                });

                if (!ultimoEvHastaRango || ultimoEvHastaRango.esEliminado) return null;

                return {
                    esSinCambios: true,
                    cambioDps: false,
                    cambioPh: false,
                    filas: [{
                        registro: ultimoEvHastaRango.registro,
                        esInicial: true,
                        esNuevo: false,
                        esEliminado: false,
                        esSinCambios: true,
                        esReferenciaPrevia: false,
                        camposCambiados: new Set()
                    }]
                };
            }

            const primerIdxRelevante = indicesRelevantes[0];
            const filasResultantes = [];

            if (primerIdxRelevante > 0) {
                const evPrevio = serie.eventos[primerIdxRelevante - 1];
                filasResultantes.push({
                    registro: evPrevio.registro,
                    esInicial: false,
                    esNuevo: false,
                    esEliminado: false,
                    esSinCambios: false,
                    esReferenciaPrevia: true,
                    camposCambiados: new Set()
                });
            }

            let cambioDps = false;
            let cambioPh = false;

            indicesRelevantes.forEach(idx => {
                const ev = serie.eventos[idx];
                if (ev.esCambio && ev.camposCambiados.has("numero_dps")) cambioDps = true;
                if (ev.esCambio && ev.camposCambiados.has("vto_prueb_hidr")) cambioPh = true;

                filasResultantes.push({
                    registro: ev.registro,
                    esInicial: false,
                    esNuevo: false,
                    esEliminado: ev.esEliminado,
                    esSinCambios: false,
                    esReferenciaPrevia: false,
                    camposCambiados: ev.camposCambiados
                });
            });

            return {
                esSinCambios: false,
                cambioDps,
                cambioPh,
                filas: filasResultantes
            };
        }

        async function cargarClientesDesdeTabla() {
            const { data, error } = await _supabase
                .from("clientes")
                .select("*")
                .limit(5000);

            if (error || !Array.isArray(data)) {
                listaClientesUnicos = [];
                return;
            }

            const setCli = new Set();
            data.forEach(cli => {
                const nombre = (
                    cli.cliente ||
                    cli.nombre ||
                    cli.nombre_cliente ||
                    cli.razon_social ||
                    ""
                ).trim();
                if (nombre) setCli.add(nombre);
            });

            listaClientesUnicos = Array.from(setCli).sort((a, b) => a.localeCompare(b));
        }

        async function cargarDatosIniciales() {
            const estado = document.getElementById("estadoConsulta");
            estado.textContent = "Cargando datos...";

            await cargarClientesDesdeTabla();

            const [resHist, resExt] = await Promise.all([
                _supabase.from("historial_revisiones").select("*").limit(5000),
                _supabase.from("extintores").select("*").limit(10000)
            ]);

            if (resHist.error) {
                estado.textContent = "Error al cargar historial: " + resHist.error.message;
                return;
            }

            seriesPorExtintor = construirSeriesCronologicas(resHist.data || [], resExt.data || []);
            estado.textContent = "Completá los filtros deseados (o dejalos vacíos para ver todos) y presioná Buscar.";
        }

        function actualizarEstadisticas(bloques) {
            const panel = document.getElementById("panelEstadisticas");
            let cantCambioDps = 0;
            let cantCambioPh = 0;
            let cantSinCambios = 0;

            bloques.forEach(b => {
                if (b.cambioDps) cantCambioDps++;
                if (b.cambioPh) cantCambioPh++;
                if (b.esSinCambios) cantSinCambios++;
            });

            document.getElementById("statCambioDps").textContent = cantCambioDps;
            document.getElementById("statCambioPh").textContent = cantCambioPh;
            document.getElementById("statSinCambios").textContent = cantSinCambios;
            panel.style.display = "flex";
        }

        function cumpleFiltrosTexto(reg, clientesFiltro, extintoresFiltro, dpsFiltro) {
            const clienteReg = valorNormalizadoCampo(reg, "cliente").toLowerCase();
            const extReg = valorNormalizadoCampo(reg, "extintor_numero").toLowerCase();
            const dpsReg = valorNormalizadoCampo(reg, "numero_dps").toLowerCase();

            if (clientesFiltro.length > 0 && !clientesFiltro.some(c => clienteReg.includes(c))) {
                return false;
            }
            if (extintoresFiltro.length > 0 && !extintoresFiltro.some(e => extReg.includes(e))) {
                return false;
            }
            if (dpsFiltro.length > 0 && !dpsFiltro.some(d => dpsReg.includes(d))) {
                return false;
            }
            return true;
        }

        function aplicarFiltros() {
            const clientesFiltro = obtenerValoresMultiples(".input-cliente");
            const desdeTexto = document.getElementById("fechaDesde").value.trim();
            const hastaTexto = document.getElementById("fechaHasta").value.trim();
            const extintoresFiltro = obtenerValoresMultiples(".input-extintor");
            const dpsFiltro = obtenerValoresMultiples(".input-dps");
            const incluirSinCambios = document.getElementById("chkIncluirSinCambios").checked;
            const estado = document.getElementById("estadoConsulta");

            if (desdeTexto !== "" && desdeTexto.length < 10) {
                estado.textContent = "Completá la fecha 'Desde' en formato dd/mm/aaaa.";
                return;
            }
            if (hastaTexto !== "" && hastaTexto.length < 10) {
                estado.textContent = "Completá la fecha 'Hasta' en formato dd/mm/aaaa.";
                return;
            }

            const fechaDesde = desdeTexto ? parsearFechaDDMMAAAA(desdeTexto, false) : null;
            const fechaHasta = hastaTexto ? parsearFechaDDMMAAAA(hastaTexto, true) : null;

            if (desdeTexto !== "" && !fechaDesde) {
                estado.textContent = "La fecha 'Desde' no es válida (usá dd/mm/aaaa).";
                return;
            }
            if (hastaTexto !== "" && !fechaHasta) {
                estado.textContent = "La fecha 'Hasta' no es válida (usá dd/mm/aaaa).";
                return;
            }

            huboBusquedaActiva = true;
            const bloquesFiltrados = [];

            seriesPorExtintor.forEach(serie => {
                if (!cumpleFiltrosTexto(serie.registroReferencia, clientesFiltro, extintoresFiltro, dpsFiltro)) {
                    return;
                }

                const bloque = obtenerBloqueParaSerie(serie, fechaDesde, fechaHasta, incluirSinCambios);
                if (bloque && bloque.filas.length > 0) {
                    bloquesFiltrados.push(bloque);
                }
            });

            // Si está tildado "Incluir extintores sin cambios", sumar también los de la tabla extintores sin movimientos en historial
            if (incluirSinCambios) {
                extintoresActivosSinHistorial.forEach(ex => {
                    if (!cumpleFiltrosTexto(ex, clientesFiltro, extintoresFiltro, dpsFiltro)) {
                        return;
                    }

                    bloquesFiltrados.push({
                        esSinCambios: true,
                        cambioDps: false,
                        cambioPh: false,
                        filas: [{
                            registro: ex,
                            esInicial: true,
                            esNuevo: false,
                            esEliminado: false,
                            esSinCambios: true,
                            esReferenciaPrevia: false,
                            camposCambiados: new Set()
                        }]
                    });
                });
            }

            actualizarEstadisticas(bloquesFiltrados);
            renderizarTabla(bloquesFiltrados);
            const totalFilas = bloquesFiltrados.reduce((acc, b) => acc + b.filas.length, 0);
            estado.textContent = `Mostrando ${totalFilas} filas en ${bloquesFiltrados.length} equipos.`;
        }

        function armarCeldasFila(filaInfo) {
            const reg = filaInfo.registro;
            const camposResaltados = filaInfo.camposCambiados || new Set();
            const fechaTexto = formatearFechaHoraDDMMAAAA(obtenerValorFechaCruda(reg));

            let badge = "";
            if (filaInfo.esEliminado) {
                badge = `<span class="badge-eliminado">ELIMINADO</span>`;
            } else if (filaInfo.esSinCambios) {
                badge = `<span class="badge-sin-cambios">SIN CAMBIOS</span>`;
            } else if (filaInfo.esNuevo) {
                badge = `<span class="badge-nuevo">NUEVO</span>`;
            }

            const columnas = [
                { key: "fecha", html: `${fechaTexto}${badge}`, resaltable: false },
                { key: "cliente", html: valorNormalizadoCampo(reg, "cliente"), resaltable: true },
                { key: "extintor_numero", html: valorNormalizadoCampo(reg, "extintor_numero"), resaltable: true },
                { key: "numero_dps", html: valorNormalizadoCampo(reg, "numero_dps"), resaltable: true },
                { key: "oblea", html: valorNormalizadoCampo(reg, "oblea"), resaltable: true },
                { key: "marca", html: valorNormalizadoCampo(reg, "marca"), resaltable: true },
                { key: "tipo", html: valorNormalizadoCampo(reg, "tipo"), resaltable: true },
                { key: "agente_extintor", html: valorNormalizadoCampo(reg, "agente_extintor"), resaltable: true },
                { key: "capacidad", html: valorNormalizadoCampo(reg, "capacidad"), resaltable: true },
                { key: "ano_fab", html: valorNormalizadoCampo(reg, "ano_fab"), resaltable: true },
                { key: "vto_prueb_hidr", html: valorNormalizadoCampo(reg, "vto_prueb_hidr"), resaltable: true },
                { key: "vto_carga", html: valorNormalizadoCampo(reg, "vto_carga"), resaltable: true },
                { key: "identificacion_puesto", html: valorNormalizadoCampo(reg, "identificacion_puesto"), resaltable: true },
                { key: "ubicacion", html: valorNormalizadoCampo(reg, "ubicacion"), resaltable: true }
            ];

            return columnas.map(col => {
                const debePintar = !filaInfo.esEliminado && !filaInfo.esSinCambios && col.resaltable && camposResaltados.has(col.key);
                const clase = debePintar ? ` class="celda-cambio"` : "";
                return `<td${clase}>${col.html}</td>`;
            }).join("");
        }

        function renderizarTabla(bloques) {
            const tbody = document.getElementById("cuerpoHistorial");
            tbody.innerHTML = "";

            if (bloques.length === 0) {
                tbody.innerHTML = `<tr><td colspan="14">No hay movimientos que coincidan con los filtros.</td></tr>`;
                return;
            }

            bloques.forEach(bloque => {
                bloque.filas.forEach(filaInfo => {
                    const tr = document.createElement("tr");
                    if (filaInfo.esEliminado) {
                        tr.className = "fila-eliminada";
                    } else if (filaInfo.esSinCambios) {
                        tr.className = "fila-sin-cambios";
                    } else if (filaInfo.esInicial || filaInfo.esReferenciaPrevia) {
                        tr.className = "fila-inicial";
                    }
                    tr.innerHTML = armarCeldasFila(filaInfo);
                    tbody.appendChild(tr);
                });
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".input-fecha-ddmmaaaa").forEach(aplicarMascaraFecha);

            const cliPrincipal = document.getElementById("clientePrincipal");
            const listaPrincipal = cliPrincipal.parentElement.querySelector(".sugerencias-lista");
            configurarPredictivoCliente(cliPrincipal, listaPrincipal);

            document.getElementById("btnMasCliente").addEventListener("click", function() {
                agregarCuadritoExtra("clientesExtras", "input-cliente", true);
            });
            document.getElementById("btnMasExtintor").addEventListener("click", function() {
                agregarCuadritoExtra("extintoresExtras", "input-extintor", false);
            });
            document.getElementById("btnMasDps").addEventListener("click", function() {
                agregarCuadritoExtra("dpsExtras", "input-dps", false);
            });

            document.getElementById("btnFiltrar").addEventListener("click", aplicarFiltros);

            document.getElementById("chkIncluirSinCambios").addEventListener("change", function() {
                if (huboBusquedaActiva) {
                    aplicarFiltros();
                }
            });

            ["fechaDesde", "fechaHasta", "extintorPrincipal", "dpsPrincipal"].forEach(id => {
                document.getElementById(id).addEventListener("keydown", function(e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        aplicarFiltros();
                    }
                });
            });

            document.getElementById("btnLimpiar").addEventListener("click", function() {
                huboBusquedaActiva = false;
                document.getElementById("clientePrincipal").value = "";
                document.getElementById("fechaDesde").value = "";
                document.getElementById("fechaHasta").value = "";
                document.getElementById("extintorPrincipal").value = "";
                document.getElementById("dpsPrincipal").value = "";
                document.getElementById("chkIncluirSinCambios").checked = false;
                document.getElementById("clientesExtras").innerHTML = "";
                document.getElementById("extintoresExtras").innerHTML = "";
                document.getElementById("dpsExtras").innerHTML = "";
                document.getElementById("cuerpoHistorial").innerHTML = "";
                document.getElementById("panelEstadisticas").style.display = "none";
                document.getElementById("estadoConsulta").textContent = "Filtros limpios. Presioná Buscar para consultar.";
            });

            cargarDatosIniciales();
        });
    </script>
