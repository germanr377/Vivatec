<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - VIVATEC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            align-items: start;
            margin-bottom: 16px;
        }
        .campo-grupo {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        input[type="text"] {
            height: 36px;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2980b9;
        }
        .proveedor-fila-principal {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-mas-proveedor {
            height: 36px;
            min-width: 36px;
            border: 1px solid #2980b9;
            background-color: #2980b9;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
        }
        .btn-mas-proveedor:hover {
            background-color: #1f6391;
        }
        .proveedores-extras-vertical {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }
        .extra-proveedor-item {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-quitar-proveedor {
            height: 34px;
            min-width: 34px;
            border: 1px solid #e74c3c;
            background-color: #fff;
            color: #e74c3c;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-quitar-proveedor:hover {
            background-color: #e74c3c;
            color: #fff;
        }
        .acciones-filtro {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .btn {
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-buscar {
            background-color: #2980b9;
            color: #fff;
        }
        .btn-limpiar {
            background-color: #95a5a6;
            color: #fff;
        }
        .estado-info {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
        }
        .tabla-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #dce1e7;
            padding: 8px 10px;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: #fff;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #f9fbfd;
        }
        .resaltado-cambio {
            background-color: #fff3cd;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="menu-compartido"></div>

        <h1>Historial de Revisiones</h1>

        <div class="filtros-grid">
            <div class="campo-grupo">
                <label for="fechaDesde">Fecha desde (dd/mm/aaaa)</label>
                <input type="text" id="fechaDesde" class="input-fecha-ddmmaaaa" inputmode="numeric" maxlength="10" autocomplete="off">
            </div>

            <div class="campo-grupo">
                <label for="fechaHasta">Fecha hasta (dd/mm/aaaa)</label>
                <input type="text" id="fechaHasta" class="input-fecha-ddmmaaaa" inputmode="numeric" maxlength="10" autocomplete="off">
            </div>

            <div class="campo-grupo">
                <label for="numeroDps">Número DPS</label>
                <input type="text" id="numeroDps" autocomplete="off">
            </div>

            <div class="campo-grupo">
                <label for="proveedorPrincipal">Proveedores (vacío = todos)</label>
                <div class="proveedor-fila-principal">
                    <input type="text" id="proveedorPrincipal" class="input-proveedor" autocomplete="off">
                    <button type="button" id="btnAgregarProveedor" class="btn-mas-proveedor" title="Agregar otro proveedor">+</button>
                </div>
                <div id="proveedoresExtras" class="proveedores-extras-vertical"></div>
            </div>
        </div>

        <div class="acciones-filtro">
            <button type="button" id="btnFiltrar" class="btn btn-buscar">Buscar</button>
            <button type="button" id="btnLimpiar" class="btn btn-limpiar">Limpiar filtros</button>
        </div>

        <div id="estadoConsulta" class="estado-info">Cargando movimientos...</div>

        <div class="tabla-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>DPS</th>
                        <th>Proveedor</th>
                        <th>Detalle / Cambios</th>
                    </tr>
                </thead>
                <tbody id="cuerpoHistorial"></tbody>
            </table>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        // Configurá aquí tu cliente de Supabase si no lo cargás desde otro archivo común
        const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
        const SUPABASE_ANON_KEY = "TU_SUPABASE_ANON_KEY";
        const supabaseClient = (typeof _supabase !== "undefined")
            ? _supabase
            : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let todosLosRegistros = [];

        // Formatea dígitos de corrido a dd/mm/aaaa insertando "/" automáticamente
        function aplicarMascaraFecha(input) {
            input.addEventListener("input", function() {
                let soloDigitos = this.value.replace(/\D/g, "").slice(0, 8);
                let formateada = "";

                if (soloDigitos.length > 0) {
                    formateada = soloDigitos.slice(0, 2);
                }
                if (soloDigitos.length >= 3) {
                    formateada += "/" + soloDigitos.slice(2, 4);
                }
                if (soloDigitos.length >= 5) {
                    formateada += "/" + soloDigitos.slice(4, 8);
                }

                this.value = formateada;
            });
        }

        // Convierte fecha dd/mm/aaaa a objeto Date (inicio o fin de día) para comparar
        function parsearFechaDDMMAAAA(texto, finDeDia = false) {
            const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto.trim());
            if (!match) return null;

            const dia = parseInt(match[1], 10);
            const mes = parseInt(match[2], 10) - 1;
            const anio = parseInt(match[3], 10);

            const fecha = finDeDia
                ? new Date(anio, mes, dia, 23, 59, 59, 999)
                : new Date(anio, mes, dia, 0, 0, 0, 0);

            // Validar que la fecha exista realmente (ej. evitar 31/02/2026)
            if (
                fecha.getFullYear() !== anio ||
                fecha.getMonth() !== mes ||
                fecha.getDate() !== dia
            ) {
                return null;
            }
            return fecha;
        }

        // Formatea cualquier fecha de la BD a dd/mm/aaaa
        function formatearFechaLista(valorFecha) {
            if (!valorFecha) return "";
            const fecha = new Date(valorFecha);
            if (isNaN(fecha.getTime())) return String(valorFecha);

            const dia = String(fecha.getDate()).padStart(2, "0");
            const mes = String(fecha.getMonth() + 1).padStart(2, "0");
            const anio = fecha.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }

        // Agrega un nuevo cuadradito vertical para otro proveedor
        function agregarCuadritoProveedor(valorInicial = "") {
            const contenedor = document.getElementById("proveedoresExtras");
            const fila = document.createElement("div");
            fila.className = "extra-proveedor-item";

            const input = document.createElement("input");
            input.type = "text";
            input.className = "input-proveedor";
            input.value = valorInicial;
            input.autocomplete = "off";

            const btnQuitar = document.createElement("button");
            btnQuitar.type = "button";
            btnQuitar.className = "btn-quitar-proveedor";
            btnQuitar.textContent = "×";
            btnQuitar.title = "Quitar este proveedor";
            btnQuitar.addEventListener("click", function() {
                fila.remove();
                aplicarFiltros();
            });

            input.addEventListener("input", aplicarFiltros);

            fila.appendChild(input);
            fila.appendChild(btnQuitar);
            contenedor.appendChild(fila);
            input.focus();
        }

        function obtenerProveedoresSeleccionados() {
            const inputs = document.querySelectorAll(".input-proveedor");
            const lista = [];
            inputs.forEach(inp => {
                const limpio = inp.value.trim().toLowerCase();
                if (limpio !== "") {
                    lista.push(limpio);
                }
            });
            return lista;
        }

        async function cargarHistorial() {
            const estado = document.getElementById("estadoConsulta");
            estado.textContent = "Cargando historial desde Supabase...";

            const { data, error } = await supabaseClient
                .from("historial_revisiones")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                estado.textContent = "Error al cargar historial: " + error.message;
                return;
            }

            todosLosRegistros = data || [];
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const desdeTexto = document.getElementById("fechaDesde").value.trim();
            const hastaTexto = document.getElementById("fechaHasta").value.trim();
            const dpsFiltro = document.getElementById("numeroDps").value.trim().toLowerCase();
            const proveedoresFiltro = obtenerProveedoresSeleccionados();
            const estado = document.getElementById("estadoConsulta");

            const fechaDesde = desdeTexto ? parsearFechaDDMMAAAA(desdeTexto, false) : null;
            const fechaHasta = hastaTexto ? parsearFechaDDMMAAAA(hastaTexto, true) : null;

            if (desdeTexto.length === 10 && !fechaDesde) {
                estado.textContent = "La fecha 'desde' no es válida (usá dd/mm/aaaa).";
                return;
            }
            if (hastaTexto.length === 10 && !fechaHasta) {
                estado.textContent = "La fecha 'hasta' no es válida (usá dd/mm/aaaa).";
                return;
            }

            const filtrados = todosLosRegistros.filter(reg => {
                // Ajustá los nombres de campo según tu tabla historial_revisiones
                const rawFecha = reg.fecha_revision || reg.fecha || reg.created_at;
                const fechaReg = rawFecha ? new Date(rawFecha) : null;
                const dpsReg = String(reg.numero_dps || reg.dps || "").toLowerCase();
                const provReg = String(reg.proveedor || reg.prestador || "").toLowerCase();

                if (fechaDesde && (!fechaReg || fechaReg < fechaDesde)) return false;
                if (fechaHasta && (!fechaReg || fechaReg > fechaHasta)) return false;
                if (dpsFiltro && !dpsReg.includes(dpsFiltro)) return false;

                // Si no se ingresó ningún proveedor, toma todos
                if (proveedoresFiltro.length > 0) {
                    const coincideAlguno = proveedoresFiltro.some(p => provReg.includes(p));
                    if (!coincideAlguno) return false;
                }

                return true;
            });

            renderizarTabla(filtrados);
            estado.textContent = `Mostrando ${filtrados.length} de ${todosLosRegistros.length} movimientos.`;
        }

        function renderizarTabla(registros) {
            const tbody = document.getElementById("cuerpoHistorial");
            tbody.innerHTML = "";

            if (registros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">No hay movimientos que coincidan con los filtros.</td></tr>`;
                return;
            }

            registros.forEach(reg => {
                const rawFecha = reg.fecha_revision || reg.fecha || reg.created_at;
                const fechaFormateada = formatearFechaLista(rawFecha);
                const dps = reg.numero_dps || reg.dps || "-";
                const proveedor = reg.proveedor || reg.prestador || "-";
                const detalle = reg.detalle || reg.observaciones || reg.cambios || JSON.stringify(reg);

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${fechaFormateada}</td>
                    <td>${dps}</td>
                    <td>${proveedor}</td>
                    <td>${detalle}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".input-fecha-ddmmaaaa").forEach(aplicarMascaraFecha);

            document.getElementById("btnAgregarProveedor").addEventListener("click", function() {
                agregarCuadritoProveedor("");
            });

            document.getElementById("btnFiltrar").addEventListener("click", aplicarFiltros);
            document.getElementById("fechaDesde").addEventListener("input", aplicarFiltros);
            document.getElementById("fechaHasta").addEventListener("input", aplicarFiltros);
            document.getElementById("numeroDps").addEventListener("input", aplicarFiltros);
            document.getElementById("proveedorPrincipal").addEventListener("input", aplicarFiltros);

            document.getElementById("btnLimpiar").addEventListener("click", function() {
                document.getElementById("fechaDesde").value = "";
                document.getElementById("fechaHasta").value = "";
                document.getElementById("numeroDps").value = "";
                document.getElementById("proveedorPrincipal").value = "";
                document.getElementById("proveedoresExtras").innerHTML = "";
                aplicarFiltros();
            });

            cargarHistorial();
        });
    </script>
</body>
</html>
