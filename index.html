<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vivatec Control - Inspección de Extintores</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- PANTALLA 1: MENÚ PRINCIPAL -->
    <div id="pantalla-inicio" class="pantalla activa">
        <header>Vivatec Control</header>
        <div class="menu-contenedor">
            <button class="btn btn-azul" onclick="abrirCamara()">ESCANEAR CÓDIGO QR</button>
            <button class="btn btn-gris" onclick="ingresoManual()">INGRESO MANUAL</button>
            <button class="btn btn-azul" onclick="window.location.href='consultas.html'">VER CONSULTAS / VENCIMIENTOS</button>
        </div>
    </div>

    <!-- PANTALLA 2: LECTOR DE CÁMARA -->
    <div id="pantalla-camara" class="pantalla">
        <header>Escaneando Oblea</header>
        <div id="lector-contenedor"></div>
        <button class="btn btn-rojo" onclick="cancelarCamara()">CANCELAR</button>
    </div>

    <!-- PANTALLA 3: FORMULARIO DE DATOS -->
    <div id="pantalla-formulario" class="pantalla">
        <header>Registrar Recarga</header>
        <div class="form-contenedor">
            <div class="input-grupo">
                <label for="codigo-oblea">Nº de Oblea</label>
                <input type="text" id="codigo-oblea" placeholder="Escaneado o manual">
            </div>

            <div class="input-grupo">
                <label for="extintor-num">Nº de Extintor / Matafuego</label>
                <input type="number" id="extintor-num" placeholder="Ej: 1024">
            </div>

            <button class="btn btn-azul" onclick="irAConfirmacion()">REVISAR DATOS</button>
            <button class="btn btn-gris" onclick="volverAlInicio()">VOLVER</button>
        </div>
    </div>

    <!-- PANTALLA 4: CONFIRMACIÓN Y EDICIÓN PREVIA (NUEVA) -->
    <div id="pantalla-confirmacion" class="pantalla">
        <header>Confirmar Datos</header>
        <div class="form-contenedor">
            <div class="input-grupo">
                <label for="conf-oblea">Nº de Oblea (Editable):</label>
                <input type="text" id="conf-oblea">
            </div>

            <div class="input-grupo">
                <label for="conf-recarga">Fecha de Recarga:</label>
                <input type="date" id="conf-recarga" onchange="calcularVencimientoPrevio()">
            </div>

            <div class="input-grupo">
                <label for="conf-extintor">Nº de Extintor (Editable):</label>
                <input type="number" id="conf-extintor">
            </div>

            <div class="input-grupo">
                <label for="conf-vencimiento">Fecha de Vencimiento (Calculada / Editable):</label>
                <input type="date" id="conf-vencimiento">
            </div>

            <button class="btn btn-azul" onclick="guardarDefinitivo()">CONFIRMAR Y GUARDAR</button>
            <button class="btn btn-gris" onclick="mostrarPantalla('pantalla-formulario')">VOLVER A EDITAR</button>
        </div>
    </div>

    <!-- PANTALLA 5: ÉXITO -->
    <div id="pantalla-exito" class="pantalla">
        <div class="exito-contenedor">
            <div class="icono-tilde">✓</div>
            <h2>¡Guardado Exitoso!</h2>
            <p>El registro se envió correctamente a la base de datos.</p>
        </div>
    </div>

    <!-- Librería de QR y Script principal -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="escaner.js"></script>
</body>
</html>
