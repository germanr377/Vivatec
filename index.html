<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vivatec Control</title>
    
    <!-- 1. Llamamos a tu archivo de diseño (CSS) -->
    <link rel="stylesheet" href="estilos.css">
    
    <!-- 2. Llamamos a la librería del lector QR de internet -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <header>Vivatec Control</header>

    <!-- PANTALLA 1: LA CÁMARA -->
    <div id="pantalla-escaner" class="pantalla activa">
        <div id="lector-contenedor"></div>
        <button class="btn btn-verde" id="btn-iniciar-camara" onclick="iniciarCamara()">PRENDER CÁMARA</button>
    </div>

    <!-- PANTALLA 2: EL FORMULARIO -->
    <div id="pantalla-formulario" class="pantalla">
        <div class="tarjeta-info">
            <span style="color: #4CAF50;">✅ Oblea Leída:</span><br>
            <strong id="codigo-leido">Esperando código...</strong>
        </div>
        <div class="grupo-input">
            <label for="extintor-num">Nº de Extintor Físico:</label>
            <input type="number" id="extintor-num" placeholder="Ej: 555">
        </div>
        <button class="btn btn-azul" onclick="simularGuardado()">GUARDAR RECARGA</button>
        <button class="btn btn-gris" onclick="volverAEscanear()">CANCELAR</button>
    </div>

    <!-- PANTALLA 3: ÉXITO -->
    <div id="pantalla-exito" class="pantalla">
        <div class="icono-exito">✔️</div>
        <div class="texto-exito">Recarga guardada<br>correctamente.</div>
    </div>

    <!-- 3. Llamamos a tu archivo con la lógica de la cámara (JS) al final -->
    <script src="escaner.js"></script>
</body>
</html>
