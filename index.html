<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vivatec Control</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <header>Vivatec Control</header>

    <!-- PANTALLA 1: MENÚ DE INICIO -->
    <div id="pantalla-inicio" class="pantalla activa">
        <button class="btn btn-verde" onclick="abrirCamara()">ESCANEAR CON CÁMARA</button>
        <button class="btn btn-gris" onclick="ingresoManual()">CARGA MANUAL</button>
    </div>

    <!-- PANTALLA 2: LA CÁMARA -->
    <div id="pantalla-camara" class="pantalla">
        <div id="lector-contenedor"></div>
        <button class="btn btn-rojo" onclick="cancelarCamara()">VOLVER AL INICIO</button>
    </div>

    <!-- PANTALLA 3: EL FORMULARIO -->
    <div id="pantalla-formulario" class="pantalla">
        <div class="grupo-input">
            <label for="codigo-oblea">Nº de Oblea / Tarjeta:</label>
            <input type="text" id="codigo-oblea" placeholder="Ej: 3B 00489297">
        </div>

        <div class="grupo-input">
            <label for="extintor-num">Nº de Extintor Físico:</label>
            <input type="number" id="extintor-num" placeholder="Ej: 555">
        </div>
        
        <button class="btn btn-azul" onclick="simularGuardado()">GUARDAR RECARGA</button>
        <button class="btn btn-rojo" onclick="volverAlInicio()">VOLVER AL INICIO</button>
    </div>

    <!-- PANTALLA 4: ÉXITO -->
    <div id="pantalla-exito" class="pantalla">
        <div class="icono-exito">✔️</div>
        <div class="texto-exito">Recarga guardada<br>correctamente.</div>
    </div>

    <script src="escaner.js"></script>
</body>
</html>
