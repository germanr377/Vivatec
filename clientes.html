<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivatec - Gestión de Clientes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Menú Compartido -->
    <script src="menu.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
        
        .header-seccion { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2980b9; padding-bottom: 10px; margin-bottom: 20px; }
        .header-seccion h2 { margin: 0; color: #2c3e50; }

        .btn { background: #2980b9; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1f618d; }
        .btn-volver { background: #7f8c8d; }
        .btn-volver:hover { background: #626567; }
        .btn-buscar { background: #27ae60; }
        .btn-buscar:hover { background: #219653; }
        .btn-renombrar { background: #8e44ad; }
        .btn-renombrar:hover { background: #732d91; }
        .btn-eliminar { background: #c0392b; padding: 5px 10px; font-size: 11px; }
        .btn-eliminar:hover { background: #962d22; }
        .btn-editar { background: #f39c12; padding: 5px 10px; font-size: 11px; color: white; }
        .btn-editar:hover { background: #d68910; }

        /* Formulario de Carga / Edición / Búsqueda */
        .form-card { background: #fafafa; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #555; display: flex; justify-content: space-between; }
        .form-group input, .form-group textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .form-group textarea { resize: vertical; height: 40px; }
        .form-acciones { margin-top: 15px; text-align: right; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

        /* Badge de estado (Nuevo / Existente / Renombrar) */
        .badge-estado { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .badge-nuevo { background: #e8f8f5; color: #16a085; border: 1px solid #a3e4d7; }
        .badge-existente { background: #ebf5fb; color: #2980b9; border: 1px solid #aed6f1; }
        .badge-renombrar { background: #f5eef8; color: #8e44ad; border: 1px solid #d7bde2; }

        /* Tabla de Clientes */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #2980b9; color: white; cursor: pointer; user-select: none; }
        th:hover { background: #2471a3; }
        th span { font-size: 10px; float: right; }
        tr:nth-child(even) { background: #f9f9f9; }

        .acciones-td { white-space: nowrap; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-seccion">
        <h2>🏢 Directorio de Clientes</h2>
        <div>
            <button class="btn btn-volver" onclick="window.location.href='gestion.html'">⬅️ Volver a Gestión</button>
        </div>
    </div>

    <!-- Formulario / Panel de Filtros y Carga -->
    <div class="form-card">
        <h3 id="formTitulo" style="margin-top: 0; font-size: 15px; color: #2980b9;">
            ➕ Agregar / Buscar Cliente <span id="spanBadgeEstado"></span>
        </h3>
        <input type="hidden" id="clienteId">
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre Comercial / Corto * <span id="lblEstadoCliente"></span></label>
                <input type="text" id="nombre_cliente" list="sugerenciasClientes" oninput="verificarPredictivo()">
                <datalist id="sugerenciasClientes">
                    <!-- Se llena dinámicamente -->
                </datalist>
            </div>
            <div class="form-group">
                <label>Razón Social (Legal)</label>
                <input type="text" id="razon_social">
            </div>
            <div class="form-group">
                <label>CUIT</label>
                <input type="text" id="cuit">
            </div>
            <div class="form-group">
                <label>Nombre de Contacto</label>
                <input type="text" id="nombre_contacto">
            </div>
            <div class="form-group">
                <label>Dirección / Domicilio</label>
                <input type="text" id="direccion">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="telefono">
            </div>
        </div>
        <div class="form-group" style="margin-top: 10px;">
            <label>Observaciones / Notas</label>
            <textarea id="observaciones"></textarea>
        </div>
        <div class="form-acciones">
            <button class="btn btn-buscar" onclick="filtrarClientesPorCampos()">🔍 Buscar</button>
            <button class="btn btn-renombrar" id="btnRenombrar" onclick="activarModoRenombrar()">🏷️ Renombrar</button>
            <button class="btn" id="btnGuardar" onclick="guardarCliente()">💾 Guardar Cliente</button>
            <button class="btn btn-volver" id="btnLimpiar" onclick="limpiarFormularioYFiltros()">🧹 Limpiar / Ver Todos</button>
            <button class="btn btn-volver" id="btnCancelar" onclick="limpiarFormularioYFiltros()" style="display:none;">❌ Cancelar</button>
        </div>
    </div>

    <!-- Listado de Clientes -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
        <h3 id="tituloLista" style="font-size: 14px; color: #555; margin: 0;">Clientes Registrados</h3>
        <span id="contadorResultados" style="font-size: 12px; color: #777;"></span>
    </div>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th onclick="ordenarTabla('nombre_cliente')">Nombre Comercial <span id="sort_nombre_cliente">↕</span></th>
                    <th onclick="ordenarTabla('razon_social')">Razón Social <span id="sort_razon_social">↕</span></th>
                    <th onclick="ordenarTabla('cuit')">CUIT <span id="sort_cuit">↕</span></th>
                    <th onclick="ordenarTabla('nombre_contacto')">Contacto <span id="sort_nombre_contacto">↕</span></th>
                    <th onclick="ordenarTabla('direccion')">Dirección <span id="sort_direccion">↕</span></th>
                    <th onclick="ordenarTabla('telefono')">Teléfono <span id="sort_telefono">↕</span></th>
                    <th onclick="ordenarTabla('observaciones')">Observaciones <span id="sort_observaciones">↕</span></th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaClientesBody">
                <!-- Se llena dinámicamente con JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://cpgdqzrvtensoruahgxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o529qydnYQpc1UBoqttXpQ_hfdLAWb9";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let clientesCache = [];
    let clientesFiltrados = [];
    let columnaOrdenActual = 'nombre_cliente';
    let ordenAscendente = true;
    let modoRenombrar = false;

    // 🔒 SEGURIDAD: Validar sesión activa al cargar la página
    window.addEventListener("load", async function() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }
        await cargarClientes();
    });

    // Función para obtener y listar los clientes
    async function cargarClientes() {
        const { data, error } = await _supabase
            .from('clientes')
            .select('*')
            .order('nombre_cliente', { ascending: true });

        if (error) {
            console.error("Error al cargar clientes:", error);
            alert("⚠️ Error al obtener la lista de clientes.");
            return;
        }

        clientesCache = data || [];
        clientesFiltrados = [...clientesCache];
        actualizarDatalist();
        renderizarTabla(clientesFiltrados);
    }

    // Actualizar el datalist predictivo
    function actualizarDatalist() {
        const datalist = document.getElementById("sugerenciasClientes");
        datalist.innerHTML = "";
        clientesCache.forEach(c => {
            if (c.nombre_cliente) {
                let option = document.createElement("option");
                option.value = c.nombre_cliente;
                datalist.appendChild(option);
            }
        });
    }

    // Activar modo exclusivo para renombrar el cliente actual sin crear duplicados
    function activarModoRenombrar() {
        const idActual = document.getElementById("clienteId").value;
        const nombreInput = document.getElementById("nombre_cliente");
        const val = nombreInput.value.trim().toLowerCase();

        let clienteObjetivo = null;

        if (idActual) {
            clienteObjetivo = clientesCache.find(c => c.id == idActual);
        } else if (val) {
            clienteObjetivo = clientesCache.find(c => c.nombre_cliente && c.nombre_cliente.toLowerCase() === val);
        }

        if (!clienteObjetivo) {
            alert("⚠️ Primero seleccioná un cliente existente (con el botón ✏️ de la tabla o escribiendo su nombre actual) para poder renombrarlo.");
            return;
        }

        modoRenombrar = true;
        document.getElementById("clienteId").value = clienteObjetivo.id;
        document.getElementById("razon_social").value = clienteObjetivo.razon_social || '';
        document.getElementById("cuit").value = clienteObjetivo.cuit || '';
        document.getElementById("nombre_contacto").value = clienteObjetivo.nombre_contacto || '';
        document.getElementById("direccion").value = clienteObjetivo.direccion || '';
        document.getElementById("telefono").value = clienteObjetivo.telefono || '';
        document.getElementById("observaciones").value = clienteObjetivo.observaciones || '';

        document.getElementById("lblEstadoCliente").innerHTML = `<span class="badge-estado badge-renombrar">🏷️ Solo Renombrando</span>`;
        document.getElementById("formTitulo").textContent = "🏷️ Renombrar Cliente (Sin Duplicar)";
        document.getElementById("btnGuardar").textContent = "💾 Guardar Nuevo Nombre";
        document.getElementById("btnCancelar").style.display = "inline-block";

        nombreInput.focus();
        nombreInput.select();
    }

    // Predictivo: detecta si el nombre escrito coincide con uno existente o es nuevo
    function verificarPredictivo() {
        // Si estamos renombrando un cliente fijado, no pisar clienteId ni cambiar a "Nuevo"
        if (modoRenombrar && document.getElementById("clienteId").value) {
            return;
        }

        const val = document.getElementById("nombre_cliente").value.trim().toLowerCase();
        const lbl = document.getElementById("lblEstadoCliente");

        if (!val) {
            lbl.innerHTML = "";
            document.getElementById("clienteId").value = "";
            return;
        }

        const encontrado = clientesCache.find(c => c.nombre_cliente && c.nombre_cliente.toLowerCase() === val);
        const coincideParcial = clientesCache.some(c => c.nombre_cliente && c.nombre_cliente.toLowerCase().startsWith(val));
        
        if (encontrado) {
            // Si coincide exactamente con uno existente, cargamos sus datos para edición rápida
            document.getElementById("clienteId").value = encontrado.id;
            document.getElementById("razon_social").value = encontrado.razon_social || '';
            document.getElementById("cuit").value = encontrado.cuit || '';
            document.getElementById("nombre_contacto").value = encontrado.nombre_contacto || '';
            document.getElementById("direccion").value = encontrado.direccion || '';
            document.getElementById("telefono").value = encontrado.telefono || '';
            document.getElementById("observaciones").value = encontrado.observaciones || '';
            
            lbl.innerHTML = `<span class="badge-estado badge-existente">📋 Existente (Editando)</span>`;
            document.getElementById("formTitulo").textContent = "✏️ Editar Cliente Existente";
            document.getElementById("btnGuardar").textContent = "💾 Actualizar Cliente";
            document.getElementById("btnCancelar").style.display = "inline-block";
        } else if (coincideParcial) {
            // Mientras escribe y coincide parcialmente con sugerencias, mantenemos limpio el ID
            document.getElementById("clienteId").value = "";
            lbl.innerHTML = `<span class="badge-estado badge-existente">🔍 Buscando...</span>`;
        } else {
            // Si no coincide con ninguno, se marca como NUEVO
            document.getElementById("clienteId").value = "";
            lbl.innerHTML = `<span class="badge-estado badge-nuevo">✨ Nuevo (Se agregará)</span>`;
            document.getElementById("formTitulo").textContent = "➕ Agregar Nuevo Cliente";
            document.getElementById("btnGuardar").textContent = "💾 Guardar Cliente";
            document.getElementById("btnCancelar").style.display = "none";
        }
    }

    // Filtrar la lista de abajo utilizando los datos colocados en los campos superiores al presionar Buscar
    function filtrarClientesPorCampos() {
        const fNombre = document.getElementById("nombre_cliente").value.trim().toLowerCase();
        const fRazon = document.getElementById("razon_social").value.trim().toLowerCase();
        const fCuit = document.getElementById("cuit").value.trim().toLowerCase();
        const fContacto = document.getElementById("nombre_contacto").value.trim().toLowerCase();
        const fDireccion = document.getElementById("direccion").value.trim().toLowerCase();
        const fTelefono = document.getElementById("telefono").value.trim().toLowerCase();
        const fObservaciones = document.getElementById("observaciones").value.trim().toLowerCase();

        clientesFiltrados = clientesCache.filter(c => {
            let match = true;
            if (fNombre && (!c.nombre_cliente || !c.nombre_cliente.toLowerCase().includes(fNombre))) match = false;
            if (fRazon && (!c.razon_social || !c.razon_social.toLowerCase().includes(fRazon))) match = false;
            if (fCuit && (!c.cuit || !c.cuit.toLowerCase().includes(fCuit))) match = false;
            if (fContacto && (!c.nombre_contacto || !c.nombre_contacto.toLowerCase().includes(fContacto))) match = false;
            if (fDireccion && (!c.direccion || !c.direccion.toLowerCase().includes(fDireccion))) match = false;
            if (fTelefono && (!c.telefono || !c.telefono.toLowerCase().includes(fTelefono))) match = false;
            if (fObservaciones && (!c.observaciones || !c.observaciones.toLowerCase().includes(fObservaciones))) match = false;
            return match;
        });

        renderizarTabla(clientesFiltrados);
        document.getElementById("contadorResultados").textContent = `(${clientesFiltrados.length} resultados encontrados)`;
    }

    // Ordenar tabla al hacer clic en los encabezados
    function ordenarTabla(columna) {
        if (columnaOrdenActual === columna) {
            ordenAscendente = !ordenAscendente;
        } else {
            columnaOrdenActual = columna;
            ordenAscendente = true;
        }

        ['nombre_cliente', 'razon_social', 'cuit', 'nombre_contacto', 'direccion', 'telefono', 'observaciones'].forEach(col => {
            const span = document.getElementById(`sort_${col}`);
            if (span) span.textContent = '↕';
        });
        document.getElementById(`sort_${columna}`).textContent = ordenAscendente ? '▲' : '▼';

        clientesFiltrados.sort((a, b) => {
            let valA = (a[columna] || '').toString().toLowerCase();
            let valB = (b[columna] || '').toString().toLowerCase();

            if (valA < valB) return ordenAscendente ? -1 : 1;
            if (valA > valB) return ordenAscendente ? 1 : -1;
            return 0;
        });

        renderizarTabla(clientesFiltrados);
    }

    // Renderizar la tabla de clientes
    function renderizarTabla(data) {
        const tbody = document.getElementById("tablaClientesBody");
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #777;">No se encontraron clientes con los criterios indicados.</td></tr>`;
            return;
        }

        data.forEach(c => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${escapeHtml(c.nombre_cliente || '-')}</strong></td>
                <td>${escapeHtml(c.razon_social || '-')}</td>
                <td>${escapeHtml(c.cuit || '-')}</td>
                <td>${escapeHtml(c.nombre_contacto || '-')}</td>
                <td>${escapeHtml(c.direccion || '-')}</td>
                <td>${escapeHtml(c.telefono || '-')}</td>
                <td>${escapeHtml(c.observaciones || '-')}</td>
                <td class="acciones-td">
                    <button class="btn btn-editar" onclick="prepararEdicion('${c.id}')" title="Editar">✏️</button>
                    <button class="btn btn-eliminar" onclick="eliminarCliente('${c.id}')" title="Eliminar">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Guardar o Actualizar Cliente
    async function guardarCliente() {
        const id = document.getElementById("clienteId").value;
        const nombre_cliente = document.getElementById("nombre_cliente").value.trim();

        if (!nombre_cliente) {
            alert("⚠️ El nombre comercial del cliente es obligatorio.");
            return;
        }

        // Si está activo el modo renombrar sobre un ID existente, actualizamos solo nombre_cliente
        if (modoRenombrar && id) {
            const { error } = await _supabase
                .from('clientes')
                .update({ nombre_cliente })
                .eq('id', id);

            if (error) {
                alert("⚠️ Error al renombrar el cliente: " + error.message);
                return;
            }
            alert("✅ Nombre del cliente actualizado sin duplicar.");
            limpiarFormularioYFiltros();
            await cargarClientes();
            return;
        }

        const razon_social = document.getElementById("razon_social").value.trim();
        const cuit = document.getElementById("cuit").value.trim();
        const nombre_contacto = document.getElementById("nombre_contacto").value.trim();
        const direccion = document.getElementById("direccion").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const observaciones = document.getElementById("observaciones").value.trim();

        const datosCliente = {
            nombre_cliente,
            razon_social: razon_social || null,
            cuit: cuit || null,
            nombre_contacto: nombre_contacto || null,
            direccion: direccion || null,
            telefono: telefono || null,
            observaciones: observaciones || null
        };

        if (id) {
            const { error } = await _supabase
                .from('clientes')
                .update(datosCliente)
                .eq('id', id);

            if (error) {
                alert("⚠️ Error al actualizar el cliente: " + error.message);
                return;
            }
            alert("✅ Cliente actualizado con éxito.");
        } else {
            const { error } = await _supabase
                .from('clientes')
                .insert([datosCliente]);

            if (error) {
                alert("⚠️ Error al guardar el cliente (¿El CUIT ya existe?): " + error.message);
                return;
            }
            alert("✅ Cliente guardado con éxito.");
        }

        limpiarFormularioYFiltros();
        await cargarClientes();
    }

    // Preparar formulario para editar buscando por ID desde la tabla
    function prepararEdicion(id) {
        const c = clientesCache.find(item => item.id == id);
        if (!c) return;

        modoRenombrar = false;
        document.getElementById("clienteId").value = c.id;
        document.getElementById("nombre_cliente").value = c.nombre_cliente || '';
        document.getElementById("razon_social").value = c.razon_social || '';
        document.getElementById("cuit").value = c.cuit || '';
        document.getElementById("nombre_contacto").value = c.nombre_contacto || '';
        document.getElementById("direccion").value = c.direccion || '';
        document.getElementById("telefono").value = c.telefono || '';
        document.getElementById("observaciones").value = c.observaciones || '';

        document.getElementById("formTitulo").textContent = "✏️ Editar Cliente";
        document.getElementById("lblEstadoCliente").innerHTML = `<span class="badge-estado badge-existente">📋 Existente</span>`;
        document.getElementById("btnGuardar").textContent = "💾 Actualizar Cliente";
        document.getElementById("btnCancelar").style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Limpiar formulario y restablecer la tabla completa
    function limpiarFormularioYFiltros() {
        modoRenombrar = false;
        document.getElementById("clienteId").value = "";
        document.getElementById("nombre_cliente").value = "";
        document.getElementById("razon_social").value = "";
        document.getElementById("cuit").value = "";
        document.getElementById("nombre_contacto").value = "";
        document.getElementById("direccion").value = "";
        document.getElementById("telefono").value = "";
        document.getElementById("observaciones").value = "";
        document.getElementById("lblEstadoCliente").innerHTML = "";

        document.getElementById("formTitulo").textContent = "➕ Agregar / Buscar Cliente";
        document.getElementById("btnGuardar").textContent = "💾 Guardar Cliente";
        document.getElementById("btnCancelar").style.display = "none";
        
        clientesFiltrados = [...clientesCache];
        renderizarTabla(clientesFiltrados);
        document.getElementById("contadorResultados").textContent = "";
    }

    // Eliminar Cliente
    async function eliminarCliente(id) {
        if (!confirm("⚠️ ¿Estás seguro de eliminar este cliente?")) return;

        const { error } = await _supabase
            .from('clientes')
            .delete()
            .eq('id', id);

        if (error) {
            alert("⚠️ No se pudo eliminar el cliente: " + error.message);
            return;
        }

        alert("🗑️ Cliente eliminado correctamente.");
        await cargarClientes();
    }

    // Utilidad para escapar texto y prevenir XSS (Corregida la sintaxis)
    function escapeHtml(text) {
        if (!text) return '';
        return text
            .toString()
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
